name: Apply remove PARALLEL UNIVERSE + drawdown fix

on:
  push:
    branches: [fix/daily-profit-drawdown-validation]
    paths:
      - "scripts/remove-parallel-universe-and-fix-drawdown.py"
      - ".github/workflows/apply-remove-parallel-universe-fix-drawdown.yml"

permissions:
  contents: write

concurrency:
  group: apply-remove-parallel-universe-fix-drawdown
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply isolated runtime cleanup
        run: python3 scripts/remove-parallel-universe-and-fix-drawdown.py

      - name: Static isolation checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          web = Path('apps/web/app/dashboard/page.tsx').read_text(encoding='utf-8')
          ea = Path('mt5/FastBasketBot.mq5').read_text(encoding='utf-8')
          api = '\n'.join(p.read_text(encoding='utf-8') for p in Path('apps/api').rglob('*.ts'))
          assert 'PARALLEL_UNIVERSE' not in web
          assert 'ParallelUniverseModeEnabled()' not in ea
          assert 'HandleParallelUniverseMode(' not in ea
          assert 'PARALLEL_UNIVERSE' not in api
          assert 'props.onEdit?.("dailyProfitDrawdownPercent",0);' not in web
          for token in ('FLIP_LOCK','RACE','ZERO_GRID','MANUAL','AUTO'):
              assert token in web
          print('isolation checks passed')
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build web and API
        run: npm run build

      - name: Commit validated runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/app/dashboard/page.tsx apps/api mt5/FastBasketBot.mq5 mt5/include/LiveExecutionModesV1.mqh
          if git diff --cached --quiet; then
            echo "Patch already current."
            exit 0
          fi
          git commit -m "fix: remove PARALLEL UNIVERSE and allow drawdown disabled value"
          git push origin HEAD:fix/daily-profit-drawdown-validation
