name: Apply Symbol Authority Display Temporary

on:
  push:
    branches:
      - fix/symbol-authority-single-source

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/symbol-authority-single-source
          fetch-depth: 0
      - name: Align dashboard settings state to dedicated selected symbol
        shell: python
        run: |
          from pathlib import Path
          page = Path('apps/web/app/dashboard/page.tsx')
          text = page.read_text(encoding='utf-8')
          old = '''        const nextSettings:any = {\n          ...defaultSettings,\n          ...(d.settings || {})\n        };'''
          new = '''        const nextSettings:any = {\n          ...defaultSettings,\n          ...(d.settings || {}),\n          ...(d.settings?.startupSymbol ? { symbol: d.settings.startupSymbol } : {})\n        };'''
          if old not in text:
              raise SystemExit('dashboard selected-symbol display anchor not found')
          text = text.replace(old, new, 1)
          page.write_text(text, encoding='utf-8')

          test = Path('tests/trading-symbol-selection-contract.ps1')
          text = test.read_text(encoding='utf-8')
          anchor = "Assert-Contains $dashboard 'delete payload.symbol;' 'dashboard settings cannot submit a symbol override'\n"
          add = anchor + "Assert-Contains $dashboard 'd.settings?.startupSymbol' 'dashboard displays the dedicated selected symbol instead of live telemetry'\n"
          if anchor not in text:
              raise SystemExit('dashboard contract assertion anchor not found')
          text = text.replace(anchor, add, 1)
          test.write_text(text, encoding='utf-8')
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-symbol-authority-display-temp.yml
          git config user.name "scenova-build"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/app/dashboard/page.tsx tests/trading-symbol-selection-contract.ps1 .github/workflows/apply-symbol-authority-display-temp.yml
          git commit -m "fix: display the dedicated selected Trading Symbol"
          git push origin HEAD:fix/symbol-authority-single-source
