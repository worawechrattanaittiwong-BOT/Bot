name: Owner Mobile CI

on:
  pull_request:
    paths:
      - "apps/owner-mobile/**"
      - "apps/api/src/owner-mobile.controller.ts"
      - "apps/api/src/app.module.ts"
      - "database/036_owner_mobile.sql"
      - "tests/owner-mobile-contract.mjs"
      - "package.json"
      - ".github/workflows/owner-mobile-ci.yml"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web/API workspaces
        run: npm install
      - name: API typecheck
        run: npm run typecheck -w @bot/api
      - name: Install owner mobile dependencies separately
        run: npm install
        working-directory: apps/owner-mobile
      - name: Owner mobile typecheck
        run: npm run typecheck
        working-directory: apps/owner-mobile
      - name: Owner mobile security contract
        run: node ./tests/owner-mobile-contract.mjs
