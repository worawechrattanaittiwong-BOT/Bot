name: Apply Symbol Authority Temporary

on:
  push:
    branches:
      - fix/symbol-authority-single-source

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/symbol-authority-single-source
          fetch-depth: 0
      - name: Apply narrow symbol authority patch
        shell: python
        run: |
          from pathlib import Path

          page = Path('apps/web/app/dashboard/page.tsx')
          text = page.read_text(encoding='utf-8')
          old = '''        const nextSettings:any = {\n          ...defaultSettings,\n          ...(d.settings || {}),\n          ...(d.instance?.metrics?.symbol ? { symbol: d.instance.metrics.symbol } : {})\n        };'''
          new = '''        const nextSettings:any = {\n          ...defaultSettings,\n          ...(d.settings || {})\n        };'''
          if old not in text:
              raise SystemExit('dashboard settings symbol override anchor not found')
          text = text.replace(old, new, 1)

          old = '      const payload:any = { ...settings };\n      delete payload.tradingProfile;'
          new = '      const payload:any = { ...settings };\n      // Trading Symbol page is the only authority allowed to change the configured symbol.\n      delete payload.symbol;\n      delete payload.tradingProfile;'
          if old not in text:
              raise SystemExit('dashboard settings payload anchor not found')
          text = text.replace(old, new, 1)
          page.write_text(text, encoding='utf-8')

          bot = Path('apps/api/src/bot.controller.ts')
          text = bot.read_text(encoding='utf-8')
          old = '''    if (body.symbol !== undefined) {\n      const symbol = String(body.symbol || "").trim();\n      if (!symbol || symbol.length > 64 || !/^[A-Za-z0-9._#-]+$/.test(symbol)) {\n        throw new BadRequestException("Symbol ไม่ถูกต้อง");\n      }\n      clean.symbol = symbol;\n    }\n'''
          new = '''    // Trading Symbol is intentionally not writable through generic bot settings.\n    // /bot/trading-symbol is the single authority so runtime telemetry or other\n    // settings screens cannot silently move an account to another market.\n'''
          if old not in text:
              raise SystemExit('generic symbol write block not found')
          text = text.replace(old, new, 1)
          bot.write_text(text, encoding='utf-8')

          controller = Path('apps/api/src/trading-symbol.controller.ts')
          text = controller.read_text(encoding='utf-8')
          first_old = 'const desiredSymbol = explicitSymbol || activeSymbol || fallbackSymbol || "XAUUSD";'
          first_new = 'const desiredSymbol = explicitSymbol || fallbackSymbol || activeSymbol || "XAUUSD";'
          second_old = 'const desiredSymbol = explicitSymbol || currentSymbol || legacySavedSymbol || "XAUUSD";'
          second_new = 'const desiredSymbol = explicitSymbol || legacySavedSymbol || currentSymbol || "XAUUSD";'
          if first_old not in text:
              raise SystemExit('customer desired symbol precedence anchor not found')
          if second_old not in text:
              raise SystemExit('agent desired symbol precedence anchor not found')
          text = text.replace(first_old, first_new, 1)
          text = text.replace(second_old, second_new, 1)

          old = '''      `INSERT INTO bot_settings(bot_instance_id,settings,updated_at)\n       VALUES($1,jsonb_build_object('startupSymbol',$2::text),now())\n       ON CONFLICT(bot_instance_id)\n       DO UPDATE SET\n         settings=jsonb_set(COALESCE(bot_settings.settings,'{}'::jsonb),'{startupSymbol}',to_jsonb($2::text),true),\n         updated_at=now()`,'''
          new = '''      `INSERT INTO bot_settings(bot_instance_id,settings,updated_at)\n       VALUES($1,jsonb_build_object('startupSymbol',$2::text,'symbol',$2::text),now())\n       ON CONFLICT(bot_instance_id)\n       DO UPDATE SET\n         settings=jsonb_set(\n           jsonb_set(COALESCE(bot_settings.settings,'{}'::jsonb),'{startupSymbol}',to_jsonb($2::text),true),\n           '{symbol}',to_jsonb($2::text),true\n         ),\n         updated_at=now()`,'''
          if old not in text:
              raise SystemExit('trading symbol persistence anchor not found')
          text = text.replace(old, new, 1)
          controller.write_text(text, encoding='utf-8')

          test = Path('tests/trading-symbol-selection-contract.ps1')
          text = test.read_text(encoding='utf-8')
          old = "$controller = Read-Text 'apps/api/src/trading-symbol.controller.ts'\n$interceptor = Read-Text 'apps/api/src/trading-symbol.interceptor.ts'"
          new = "$controller = Read-Text 'apps/api/src/trading-symbol.controller.ts'\n$botController = Read-Text 'apps/api/src/bot.controller.ts'\n$dashboard = Read-Text 'apps/web/app/dashboard/page.tsx'\n$interceptor = Read-Text 'apps/api/src/trading-symbol.interceptor.ts'"
          if old not in text:
              raise SystemExit('test source anchor not found')
          text = text.replace(old, new, 1)
          anchor = "Assert-Contains $controller 'startupSymbol' 'explicit desired symbol is stored separately from live metrics'\n"
          add = anchor + "Assert-Contains $controller \"'{symbol}',to_jsonb\" 'dedicated symbol selection synchronizes canonical configured symbol'\nAssert-Contains $controller 'explicitSymbol || fallbackSymbol || activeSymbol' 'stored configured symbol wins over live telemetry fallback'\nAssert-Contains $controller 'explicitSymbol || legacySavedSymbol || currentSymbol' 'Agent follows stored configured symbol before runtime telemetry'\nAssert-Contains $botController 'Trading Symbol is intentionally not writable through generic bot settings.' 'generic settings cannot change symbol'\nAssert-Contains $dashboard 'delete payload.symbol;' 'dashboard settings cannot submit a symbol override'\n"
          if anchor not in text:
              raise SystemExit('test assertion anchor not found')
          text = text.replace(anchor, add, 1)
          test.write_text(text, encoding='utf-8')
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-symbol-authority-temp.yml
          git config user.name "scenova-build"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/app/dashboard/page.tsx apps/api/src/bot.controller.ts apps/api/src/trading-symbol.controller.ts tests/trading-symbol-selection-contract.ps1 .github/workflows/apply-symbol-authority-temp.yml
          git commit -m "fix: make Trading Symbol the single source of truth"
          git push origin HEAD:fix/symbol-authority-single-source
