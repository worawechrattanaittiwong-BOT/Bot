name: Apply Unified SCENOVA Version 1.0.0

concurrency:
  group: apply-unified-scenova-version-1-0-0
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-unified-version-1.0.0.yml"
      - "scripts/unify-release-version-1.0.0.ps1"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare unified 1.0.0 source reset
        shell: pwsh
        run: ./scripts/unify-release-version-1.0.0.ps1

      - name: Verify AUTO V20 and release consistency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./tests/release-version-consistency.ps1
          ./tests/auto-v20-policy-regression.ps1
          $ea = [System.IO.File]::ReadAllText((Resolve-Path "mt5/FastBasketBot.mq5"))
          foreach ($sentinel in @(
            'bool AutoV20Enabled()',
            'return g_engineMode != "RACE" && g_controlMode == "AUTO";',
            'RACE_DIRECTION_LOCK',
            'RACE_MIXED_BASKET_BLOCK',
            'RACE_PROFIT_HARVEST',
            'SaaSRace'
          )) {
            if (-not $ea.Contains($sentinel)) {
              throw "V20/RACE sentinel missing after version reset: $sentinel"
            }
          }

      - name: Typecheck and build API/Web
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run typecheck
          npm run build

      - name: Publish unified 1.0.0 source reset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          if ! git diff --quiet HEAD origin/main; then
            echo "main moved while the version reset was validating; refusing to overwrite it"
            exit 1
          fi
          git add mt5/FastBasketBot.mq5 \
            apps/api/src/release-version.ts \
            apps/web/components/Mt5ManualActionControls.tsx \
            tools/windows-installer/ScenovaInstaller.csproj \
            tools/windows-installer/AgentBuildInfo.cs \
            tests/release-version-consistency.ps1 \
            .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "Unified 1.0.0 reset is already current"
            exit 0
          fi
          git commit -m "release: unify SCENOVA version 1.0.0 [skip ea build]"
          git push origin HEAD:main
