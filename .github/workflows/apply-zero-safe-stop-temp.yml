name: Apply ZERO GRID Safe Stop Temporary
on:
  push:
    branches: [fix/zero-grid-safe-stop-drain-feedback]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-grid-safe-stop-drain-feedback
          fetch-depth: 0
      - name: Apply narrow safe-stop patch
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Validate narrow diff
        run: |
          node ./tests/zero-grid-v1-simulation.mjs
          git diff --check
          git diff -- mt5/FastBasketBot.mq5 apps/api/src/release-version.ts apps/api/src/bot.controller.ts apps/web/app/dashboard/page.tsx tests/zero-grid-v1-simulation.mjs
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/apply-zero-safe-stop-temp.yml
          git config user.name "scenova-build"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5 apps/api/src/release-version.ts apps/api/src/bot.controller.ts apps/web/app/dashboard/page.tsx tests/zero-grid-v1-simulation.mjs .github/workflows/apply-zero-safe-stop-temp.yml
          git commit -m "fix: let ZERO GRID drain safely on stop"
          git push origin HEAD:fix/zero-grid-safe-stop-drain-feedback
