name: ZERO GRID EA version hotfix

on:
  push:
    branches:
      - hotfix/zero-grid-ea-version-1-0-11

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump EA runtime version to 1.0.11
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^#property version   "1\.0\.10"$' mt5/FastBasketBot.mq5)" = "1"
          test "$(grep -c '^#define SCENOVA_EA_VERSION "1\.0\.10"$' mt5/FastBasketBot.mq5)" = "1"
          test "$(grep -c '^#define SCENOVA_PRODUCT_VERSION "1\.0\.10"$' mt5/FastBasketBot.mq5)" = "1"
          sed -i 's/^#property version   "1\.0\.10"$/#property version   "1.0.11"/' mt5/FastBasketBot.mq5
          sed -i 's/^#define SCENOVA_EA_VERSION "1\.0\.10"$/#define SCENOVA_EA_VERSION "1.0.11"/' mt5/FastBasketBot.mq5
          sed -i 's/^#define SCENOVA_PRODUCT_VERSION "1\.0\.10"$/#define SCENOVA_PRODUCT_VERSION "1.0.11"/' mt5/FastBasketBot.mq5
          git rm .github/workflows/zero-grid-version-hotfix.yml
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5
          git commit -m "fix: bump EA for ZERO GRID configurable levels"
          git push origin HEAD:hotfix/zero-grid-ea-version-1-0-11
