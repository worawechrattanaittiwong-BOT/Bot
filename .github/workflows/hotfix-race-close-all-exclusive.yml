name: Hotfix RACE Close-All Exclusivity

on:
  push:
    branches: [main]
    paths:
      - "scripts/hotfix-race-close-all-exclusive.ps1"
      - ".github/workflows/hotfix-race-close-all-exclusive.yml"

permissions:
  contents: write

concurrency:
  group: hotfix-race-close-all-exclusive-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply RACE close-all exclusivity patch
        shell: pwsh
        run: ./scripts/hotfix-race-close-all-exclusive.ps1

      - name: Verify patch
        shell: bash
        run: |
          grep -F 'int harvested = g_raceCloseAllProfitEnabled ? 0 : RaceHarvestProfitablePositions();' mt5/FastBasketBot.mq5
          grep -F '#property version   "1.0.23"' mt5/FastBasketBot.mq5
          git diff --check

      - name: Publish to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5
          if git diff --cached --quiet; then
            echo "RACE close-all exclusivity is already current."
            exit 0
          fi
          git commit -m "fix: make RACE close-all profit exclusive"
          git push origin HEAD:main
