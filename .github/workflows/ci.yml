name: CI

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: AUTO V20 same-dataset policy regression
        shell: pwsh
        run: ./tests/auto-v20-policy-regression.ps1
      - name: Unified release version consistency
        shell: pwsh
        run: ./tests/release-version-consistency.ps1
      - name: Manual EA update one-click restart contract
        shell: pwsh
        run: ./tests/manual-ea-update-contract.ps1
      - name: Market-closed heartbeat and status contract
        shell: pwsh
        run: ./tests/market-closed-heartbeat-contract.ps1
      - name: Live price chart 15-minute contract
        shell: pwsh
        run: ./tests/live-price-chart-15m-contract.ps1
