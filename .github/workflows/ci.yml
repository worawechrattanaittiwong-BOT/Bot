name: CI

# Re-verify the full repository after runtime-safety, controlled Local/Cloud
# migration and production-hardening changes. Trading strategy regressions remain
# part of the same gate.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Control Center V12 inline settings and per-mode performance
        shell: pwsh
        run: ./tests/control-center-settings-contract.ps1
      - name: Performance Basket consistency contract
        shell: pwsh
        run: ./tests/performance-basket-consistency-contract.ps1
      - name: Unified role sidebar and customer performance contract
        shell: pwsh
        run: ./tests/unified-role-sidebar-contract.ps1
      - name: Cent account currency isolation contract
        run: node ./tests/cent-account-currency-isolation-contract.mjs
      - name: AUTO V20 same-dataset policy regression
        shell: pwsh
        run: ./tests/auto-v20-policy-regression.ps1
      - name: AUTO strict ownership isolation contract
        shell: pwsh
        run: ./tests/auto-strict-isolation-contract.ps1
      - name: AUTO V21 balanced exit and lot-safety contract
        shell: pwsh
        run: ./tests/auto-v21-balanced-exit-contract.ps1
      - name: Adaptive Rescue disabled contract
        shell: pwsh
        run: ./tests/rescue-disabled-contract.ps1
      - name: Hard profit target contract
        shell: pwsh
        run: ./tests/hard-profit-target-contract.ps1
      - name: Per-mode profit target isolation contract
        shell: pwsh
        run: ./tests/per-mode-profit-target-contract.ps1
      - name: Strict mode settings and fixed AUTO Lot contract
        shell: pwsh
        run: ./tests/strict-mode-settings-contract.ps1
      - name: MANUAL and per-mode daily risk isolation contract
        shell: pwsh
        run: ./tests/manual-daily-mode-isolation-contract.ps1
      - name: RACE close-all profit contract
        shell: pwsh
        run: ./tests/race-close-all-profit-contract.ps1
      - name: RACE 60-second volume and safe rollover contract
        shell: pwsh
        run: ./tests/race-volume-rollover-contract.ps1
      - name: FLIP LOCK strict isolation contract
        shell: pwsh
        run: ./tests/flip-lock-isolation-contract.ps1
      - name: MT5 local execution plane contract
        shell: pwsh
        run: ./tests/local-execution-plane-contract.ps1
      - name: ZERO GRID stability simulation regression
        run: node ./tests/zero-grid-v1-simulation.mjs
      - name: LOCAL account-follow no customer Slot contract
        shell: pwsh
        run: ./tests/local-account-follow-contract.ps1
      - name: Unified release version consistency
        shell: pwsh
        run: ./tests/release-version-consistency.ps1
      - name: EA source change requires version bump
        shell: pwsh
        run: ./tests/ea-version-bump-required.ps1
      - name: ZERO GRID loaded-runtime contract
        shell: pwsh
        run: ./tests/zero-grid-runtime-contract.ps1
      - name: Manual EA update one-click restart contract
        shell: pwsh
        run: ./tests/manual-ea-update-contract.ps1
      - name: Platform hot-deploy independent-runtime contract
        shell: pwsh
        run: ./tests/platform-hot-deploy-contract.ps1
      - name: Trading symbol selection safety contract
        shell: pwsh
        run: ./tests/trading-symbol-selection-contract.ps1
      - name: BTC symbol support and mode gate contract
        shell: pwsh
        run: ./tests/btc-symbol-mode-contract.ps1
      - name: Market-closed heartbeat and status contract
        shell: pwsh
        run: ./tests/market-closed-heartbeat-contract.ps1
      - name: Live price chart 15-minute contract
        shell: pwsh
        run: ./tests/live-price-chart-15m-contract.ps1
      - name: Cloud runtime safety contract
        shell: pwsh
        run: ./tests/cloud-runtime-safety-contract.ps1
      - name: Runtime migration Phase 3 contract
        shell: pwsh
        run: ./tests/runtime-migration-phase3-contract.ps1
      - name: Production hardening Phase 4 contract
        shell: pwsh
        run: ./tests/production-hardening-phase4-contract.ps1
