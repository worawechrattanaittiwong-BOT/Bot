name: CI

# Re-verify the full repository after runtime-safety, controlled Local/Cloud
# migration and production-hardening changes. Trading strategy regressions remain
# part of the same gate.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    if: ${{ github.event_name != 'push' || (contains(github.event.head_commit.message, '[popup-only]') == false && contains(github.event.head_commit.message, '[customer-admin-only]') == false) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - name: MT5 connection progress and timeout regression
        run: node --test ./tests/mt5-connect-progress.test.cjs
      - name: Owner trading-mode Safe Stop contract
        run: node --test ./tests/trading-mode-safe-stop.test.cjs
      - name: Owner trading-mode compact switch UI contract
        run: node --test ./tests/trading-mode-compact-ui.test.cjs
      - name: Deleted account and email re-registration regression
        run: node --test ./tests/deleted-account-reregister-contract.test.cjs
      - name: Generated EA release artifact allowlist
        run: node --test ./tests/generated-ea-release-shape.test.cjs
      - run: npm run build
      - name: Web production runtime smoke
        run: |
          set -euo pipefail
          PORT=3101 npm run start -w @bot/web > /tmp/scenova-next.log 2>&1 &
          WEB_PID=$!
          cleanup() {
            kill "$WEB_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3101/login >/dev/null &&
               curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3101/dashboard >/dev/null; then
              echo "SCENOVA web production runtime smoke: PASS"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scenova-next.log
          exit 1
      - name: API deploy compiled-code integrity and stale-runtime rejection
        run: |
          bash -n scripts/deploy-hostinger.sh scripts/auto-deploy-vps.sh scripts/lib/api-deploy.sh
          node --test tests/api-build-integrity.test.cjs
      - name: Control Center V12 inline settings and per-mode performance
        shell: pwsh
        run: ./tests/control-center-settings-contract.ps1
      - name: Performance Basket consistency contract
        shell: pwsh
        run: ./tests/performance-basket-consistency-contract.ps1
      - name: Performance date and six-strategy contract
        run: node ./tests/performance-date-strategy-contract.mjs
      - name: Performance cross-range strategy owner contract
        run: node ./tests/performance-cross-range-owner-contract.mjs
      - name: ZERO GRID shared cycle report contract
        run: node ./tests/zero-grid-share-cycle-contract.mjs
      - name: Unified role sidebar and customer performance contract
        shell: pwsh
        run: ./tests/unified-role-sidebar-contract.ps1
      - name: Trading Fleet Monitor read-only scope contract
        shell: pwsh
        run: ./tests/trading-fleet-monitor-contract.ps1
      - name: SCENOVA AI assistant read-only contract
        shell: pwsh
        run: ./tests/ai-assistant-readonly-contract.ps1
      - name: Cloud rollback same-version Build ID contract
        shell: pwsh
        run: ./tests/cloud-rollback-build-identity-contract.ps1
      - name: Mobile sidebar toggle drawer contract
        shell: pwsh
        run: ./tests/mobile-sidebar-drawer-contract.ps1
      - name: Mobile dashboard command dock hierarchy contract
        shell: pwsh
        run: ./tests/mobile-dashboard-command-dock-contract.ps1
      - name: Mobile Mirror isolated floating-card contract
        shell: pwsh
        run: ./tests/mobile-mirror-isolation-contract.ps1
      - name: Broker Phase 2 isolation contract
        run: node ./tests/broker-phase2-contract.mjs
      - name: Broker Phase 3 finance isolation contract
        run: node ./tests/broker-phase3-contract.mjs
      - name: Broker Phase 4 API automation contract
        run: node ./tests/broker-phase4-contract.mjs
      - name: Broker simple signup contract
        run: node ./tests/broker-simple-signup-contract.mjs
      - name: Referral program contract
        run: node ./tests/referral-program-contract.mjs
      - name: Commission withdrawal Phase 2 contract
        run: node ./tests/commission-withdrawal-contract.mjs
      - name: Commission withdrawal Phase 3 contract
        run: node ./tests/commission-withdrawal-phase3-contract.mjs
      - name: Wallet UI typography and autofill contract
        run: node ./tests/wallet-ui-contract.mjs
      - name: Omise webhook security contract
        run: node ./tests/omise-webhook-security-contract.cjs
      - name: Account 2FA pending setup contract
        run: node ./tests/account-security-2fa-contract.cjs
      - name: Account typography contract
