name: Apply Dashboard Version UI Temporary

on:
  push:
    branches: [fix/dashboard-version-chips-toast]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply narrow dashboard version and toast patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('apps/web/app/dashboard/page.tsx')
          css_path = Path('apps/web/app/globals.css')
          page = page_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'anchor not found: {label}')
              return text.replace(old, new, 1)

          page = replace_once(
              page,
              '  const [busy, setBusy] = useState(false);\n  const [activeView, setActiveView] = useState<View>("overview");',
              '  const [busy, setBusy] = useState(false);\n  const [checkingVersion, setCheckingVersion] = useState(false);\n  const [activeView, setActiveView] = useState<View>("overview");',
              'checkingVersion state'
          )

          page = replace_once(
              page,
              '  }, []);\n\n  useEffect(() => {\n    if (!botSettingsOpen) return;',
              '  }, []);\n\n  useEffect(() => {\n    if (!notice && !error) return;\n    const timer = window.setTimeout(() => {\n      setNotice("");\n      setError("");\n    }, 3000);\n    return () => window.clearTimeout(timer);\n  }, [notice, error]);\n\n  useEffect(() => {\n    if (!botSettingsOpen) return;',
              '3 second notice timer'
          )

          page = replace_once(
              page,
              '  async function downloadWindowsInstaller() {',
              '  async function checkSoftwareVersions() {\n    if (checkingVersion) return;\n    setCheckingVersion(true);\n    setError("");\n    setNotice("");\n    try {\n      await load(selectedSlotIdRef.current);\n      setNotice("ตรวจสอบเวอร์ชันล่าสุดแล้ว");\n    } finally {\n      setCheckingVersion(false);\n    }\n  }\n\n  async function downloadWindowsInstaller() {',
              'version check handler'
          )

          hero_anchor = '''                    <div className="cc-v6-symbol-chips">\n                      <span>{String(settings.controlMode || settings.engineMode || "AUTO").toUpperCase() === "ZERO_GRID" ? "ZERO GRID" : String(settings.controlMode || settings.engineMode || "AUTO").toUpperCase() === "RACE" ? "RACE" : settings.entryMode === "AUTO_MOMENTUM" ? "AUTO SMART" : settings.entryMode}</span>\n                      <span>{Number(settings.lot||0).toFixed(2)} Lot</span>\n                      <span>{String(settings.controlMode || settings.engineMode || "AUTO").toUpperCase() === "ZERO_GRID" ? Math.max(1,Math.min(30,Number(settings.zeroGridLevelsPerSide)||10))+" BUY STOP + "+Math.max(1,Math.min(30,Number(settings.zeroGridLevelsPerSide)||10))+" SELL STOP" : configuredMaxPositions+" ไม้"}</span>\n                      <HeroTrendChip label="M5" value={metrics.trendM5}/>\n                      <HeroTrendChip label="M15" value={metrics.trendM15}/>\n                      <HeroTrendChip label="M30" value={metrics.trendM30}/>\n                      <HeroTrendChip label="H1" value={metrics.trendH1}/>\n                    </div>'''
          hero_new = hero_anchor + '''\n                    <div className="cc-v6-version-row">\n                      <span className={"cc-v6-version-chip "+(softwareUpdate.eaVersionMatch ? "ok" : "warn")} title="EA Runtime ปัจจุบัน → เวอร์ชันล่าสุดบน Server">\n                        EA {softwareUpdate.currentEaVersion ? "v"+softwareUpdate.currentEaVersion : "—"}<em>→</em>{softwareUpdate.latestEaVersion ? "v"+softwareUpdate.latestEaVersion : "—"}\n                      </span>\n                      {data.selectedSlot?.mode === "LOCAL" && (\n                        <span className={"cc-v6-version-chip "+(!softwareUpdate.installerRequired ? "ok" : "warn")} title="Windows Agent ปัจจุบัน → เวอร์ชันล่าสุดบน Server">\n                          Agent {softwareUpdate.currentVersion ? "v"+softwareUpdate.currentVersion : "—"}<em>→</em>{softwareUpdate.latestVersion ? "v"+softwareUpdate.latestVersion : "—"}\n                        </span>\n                      )}\n                      <button type="button" className="cc-v6-version-check" disabled={checkingVersion || busy} onClick={checkSoftwareVersions}>\n                        <ScenovaIcon name="refresh" size={12}/>{checkingVersion ? "กำลังตรวจ..." : "ตรวจสอบเวอร์ชัน"}\n                      </button>\n                    </div>'''
          page = replace_once(page, hero_anchor, hero_new, 'hero version row')

          css = replace_once(
              css,
              '.page-notice{margin-bottom:14px}',
              '.page-notice{position:fixed;right:22px;bottom:22px;z-index:1400;width:min(390px,calc(100vw - 32px));margin:0;box-shadow:0 18px 52px rgba(0,0,0,.42);animation:scnToastIn .18s ease-out}\n@keyframes scnToastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}',
              'bottom-right toast style'
          )

          css = replace_once(
              css,
              '.cc-v6-symbol-chips>span{min-height:27px;padding:6px 10px;border:1px solid #33415f;border-radius:999px;background:rgba(8,15,27,.76);color:#aab6ce;font:800 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}',
              '.cc-v6-symbol-chips>span{min-height:27px;padding:6px 10px;border:1px solid #33415f;border-radius:999px;background:rgba(8,15,27,.76);color:#aab6ce;font:800 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}\n.cc-v6-version-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px}\n.cc-v6-version-chip{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:5px 8px;border:1px solid #33415f;border-radius:999px;background:rgba(8,15,27,.66);color:#91a0bc;font:800 8px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace}\n.cc-v6-version-chip em{font-style:normal;opacity:.55}.cc-v6-version-chip.ok{color:#73e4ad;border-color:#2a684f;background:rgba(12,48,37,.55)}.cc-v6-version-chip.warn{color:#e9c66e;border-color:#68552a;background:rgba(58,43,13,.55)}\n.cc-v6-version-check{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:5px 9px;border:1px solid #5d4e9d;border-radius:999px;background:rgba(39,29,75,.72);color:#c6b7ff;font:800 8px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;transition:.16s ease}\n.cc-v6-version-check:hover:not(:disabled){transform:translateY(-1px);border-color:#856fe0;background:rgba(57,42,107,.82)}',
              'hero version styles'
          )

          page_path.write_text(page, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY

          grep -q 'ตรวจสอบเวอร์ชัน' apps/web/app/dashboard/page.tsx
          grep -q '3000' apps/web/app/dashboard/page.tsx
          grep -q 'cc-v6-version-row' apps/web/app/globals.css
          grep -q 'position:fixed;right:22px;bottom:22px' apps/web/app/globals.css

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "scenova-build"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-dashboard-version-toast-temp.yml
          git add apps/web/app/dashboard/page.tsx apps/web/app/globals.css
          git commit -m "feat: show dashboard versions and auto-dismiss notices"
          git push origin HEAD:fix/dashboard-version-chips-toast
