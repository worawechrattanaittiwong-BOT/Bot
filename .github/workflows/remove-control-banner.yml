name: Apply Control Banner Cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-control-banner.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'apps/web/app/dashboard/page.tsx';
            const file = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
            const sha = file.data.sha;
            let text = Buffer.from(file.data.content, 'base64').toString('utf8');
            const oldBlock = `                <div className={"cc-v6-run-state "+(state==="RUNNING"?"running":safeStopInProgress?"safe":"stopped")}>
                    <span className="cc-state-dot"/>
                    <div>
                      <b>{startTimedOut?"เริ่มบอทไม่สำเร็จ":botStarting?"กำลังเริ่มบอท":state==="RUNNING"?"กำลังทำงาน":safeStopInProgress?"กำลังหยุดอย่างปลอดภัย":"บอทหยุดอยู่"}</b>
                      <small>{startTimedOut ? String(startTransition.message || startPhaseLabel.TIMEOUT) : botStarting ? (startPhaseLabel[startPhase] || controlStateLabel) : controlStateLabel} · Heartbeat {heartbeatAgeSeconds.toFixed(0)} วินาที</small>
                    </div>
                  </div>
`;
            if (!text.includes(oldBlock)) core.setFailed('Target status banner block not found');
            text = text.replace(oldBlock, '');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'fix: remove Control Center status banner',
              content: Buffer.from(text, 'utf8').toString('base64'),
              sha,
              branch: 'main'
            });
