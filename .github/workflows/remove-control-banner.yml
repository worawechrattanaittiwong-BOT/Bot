name: Apply Control Banner Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-control-banner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove Control Center status notification block
        shell: python
        run: |
          from pathlib import Path
          p = Path("apps/web/app/dashboard/page.tsx")
          text = p.read_text(encoding="utf-8")
          start = text.find('                  <div className={"cc-v6-run-state "+')
          if start < 0:
              raise SystemExit("status notification block not found")
          end_marker = '                  <div className="cc-v6-hero-actions">'
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("hero actions marker not found")
          text = text[:start] + text[end:]
          p.write_text(text, encoding="utf-8")

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/dashboard/page.tsx
          git commit -m "fix: remove Control Center status notification banner"
          git push origin HEAD:main
