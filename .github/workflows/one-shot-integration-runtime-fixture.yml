name: One-shot apply Integration Smoke runtime fixture

on:
  push:
    branches: [hotfix/zero-runtime-contract-complete]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[integration-runtime-fixture-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Integration Smoke fixture only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/integration-smoke.yml')
          text = source.read_text(encoding='utf-8')

          # Add the runtime-contract value read from the real EA source.
          if 'RUNTIME_CONTRACT=$(sed -n' not in text:
              lines = text.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if line.lstrip().startswith('API_EA_VERSION=$(sed -n '):
                      indent = line[:len(line) - len(line.lstrip())]
                      lines.insert(
                          i + 1,
                          indent + "RUNTIME_CONTRACT=$(sed -n 's/^#define SCENOVA_RUNTIME_CONTRACT \\\"\\([^\\\"]*\\)\\\"/\\1/p' mt5/FastBasketBot.mq5)\n"
                      )
                      break
              else:
                  raise SystemExit('API_EA_VERSION line not found')
              text = ''.join(lines)

          if 'test -n "$RUNTIME_CONTRACT"' not in text:
              marker = '          test -n "$EA_VERSION"\n'
              if marker not in text:
                  raise SystemExit('EA_VERSION non-empty check not found')
              text = text.replace(marker, marker + '          test -n "$RUNTIME_CONTRACT"\n', 1)

          # Integration Smoke must model the loaded EA v1.0.12 heartbeat.
          # This changes test fixture telemetry only; no production/trading logic.
          old = r'\"eaVersion\":\"$EA_VERSION\"'
          new = old + r',\"runtimeContract\":\"$RUNTIME_CONTRACT\"'
          replacements = text.count(old)
          if replacements < 8:
              raise SystemExit(f'expected at least 8 current-runtime heartbeat fixtures, found {replacements}')
          text = text.replace(old, new)

          source.write_text(text, encoding='utf-8')
          print(f'Updated Integration Smoke with {replacements} runtime-contract heartbeat fixtures')
          PY

          git diff --check -- .github/workflows/integration-smoke.yml
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = ".github/workflows/integration-smoke.yml"

      - name: Commit Integration Smoke fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Runtime Hardening"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/integration-smoke.yml
          git commit -m "test: align Integration Smoke with EA runtime contract [integration-runtime-fixture-applied]"
          git push origin HEAD:${GITHUB_REF_NAME}
