name: One-shot prepare Integration Smoke runtime fixture

on:
  push:
    branches: [hotfix/zero-runtime-contract-complete]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[integration-runtime-copy-prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare patched Integration Smoke copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/integration-smoke.yml')
          text = source.read_text(encoding='utf-8')

          if 'RUNTIME_CONTRACT=$(sed -n' not in text:
              lines = text.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if line.lstrip().startswith('API_EA_VERSION=$(sed -n '):
                      indent = line[:len(line) - len(line.lstrip())]
                      lines.insert(
                          i + 1,
                          indent + "RUNTIME_CONTRACT=$(sed -n 's/^#define SCENOVA_RUNTIME_CONTRACT \\\"\\([^\\\"]*\\)\\\"/\\1/p' mt5/FastBasketBot.mq5)\n"
                      )
                      break
              else:
                  raise SystemExit('API_EA_VERSION line not found')
              text = ''.join(lines)

          if 'test -n "$RUNTIME_CONTRACT"' not in text:
              marker = '          test -n "$EA_VERSION"\n'
              if marker not in text:
                  raise SystemExit('EA_VERSION non-empty check not found')
              text = text.replace(marker, marker + '          test -n "$RUNTIME_CONTRACT"\n', 1)

          old = r'\"eaVersion\":\"$EA_VERSION\"'
          new = old + r',\"runtimeContract\":\"$RUNTIME_CONTRACT\"'
          replacements = text.count(old)
          if replacements < 8:
              raise SystemExit(f'expected at least 8 current-runtime heartbeat fixtures, found {replacements}')
          text = text.replace(old, new)

          out = Path('patches/integration-smoke-runtime-contract.yml')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text, encoding='utf-8')
          print(f'Prepared {out} with {replacements} runtime-contract heartbeat fixtures')
          PY

          diff -u .github/workflows/integration-smoke.yml patches/integration-smoke-runtime-contract.yml > /tmp/integration-runtime.diff || true
          grep -q 'runtimeContract' /tmp/integration-runtime.diff
          grep -q 'RUNTIME_CONTRACT' /tmp/integration-runtime.diff

      - name: Commit prepared copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Runtime Hardening"
          git config user.email "actions@users.noreply.github.com"
          git add patches/integration-smoke-runtime-contract.yml
          git commit -m "chore: prepare Integration Smoke runtime copy [integration-runtime-copy-prepared]"
          git push origin HEAD:${GITHUB_REF_NAME}
