name: Apply ZERO close-all tester guard

on:
  push:
    branches:
      - fix/zero-close-all-burst

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip tester guard]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-close-all-burst
          fetch-depth: 0
      - name: Add tester-only synchronous fallback
        shell: python
        run: |
          from pathlib import Path
          p=Path('mt5/FastBasketBot.mq5')
          s=p.read_text(encoding='utf-8-sig')
          a='''bool ZeroGridClosePositionAsync(ulong ticket)\n{\n   if(ticket==0 || !PositionSelectByTicket(ticket)) return false;'''
          b='''bool ZeroGridClosePositionAsync(ulong ticket)\n{\n   if(MQLInfoInteger(MQL_TESTER))\n      return ClosePositionByTicket(ticket);\n   if(ticket==0 || !PositionSelectByTicket(ticket)) return false;'''
          if a not in s: raise SystemExit('ZERO async close function marker missing')
          s=s.replace(a,b,1)
          a2='''void ZeroGridCancelPendingAsync()\n{\n   for(int i=OrdersTotal()-1;i>=0;i--)'''
          b2='''void ZeroGridCancelPendingAsync()\n{\n   if(MQLInfoInteger(MQL_TESTER))\n   {\n      ZeroGridCancelPending();\n      return;\n   }\n   for(int i=OrdersTotal()-1;i>=0;i--)'''
          if a2 not in s: raise SystemExit('ZERO async cancel function marker missing')
          s=s.replace(a2,b2,1)
          p.write_text(s,encoding='utf-8')
      - name: Check scope
        shell: bash
        run: |
          test "$(git diff --name-only HEAD)" = "mt5/FastBasketBot.mq5"
          grep -q 'if(MQLInfoInteger(MQL_TESTER))' mt5/FastBasketBot.mq5
      - name: Commit guard
        shell: bash
        run: |
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5
          git commit -m "fix(mt5): keep ZERO async close live-only [skip tester guard]"
          git push origin HEAD:fix/zero-close-all-burst
