name: Apply ZERO Pair + RACE Profit v1.0.16

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-zero-free-run-v115.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-zero-race-v116
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply ZERO pair + RACE profit runtime patch
        run: |
          python3 .github/scripts/apply_zero_race_runtime_v116.py
          python3 .github/scripts/fix_v116_zero_contract.py

      - name: Verify patch touches only approved files
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(mt5/FastBasketBot\.mq5|apps/api/src/release-version\.ts|tests/zero-grid-close-geometry-contract\.ps1|tests/zero-race-runtime-v116-contract\.ps1)$'
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo "No source changes needed"
            exit 0
          fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! printf '%s\n' "$file" | grep -Eq "$allowed"; then
              echo "Unexpected file changed: $file" >&2
              exit 1
            fi
          done <<< "$changed"
          git diff --check

      - name: Run ZERO free-run isolation contract
        shell: pwsh
        run: ./tests/zero-grid-free-run-contract.ps1

      - name: Run ZERO close/geometry contract
        shell: pwsh
        run: ./tests/zero-grid-close-geometry-contract.ps1

      - name: Run ZERO pair + RACE profit v1.0.16 contract
        shell: pwsh
        run: ./tests/zero-race-runtime-v116-contract.ps1

      - name: Run ZERO GRID simulation regression
        run: node tests/zero-grid-v1-simulation.mjs

      - name: Commit isolated runtime fix to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- mt5/FastBasketBot.mq5 apps/api/src/release-version.ts tests/zero-grid-close-geometry-contract.ps1 tests/zero-race-runtime-v116-contract.ps1; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "SCENOVA Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5 apps/api/src/release-version.ts tests/zero-grid-close-geometry-contract.ps1 tests/zero-race-runtime-v116-contract.ps1
          git commit -m "fix(mt5): pair ZERO ladder and harvest RACE profit v1.0.16"
          git push origin HEAD:main
