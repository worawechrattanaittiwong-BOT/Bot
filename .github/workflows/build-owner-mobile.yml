name: Build SCENOVA Owner APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/owner-app/**"
      - ".github/workflows/build-owner-mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/owner-app/**"
      - ".github/workflows/build-owner-mobile.yml"

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install app dependencies
        working-directory: mobile/owner-app
        run: npm install --workspaces=false
      - name: Typecheck
        working-directory: mobile/owner-app
        run: npm run typecheck
      - name: Generate Android project
        working-directory: mobile/owner-app
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.SCENOVA_API_URL }}
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Build installable debug APK
        working-directory: mobile/owner-app/android
        run: ./gradlew assembleDebug
      - name: Upload SCENOVA Owner APK
        uses: actions/upload-artifact@v4
        with:
          name: SCENOVA-Owner-Android
          path: mobile/owner-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
