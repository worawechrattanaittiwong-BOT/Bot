name: Build SCENOVA Owner APK

on:
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://snvea-bot.online/backend/api
      CI: "1"
    defaults:
      run:
        working-directory: apps/owner-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure dedicated release signing
        env:
          SCENOVA_OWNER_KEYSTORE_B64: ${{ secrets.SCENOVA_OWNER_KEYSTORE_B64 }}
          SCENOVA_OWNER_STORE_PASSWORD: ${{ secrets.SCENOVA_OWNER_STORE_PASSWORD }}
          SCENOVA_OWNER_KEY_PASSWORD: ${{ secrets.SCENOVA_OWNER_KEY_PASSWORD }}
          SCENOVA_OWNER_KEY_ALIAS: ${{ secrets.SCENOVA_OWNER_KEY_ALIAS }}
          SCENOVA_OWNER_KEYSTORE_PATH: ${{ github.workspace }}/apps/owner-mobile/android/app/scenova-owner-release.jks
        run: |
          test -n "$SCENOVA_OWNER_KEYSTORE_B64"
          printf '%s' "$SCENOVA_OWNER_KEYSTORE_B64" | base64 --decode > "$SCENOVA_OWNER_KEYSTORE_PATH"
          chmod 600 "$SCENOVA_OWNER_KEYSTORE_PATH"
          node scripts/configure-android-signing.mjs

      - name: Build standalone release APK
        env:
          SCENOVA_OWNER_STORE_PASSWORD: ${{ secrets.SCENOVA_OWNER_STORE_PASSWORD }}
          SCENOVA_OWNER_KEY_PASSWORD: ${{ secrets.SCENOVA_OWNER_KEY_PASSWORD }}
          SCENOVA_OWNER_KEY_ALIAS: ${{ secrets.SCENOVA_OWNER_KEY_ALIAS }}
          SCENOVA_OWNER_KEYSTORE_PATH: ${{ github.workspace }}/apps/owner-mobile/android/app/scenova-owner-release.jks
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk ./SCENOVA-Owner.apk

      - name: Verify APK signature
        run: |
          keytool -printcert -jarfile ./SCENOVA-Owner.apk | grep -q "Owner"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCENOVA-Owner-APK
          path: apps/owner-mobile/SCENOVA-Owner.apk
          if-no-files-found: error
          retention-days: 30
