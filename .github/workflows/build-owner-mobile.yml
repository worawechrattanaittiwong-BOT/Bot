name: Build SCENOVA Owner APK

on:
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://snvea-bot.online/backend/api
      CI: "1"
    defaults:
      run:
        working-directory: apps/owner-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk ./SCENOVA-Owner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCENOVA-Owner-APK
          path: apps/owner-mobile/SCENOVA-Owner.apk
          if-no-files-found: error
          retention-days: 30
