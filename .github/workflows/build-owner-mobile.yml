name: Build SCENOVA Owner APK

on:
  push:
    branches: [main]
    paths:
      - "apps/owner-mobile/**"
      - ".github/workflows/build-owner-mobile.yml"
  workflow_dispatch:

concurrency:
  group: scenova-owner-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://snvea-bot.online/backend/api
      EXPO_PUBLIC_OWNER_BUILD: ${{ github.run_number }}
      CI: "1"
    defaults:
      run:
        working-directory: apps/owner-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Stamp Android build number
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          app.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
          fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          console.log("SCENOVA Owner versionCode=" + app.expo.android.versionCode);
          NODE

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure dedicated release signing
        env:
          SCENOVA_OWNER_KEYSTORE_B64: ${{ secrets.SCENOVA_OWNER_KEYSTORE_B64 }}
          SCENOVA_OWNER_STORE_PASSWORD: ${{ secrets.SCENOVA_OWNER_STORE_PASSWORD }}
          SCENOVA_OWNER_KEY_PASSWORD: ${{ secrets.SCENOVA_OWNER_KEY_PASSWORD }}
          SCENOVA_OWNER_KEY_ALIAS: ${{ secrets.SCENOVA_OWNER_KEY_ALIAS }}
          SCENOVA_OWNER_KEYSTORE_PATH: ${{ github.workspace }}/apps/owner-mobile/android/app/scenova-owner-release.jks
        run: |
          test -n "$SCENOVA_OWNER_KEYSTORE_B64"
          printf '%s' "$SCENOVA_OWNER_KEYSTORE_B64" | base64 --decode > "$SCENOVA_OWNER_KEYSTORE_PATH"
          chmod 600 "$SCENOVA_OWNER_KEYSTORE_PATH"
          node scripts/configure-android-signing.mjs

      - name: Build standalone release APK
        env:
          SCENOVA_OWNER_STORE_PASSWORD: ${{ secrets.SCENOVA_OWNER_STORE_PASSWORD }}
          SCENOVA_OWNER_KEY_PASSWORD: ${{ secrets.SCENOVA_OWNER_KEY_PASSWORD }}
          SCENOVA_OWNER_KEY_ALIAS: ${{ secrets.SCENOVA_OWNER_KEY_ALIAS }}
          SCENOVA_OWNER_KEYSTORE_PATH: ${{ github.workspace }}/apps/owner-mobile/android/app/scenova-owner-release.jks
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          cp android/app/build/outputs/apk/release/app-release.apk ./SCENOVA-Owner.apk

      - name: Verify APK signature
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose --print-certs ./SCENOVA-Owner.apk

      - name: Create update manifest
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          const { execFileSync } = require("child_process");
          const sha256 = execFileSync("sha256sum", ["SCENOVA-Owner.apk"], { encoding: "utf8" }).trim().split(/\s+/)[0];
          const manifest = {
            version: String(app.expo.version || ""),
            versionCode: Number(process.env.GITHUB_RUN_NUMBER),
            url: "https://snvea-bot.online/downloads/SCENOVA-Owner.apk",
            sha256,
            releasedAt: new Date().toISOString()
          };
          fs.writeFileSync("SCENOVA-Owner.json", JSON.stringify(manifest, null, 2) + "\n");
          console.log(JSON.stringify(manifest));
          NODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCENOVA-Owner-APK
          path: |
            apps/owner-mobile/SCENOVA-Owner.apk
            apps/owner-mobile/SCENOVA-Owner.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to SCENOVA website
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p apps/web/public/downloads
          cp apps/owner-mobile/SCENOVA-Owner.apk apps/web/public/downloads/SCENOVA-Owner.apk
          cp apps/owner-mobile/SCENOVA-Owner.json apps/web/public/downloads/SCENOVA-Owner.json

          # app.json is stamped only for this binary. Keep source config clean
          # before fetch/rebase/publish.
          git checkout -- apps/owner-mobile/app.json

          git config user.name "scenova-build"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/public/downloads/SCENOVA-Owner.apk apps/web/public/downloads/SCENOVA-Owner.json

          if git diff --cached --quiet; then
            echo "Published Owner APK is already current."
            exit 0
          fi

          git commit -m "build: publish SCENOVA Owner APK [skip owner apk build]"

          # Expo/npm can touch tracked generated metadata during the build.
          # Keep the release commit and discard only leftover working-tree edits
          # before rebasing onto a newer main.
          git reset --hard HEAD

          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo "Failed to publish SCENOVA Owner APK to main"
          exit 1
