name: Dispatch Current EA Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-current-ea-build.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official MT5 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-mt5-ea.yml --repo SCENOVA-AI/Bot --ref main
