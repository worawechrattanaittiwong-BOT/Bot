name: Apply Flat Safe Stop Recovery Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-safe-stop-flat-recovery-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply flat Safe Stop recovery patch
        run: python3 scripts/apply-safe-stop-flat-recovery-fix.py

      - name: Install dependencies
        run: npm install

      - name: Typecheck patched API and web
        run: npm run typecheck

      - name: Safe Stop contract regression
        shell: pwsh
        run: ./tests/production-hardening-phase4-contract.ps1

      - name: Commit repair to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-safe-stop-flat-recovery-fix.yml scripts/apply-safe-stop-flat-recovery-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/ea.controller.ts apps/api/src/bot.controller.ts apps/web/app/dashboard/page.tsx tests/production-hardening-phase4-contract.ps1
          git commit -m 'fix: allow flat Safe Stop recovery'
          git push origin HEAD:main
