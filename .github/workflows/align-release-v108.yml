name: Align Release v1.0.8 Metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/align-release-v108.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align all release markers to EA v1.0.8
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  if new in s:
                      return
                  raise SystemExit(f"marker missing in {path}: {old}")
              p.write_text(s.replace(old, new), encoding="utf-8")

          replace("apps/api/src/release-version.ts", 'DEFAULT_INSTALLER_VERSION = "1.0.7"', 'DEFAULT_INSTALLER_VERSION = "1.0.8"')
          replace("apps/api/src/release-version.ts", 'DEFAULT_EA_VERSION = "1.0.7"', 'DEFAULT_EA_VERSION = "1.0.8"')
          replace("tools/windows-installer/AgentBuildInfo.cs", 'Version = "1.0.7"', 'Version = "1.0.8"')
          replace("tools/windows-installer/ScenovaInstaller.csproj", '<Version>1.0.7</Version>', '<Version>1.0.8</Version>')
          replace("tools/windows-installer/ScenovaInstaller.csproj", '<FileVersion>1.0.7.0</FileVersion>', '<FileVersion>1.0.8.0</FileVersion>')
          replace("tools/windows-installer/ScenovaInstaller.csproj", '<AssemblyVersion>1.0.7.0</AssemblyVersion>', '<AssemblyVersion>1.0.8.0</AssemblyVersion>')
          replace("apps/web/components/Mt5ManualActionControls.tsx", 'installerVersionRequired || "1.0.7"', 'installerVersionRequired || "1.0.8"')
          PY

      - name: Validate release consistency
        shell: pwsh
        run: ./tests/release-version-consistency.ps1

      - name: Commit aligned metadata
        shell: bash
        run: |
          if git diff --quiet -- apps/api/src/release-version.ts tools/windows-installer/AgentBuildInfo.cs tools/windows-installer/ScenovaInstaller.csproj apps/web/components/Mt5ManualActionControls.tsx; then
            echo "Release metadata already aligned"
            exit 0
          fi
          git config user.name "SCENOVA Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/release-version.ts tools/windows-installer/AgentBuildInfo.cs tools/windows-installer/ScenovaInstaller.csproj apps/web/components/Mt5ManualActionControls.tsx
          git commit -m "fix: align release metadata with EA v1.0.8"
          git push origin HEAD:main
