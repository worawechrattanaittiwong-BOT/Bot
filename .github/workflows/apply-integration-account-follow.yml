# Trigger the existing one-shot workflow to align the stale smoke test.
name: Apply Integration Account Follow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-integration-account-follow.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align stale rebind smoke test with automatic account follow
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/integration-smoke.yml')
          text=p.read_text(encoding='utf-8')
          old='''          echo "[integration] rebind succeeds after old MT5 reports flat"
          OLD_FLAT=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\\"instanceId\\":\\"$INSTANCE\\",\\"installToken\\":\\"$INSTALL_TOKEN\\",\\"state\\":\\"SAFE_STOP\\",\\"metrics\\":{\\"accountNumber\\":\\"100001\\",\\"eaVersion\\":\\"$EA_VERSION\\",\\"server\\":\\"SCENOVA-Demo\\",\\"positions\\":0}}")
          DETECT_REAL=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\\"instanceId\\":\\"$INSTANCE\\",\\"installToken\\":\\"$INSTALL_TOKEN\\",\\"state\\":\\"SAFE_STOP\\",\\"metrics\\":{\\"accountNumber\\":\\"200002\\",\\"eaVersion\\":\\"$EA_VERSION\\",\\"server\\":\\"SCENOVA-Real\\",\\"positions\\":0}}")
          test "$(printf '%s' "$DETECT_REAL" | jq -r '.accountMismatch')" = "true"
          test "$(printf '%s' "$DETECT_REAL" | jq -r '.previousBoundPositions')" = "0"

          REBIND_REAL=$(curl -fsS -X POST "$BASE/bot/mt5/rebind?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$REBIND_REAL" | jq -r '.account.account_number')" = "200002"
'''
          new='''          echo "[integration] LOCAL account follows the new MT5 automatically after old account is flat"
          OLD_FLAT=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\\"instanceId\\":\\"$INSTANCE\\",\\"installToken\\":\\"$INSTALL_TOKEN\\",\\"state\\":\\"SAFE_STOP\\",\\"metrics\\":{\\"accountNumber\\":\\"100001\\",\\"eaVersion\\":\\"$EA_VERSION\\",\\"server\\":\\"SCENOVA-Demo\\",\\"positions\\":0}}")
          DETECT_REAL=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\\"instanceId\\":\\"$INSTANCE\\",\\"installToken\\":\\"$INSTALL_TOKEN\\",\\"state\\":\\"SAFE_STOP\\",\\"metrics\\":{\\"accountNumber\\":\\"200002\\",\\"eaVersion\\":\\"$EA_VERSION\\",\\"server\\":\\"SCENOVA-Real\\",\\"positions\\":0}}")
          test "$(printf '%s' "$DETECT_REAL" | jq -r '.accountMismatch // false')" = "false"
          test "$(printf '%s' "$DETECT_REAL" | jq -r '.accountChangeBlocked // false')" = "false"

          FOLLOW_DASH=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$FOLLOW_DASH" | jq -r '.account.account_number')" = "200002"
          test "$(printf '%s' "$FOLLOW_DASH" | jq -r '.account.broker_server')" = "SCENOVA-Real"
          test "$(printf '%s' "$FOLLOW_DASH" | jq -r '.instance.pending_account_number // empty')" = ""
'''
          if old not in text:
              raise SystemExit('stale manual-rebind block not found')
          p.write_text(text.replace(old,new,1), encoding='utf-8')
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-integration-account-follow.yml
          git add .github/workflows/integration-smoke.yml
          git commit -m "test: expect automatic LOCAL MT5 account follow"
          git push origin HEAD:main
