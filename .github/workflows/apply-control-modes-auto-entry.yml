name: Apply Direction Selector Control Modes

on:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade-control-modes-auto-entry.ps1"
      - ".github/workflows/apply-control-modes-auto-entry.yml"

permissions:
  contents: write

concurrency:
  group: apply-auto-entry-control-modes-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply selectable direction patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "./scripts/upgrade-control-modes-auto-entry.ps1" `
            -ApiPath "apps/api/src/bot.controller.ts" `
            -EaApiPath "apps/api/src/ea.controller.ts" `
            -WebPath "apps/web/app/dashboard/page.tsx"

      - name: Preserve legacy saved mode inference
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "apps/web/app/dashboard/page.tsx"
          $text = [System.IO.File]::ReadAllText((Resolve-Path $path))
          $old = '  controlMode: "AUTO",'
          $new = '  controlMode: undefined,'
          if ($text.Contains($old)) {
            $text = $text.Replace($old,$new)
            [System.IO.File]::WriteAllText((Resolve-Path $path),$text,[System.Text.UTF8Encoding]::new($false))
          }
          if (-not $text.Contains($new)) {
            throw "Legacy control-mode fallback was not applied"
          }

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish selectable direction update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/bot.controller.ts apps/api/src/ea.controller.ts apps/web/app/dashboard/page.tsx
          if git diff --cached --quiet; then
            echo "Selectable direction is already current."
            exit 0
          fi
          git commit -m "fix: allow auto buy or sell in every control mode"
          git push origin HEAD:main
