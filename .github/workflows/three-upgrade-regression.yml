name: Three Upgrade Regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  force-flat-partner-entitlement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bot -d bot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Apply migrations including regression guards twice
        env:
          PGPASSWORD: bot
        run: |
          set -euo pipefail
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/001_init.sql
          for migration in \
            database/002_slots_devices.sql \
            database/003_unique_mt5_identity.sql \
            database/004_mt5_change_request.sql \
            database/005_gold_spread_default.sql \
            database/006_adaptive_engine.sql \
            database/007_adaptive_spread.sql \
            database/008_market_open_adaptive.sql \
            database/010_trade_journal.sql \
            database/011_basket_intelligence.sql \
            database/012_auto_profit_target_mode.sql \
            database/013_backtest_performance.sql \
            database/014_maintenance_mode.sql \
            database/015_partner_program.sql \
            database/016_upgrade_regression_safety.sql
          do
            psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/016_upgrade_regression_safety.sql

      - name: Build API
        run: npm run build -w @bot/api

      - name: Start isolated API
        env:
          DATABASE_URL: postgresql://bot:bot@localhost:5432/bot
          JWT_SECRET: integration-jwt-secret
          ADMIN_KEY: integration-admin
          CREDENTIAL_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          PUBLIC_API_BASE: http://127.0.0.1:4000
          PUBLIC_WEB_BASE: http://127.0.0.1:3000
          PORT: 4000
        run: |
          node apps/api/dist/main.js > /tmp/scenova-three-upgrades-api.log 2>&1 &
          echo $! > /tmp/scenova-three-upgrades-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scenova-three-upgrades-api.log
          exit 1

      - name: Partner lifecycle regression
        env:
          BASE: http://127.0.0.1:4000/api
          ADMIN_KEY: integration-admin
        run: bash ./tests/partner-program-v3.sh

      - name: FORCE FLAT and retired-plan regression
        env:
          BASE: http://127.0.0.1:4000/api
          ADMIN_KEY: integration-admin
        run: bash ./tests/upgrade-regression-safety.sh

      - name: CLOSE_ALL flat-heartbeat reconcile regression
        env:
          BASE: http://127.0.0.1:4000/api
        run: bash ./tests/closeall-flat-heartbeat-reconcile.sh

      - name: Show API log on failure
        if: failure()
        run: cat /tmp/scenova-three-upgrades-api.log || true
