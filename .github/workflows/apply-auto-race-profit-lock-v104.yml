name: Export Integration Smoke Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-auto-race-profit-lock-v104.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate patched Integration Smoke
        run: python3 scripts/repair_zero_settings_and_smoke.py

      - name: Upload patched workflow
        uses: actions/upload-artifact@v4
        with:
          name: patched-integration-smoke
          path: .github/workflows/integration-smoke.yml
          if-no-files-found: error
