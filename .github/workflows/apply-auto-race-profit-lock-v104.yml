name: Apply AUTO RACE Profit Lock V104

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-auto-race-profit-lock-v104.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AUTO and RACE profit protection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "mt5/FastBasketBot.mq5"
          $text = [System.IO.File]::ReadAllText($path)

          function Replace-Required([string]$old, [string]$new, [string]$label) {
            if (-not $script:text.Contains($old)) {
              throw "Required source block not found: $label"
            }
            $script:text = $script:text.Replace($old, $new)
          }

          Replace-Required '#property version   "1.0.3"' '#property version   "1.0.4"' 'property version'
          Replace-Required '#define SCENOVA_EA_VERSION "1.0.3"' '#define SCENOVA_EA_VERSION "1.0.4"' 'runtime version'
          Replace-Required '#define SCENOVA_PRODUCT_VERSION "1.0.3"' '#define SCENOVA_PRODUCT_VERSION "1.0.4"' 'product version'

          $oldAuto = @'
   double cycleProfit=BasketCycleProfit();
   if(cycleProfit>g_autoV20PeakProfit)
      g_autoV20PeakProfit=cycleProfit;
   double armProfit=MathMax(0.05,
      MathMax(g_autoV20Buy.expectedProfitMoney,g_autoV20Sell.expectedProfitMoney)*0.35);
   if(g_profitTargetMode=="AUTO" &&
      g_autoV20PeakProfit>=armProfit)
   {
      double giveback=MathMax(0.05,g_autoV20PeakProfit*0.25);
      if(cycleProfit<=g_autoV20PeakProfit-giveback)
      {
         bool closed=CloseAllBasket("AUTO_V20_PROFIT_GIVEBACK");
         if(closed) AutoV20ResetCycle();
         g_executionStatus="AUTO_V20_PROFIT_GIVEBACK";
         return true;
      }
   }
'@
          $newAuto = @'
   double cycleProfit=BasketCycleProfit();
   if(cycleProfit>g_autoV20PeakProfit)
      g_autoV20PeakProfit=cycleProfit;

   // V20.1 PROFIT LOCK: arm from a real net-positive floor instead of waiting
   // for 35% of the model target. Once a winner is armed, the close level can
   // never fall below the positive protection floor, so profit cannot be
   // intentionally ridden back through zero while AUTO waits for a large TP.
   double autoProfitFloor=SmartProfitProtectionFloor(direction);
   double armProfit=MathMax(0.10,autoProfitFloor);
   if(g_profitTargetMode=="AUTO" &&
      g_autoV20PeakProfit>=armProfit)
   {
      double giveback=MathMax(0.05,g_autoV20PeakProfit*0.20);
      double closeLevel=MathMax(
         autoProfitFloor,
         g_autoV20PeakProfit-giveback
      );
      if(cycleProfit<=closeLevel)
      {
         bool closed=CloseAllBasket("AUTO_V20_PROFIT_GIVEBACK");
         if(closed) AutoV20ResetCycle();
         g_executionStatus="AUTO_V20_PROFIT_GIVEBACK";
         return true;
      }
   }
'@
          Replace-Required $oldAuto $newAuto 'AUTO V20 profit giveback block'

          $oldGivebackHead = @'
bool AutoProfitGivebackDetected(int direction,double cycleProfit)
{
   if(direction==0 || cycleProfit<=0.0)
      return false;
'@
          $newGivebackHead = @'
bool AutoProfitGivebackDetected(int direction,double cycleProfit)
{
   // Keep evaluating after current P/L slips below zero if a positive peak was
   // already armed. The previous early return was exactly how a winner could
   // escape the giveback guard and become a loser.
   if(direction==0)
      return false;
'@
          Replace-Required $oldGivebackHead $newGivebackHead 'AUTO generic giveback head'

          $oldGivebackFloor = @'
   double minimumPeak=MathMax(0.35,floor*2.20);
   if(g_profitRunPeak<minimumPeak || cycleProfit<=floor)
      return false;
'@
          $newGivebackFloor = @'
   double minimumPeak=MathMax(0.10,floor);
   if(g_profitRunPeak<minimumPeak)
      return false;
   if(cycleProfit<=floor)
   {
      g_smartProfitDefenseActive=true;
      g_smartProfitDefenseReason="PROFIT_FLOOR_BREACH";
      return true;
   }
'@
          Replace-Required $oldGivebackFloor $newGivebackFloor 'AUTO generic positive floor'

          $oldCloseReason = @'
      StringFind(reason, "BASKET_PROFIT") == 0 ||
      StringFind(reason, "SMART_PROFIT") == 0 ||
      StringFind(reason, "AUTO_PROFIT") == 0)
'@
          $newCloseReason = @'
      StringFind(reason, "BASKET_PROFIT") == 0 ||
      StringFind(reason, "SMART_PROFIT") == 0 ||
      StringFind(reason, "AUTO_PROFIT") == 0 ||
      StringFind(reason, "AUTO_V20_PROFIT") == 0 ||
      StringFind(reason, "AUTO_V20_MODERATE_TARGET") == 0 ||
      StringFind(reason, "AUTO_V20_TIME_BANK_PROFIT") == 0)
'@
          Replace-Required $oldCloseReason $newCloseReason 'AUTO V20 close retry classification'

          $oldRaceArm = @'
double RaceProfitArmMoney(int filledUnits)
{
   // Positive floating P/L already includes spread. This floor simply avoids
   // closing on microscopic noise while still taking profit quickly.
   return MathMax(0.10, MathMin(5.00, filledUnits * 0.02));
}
'@
          $newRaceArm = @'
double RaceProfitArmMoney(int filledUnits)
{
   // V20.1 RACE banks quickly. The old threshold could grow to $5, allowing a
   // clearly positive fast cycle to return negative before protection armed.
   return MathMax(0.10, MathMin(0.50, filledUnits * 0.01));
}
'@
          Replace-Required $oldRaceArm $newRaceArm 'RACE arm money'

          $oldHarvest = @'
   int harvested = RaceHarvestProfitablePositions();
   if(harvested > 0)
   {
      g_raceProfitArmed = false;
      g_racePeakProfit = 0.0;

      int remainingPositions = BasketPositionCount();
'@
          $newHarvest = @'
   int harvested = RaceHarvestProfitablePositions();
   if(harvested > 0)
   {
      // Never forget a positive cycle peak after harvesting a blue ticket.
      // If the NET cycle is already bankable, flatten instead of immediately
      // refilling and exposing the realized winner to a new losing leg.
      double harvestedCycleProfit=BasketCycleProfit();
      if(harvestedCycleProfit>g_racePeakProfit)
         g_racePeakProfit=harvestedCycleProfit;
      double harvestedArmMoney=RaceProfitArmMoney(MathMax(1,RaceFilledUnits()));
      if(harvestedCycleProfit>=harvestedArmMoney)
      {
         g_raceProfitArmed=true;
         RaceCloseCycle("RACE_HARVEST_BANK");
         return true;
      }

      int remainingPositions = BasketPositionCount();
'@
          Replace-Required $oldHarvest $newHarvest 'RACE harvest bank'

          $oldRaceCore = @'
   int filledUnits = RaceFilledUnits();
   bool filling = filledUnits < g_maxPositions;
   double floatingProfit = BasketProfit();
   double cycleProfit = BasketCycleProfit();

   // Explicit user loss control remains a hard safety boundary in every mode.
   double lossLimit = EffectiveBasketLossLimit();
   if(lossLimit > 0.0 && cycleProfit <= -lossLimit)
   {
      RaceCloseCycle("RACE_MAX_BASKET_LOSS");
      return true;
   }

   string wrongReason = "NONE";
   if(RaceWrongDirectionConfirmed(direction,momentum,filling,wrongReason))
   {
      RaceCloseCycle(wrongReason);
      return true;
   }

   // Max Positions means the requested target in RACE mode. Until full, no
   // profit score/quality/location logic is allowed to stop additional entries.
   if(filling)
   {
      if(floatingProfit < 0.0)
         g_raceRecoveryWatch = true;
      g_raceState = "FILLING";
      ProcessRaceFill(direction);
      return true;
   }

   double armMoney = RaceProfitArmMoney(filledUnits);

   // If a dragged cycle was judged recoverable, take the recovered NET cycle
   // profit quickly. Harvested winners count toward that recovery on purpose.
   if(g_raceRecoveryWatch)
   {
      double recoveryCloseMoney = MathMax(0.02, armMoney * 0.25);
      if(cycleProfit >= recoveryCloseMoney)
      {
         RaceCloseCycle("RACE_RECOVERY_PROFIT");
         return true;
      }
      g_raceState = "RECOVERY_WAIT";
      g_executionStatus = "RACE_RECOVERY_WAIT";
      return true;
   }

   // Normal RACE profit-run logic now looks only at the still-open Basket.
   // Realized harvested winners must not accidentally trigger a full-cycle
   // close immediately after an individual blue ticket was banked.
   if(floatingProfit >= armMoney)
   {
      bool flowing = RaceFlowStillRunning(direction,momentum);

      if(!flowing && !g_raceProfitArmed)
      {
         RaceCloseCycle("RACE_QUICK_PROFIT");
         return true;
      }

      if(!g_raceProfitArmed)
      {
         g_raceProfitArmed = true;
         g_racePeakProfit = floatingProfit;
      }
      if(floatingProfit > g_racePeakProfit)
         g_racePeakProfit = floatingProfit;

      double giveback = RaceGivebackMoney(g_racePeakProfit, armMoney);
      if(floatingProfit <= g_racePeakProfit - giveback)
      {
         RaceCloseCycle("RACE_PROFIT_GIVEBACK");
         return true;
      }

      if(!flowing && floatingProfit > 0.0)
      {
         RaceCloseCycle("RACE_FLOW_ENDED_PROFIT");
         return true;
      }

      g_raceState = "PROFIT_RUN";
      g_executionStatus = "RACE_PROFIT_RUN";
      return true;
   }

   if(floatingProfit < 0.0)
   {
      g_raceRecoveryWatch = true;
      g_raceState = "RECOVERY_WAIT";
      g_executionStatus = "RACE_RECOVERY_WAIT";
      return true;
   }

   g_raceState = "FULL_WAIT_PROFIT";
   g_executionStatus = "RACE_FULL_WAIT_PROFIT";
   return true;
'@
          $newRaceCore = @'
   int filledUnits = RaceFilledUnits();
   bool filling = filledUnits < g_maxPositions;
   double floatingProfit = BasketProfit();
   double cycleProfit = BasketCycleProfit();

   // Explicit user loss control remains a hard safety boundary in every mode.
   double lossLimit = EffectiveBasketLossLimit();
   if(lossLimit > 0.0 && cycleProfit <= -lossLimit)
   {
      RaceCloseCycle("RACE_MAX_BASKET_LOSS");
      return true;
   }

   string wrongReason = "NONE";
   if(RaceWrongDirectionConfirmed(direction,momentum,filling,wrongReason))
   {
      RaceCloseCycle(wrongReason);
      return true;
   }

   // V20.1 RACE PROFIT LOCK works on NET cycle P/L and remains active even
   // while Max Positions is still filling. Once armed it never disappears just
   // because current profit slips below the original arm threshold.
   double armMoney = RaceProfitArmMoney(MathMax(1,filledUnits));
   if(cycleProfit > g_racePeakProfit)
      g_racePeakProfit = cycleProfit;
   if(!g_raceProfitArmed && cycleProfit >= armMoney)
   {
      g_raceProfitArmed = true;
      g_racePeakProfit = MathMax(g_racePeakProfit,cycleProfit);
   }

   if(g_raceProfitArmed)
   {
      bool flowing = RaceFlowStillRunning(direction,momentum);
      double giveback = RaceGivebackMoney(g_racePeakProfit,armMoney);
      double profitFloor = MathMax(0.02,armMoney*0.25);
      double closeLevel = MathMax(
         profitFloor,
         g_racePeakProfit-giveback
      );

      if(cycleProfit <= closeLevel)
      {
         RaceCloseCycle("RACE_PROFIT_GIVEBACK");
         return true;
      }
      if(!flowing && cycleProfit > 0.0)
      {
         RaceCloseCycle("RACE_FLOW_ENDED_PROFIT");
         return true;
      }
   }

   // If a dragged cycle was judged recoverable, take the recovered NET cycle
   // profit immediately, including while the requested fill count is not full.
   if(g_raceRecoveryWatch)
   {
      double recoveryCloseMoney = MathMax(0.02,armMoney*0.25);
      if(cycleProfit >= recoveryCloseMoney)
      {
         RaceCloseCycle("RACE_RECOVERY_PROFIT");
         return true;
      }
   }

   if(filling)
   {
      if(cycleProfit < 0.0)
         g_raceRecoveryWatch = true;
      g_raceState = g_raceProfitArmed ? "PROFIT_RUN" : "FILLING";
      g_executionStatus = g_raceProfitArmed ? "RACE_PROFIT_RUN" : "RACE_FILLING";
      ProcessRaceFill(direction);
      return true;
   }

   if(g_raceRecoveryWatch)
   {
      g_raceState = "RECOVERY_WAIT";
      g_executionStatus = "RACE_RECOVERY_WAIT";
      return true;
   }

   if(g_raceProfitArmed)
   {
      g_raceState = "PROFIT_RUN";
      g_executionStatus = "RACE_PROFIT_RUN";
      return true;
   }

   if(cycleProfit < 0.0)
   {
      g_raceRecoveryWatch = true;
      g_raceState = "RECOVERY_WAIT";
      g_executionStatus = "RACE_RECOVERY_WAIT";
      return true;
   }

   g_raceState = "FULL_WAIT_PROFIT";
   g_executionStatus = "RACE_FULL_WAIT_PROFIT";
   return true;
'@
          Replace-Required $oldRaceCore $newRaceCore 'RACE cycle profit lock core'

          [System.IO.File]::WriteAllText($path,$text,(New-Object System.Text.UTF8Encoding($false)))

      - name: Validate patched source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $text = [System.IO.File]::ReadAllText("mt5/FastBasketBot.mq5")
          foreach($sentinel in @(
            '#property version   "1.0.4"',
            'V20.1 PROFIT LOCK',
            'double autoProfitFloor=SmartProfitProtectionFloor(direction);',
            'g_smartProfitDefenseReason="PROFIT_FLOOR_BREACH";',
            'StringFind(reason, "AUTO_V20_PROFIT") == 0',
            'V20.1 RACE PROFIT LOCK',
            'if(!g_raceProfitArmed && cycleProfit >= armMoney)',
            'double closeLevel = MathMax(',
            'RaceCloseCycle("RACE_HARVEST_BANK")'
          )) {
            if(-not $text.Contains($sentinel)) { throw "Missing sentinel: $sentinel" }
          }

      - name: Commit patched EA source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "SCENOVA Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0) {
            Write-Host "Source already patched."
            exit 0
          }
          git commit -m "fix: bank AUTO and RACE profit before giveback turns negative"
          git push origin HEAD:main
