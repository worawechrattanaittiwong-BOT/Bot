name: Repair ZERO Settings

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-auto-race-profit-lock-v104.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply ZERO settings repair
        run: |
          python3 scripts/repair_zero_settings_and_smoke.py
          git checkout -- .github/workflows/integration-smoke.yml

      - name: Build web and API
        run: |
          npm install
          npm run build -w @bot/web
          npm run build -w @bot/api

      - name: Commit ZERO settings repair
        run: |
          git config user.name "SCENOVA CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/app/dashboard/page.tsx apps/api/src/bot.controller.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: lock ZERO grid defaults"
          git push origin HEAD:main
