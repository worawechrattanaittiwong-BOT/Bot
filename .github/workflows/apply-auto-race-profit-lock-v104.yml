name: Repair ZERO Settings And Smoke

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-auto-race-profit-lock-v104.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python3 scripts/repair_zero_settings_and_smoke.py

      - name: Build web and API
        run: |
          npm install
          npm run build -w @bot/web
          npm run build -w @bot/api

      - name: Commit repaired files
        run: |
          git config user.name "SCENOVA CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-auto-race-profit-lock-v104.yml
          git rm scripts/repair_zero_settings_and_smoke.py
          git add apps/web/app/dashboard/page.tsx apps/api/src/bot.controller.ts .github/workflows/integration-smoke.yml
          git diff --cached --check
          git commit -m "fix: lock ZERO grid defaults and repair smoke test"
          git push origin HEAD:main
