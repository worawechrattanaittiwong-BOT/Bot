name: Apply ZERO Pending range 10-30

on:
  push:
    branches:
      - fix/zero-min-levels-10

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip zero min patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply ZERO Pending minimum 10
        run: python3 .github/scripts/apply_zero_min_levels_10.py

      - name: Verify ZERO runtime/UI contract
        shell: pwsh
        run: ./tests/zero-grid-runtime-contract.ps1

      - name: Verify EA version remains 1.0.17
        shell: bash
        run: |
          set -euo pipefail
          grep -F '#property version   "1.0.17"' mt5/FastBasketBot.mq5
          grep -F 'export const DEFAULT_EA_VERSION = "1.0.17";' apps/api/src/release-version.ts

      - name: Commit tested UI change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "SCENOVA Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/app/dashboard/page.tsx tests/zero-grid-runtime-contract.ps1
          git commit -m "fix(web): start ZERO Pending selection at 10 [skip zero min patch]"
          git push origin HEAD:fix/zero-min-levels-10
