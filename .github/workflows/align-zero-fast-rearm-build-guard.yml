name: Align ZERO Fast Rearm Build Guard

on:
  push:
    branches:
      - fix/zero-fast-rearm-close-order
    paths:
      - .github/scripts/align-zero-fast-rearm-build-guard.py
      - .github/workflows/align-zero-fast-rearm-build-guard.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-fast-rearm-close-order
          fetch-depth: 0
      - name: Align guard only
        run: python3 .github/scripts/align-zero-fast-rearm-build-guard.py
      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = ".github/workflows/build-mt5-ea.yml"
      - name: Commit guard alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA-AI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/build-mt5-ea.yml
          git commit -m "test(mt5): align ZERO fast-rearm build guards"
          git push origin HEAD:fix/zero-fast-rearm-close-order
