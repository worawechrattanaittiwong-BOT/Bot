name: Apply ZERO Mode Isolation V105

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-zero-mode-isolation-v105.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch strict execution-mode isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub1(text, pattern, replacement, label, flags=0):
              out, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 replacement, got {count}")
              return out

          ea_path = Path("mt5/FastBasketBot.mq5")
          ea = ea_path.read_text(encoding="utf-8")

          ea = sub1(ea, r'#property\s+version\s+"1\.0\.[34]"', '#property version   "1.0.5"', 'EA property version')
          ea = sub1(ea, r'#define\s+SCENOVA_EA_VERSION\s+"1\.0\.[34]"', '#define SCENOVA_EA_VERSION "1.0.5"', 'EA runtime version')
          ea = sub1(ea, r'#define\s+SCENOVA_PRODUCT_VERSION\s+"1\.0\.[34]"', '#define SCENOVA_PRODUCT_VERSION "1.0.5"', 'EA product version')

          ea = sub1(
              ea,
              r'bool ZeroGridModeEnabled\(\)\s*\{\s*return g_engineMode == "ZERO_GRID" \|\| g_controlMode == "ZERO_GRID";\s*\}',
              '''string EffectiveExecutionMode()\n{\n   // Website controlMode is the canonical owner after the first settings sync.\n   // InpEngineMode remains only a startup fallback for older/local .set files.\n   string control=g_controlMode;\n   StringToUpper(control);\n   if(control == "ZERO_GRID") return "ZERO_GRID";\n   if(control == "RACE") return "RACE";\n   if(control == "AUTO" || control == "ASSISTED" || control == "MANUAL")\n      return "AUTO";\n\n   string engine=g_engineMode;\n   StringToUpper(engine);\n   if(engine == "ZERO_GRID" || engine == "RACE") return engine;\n   return "AUTO";\n}\n\nbool ZeroGridModeEnabled()\n{\n   return EffectiveExecutionMode() == "ZERO_GRID";\n}''',
              'ZERO mode authority',
              re.S,
          )

          ea = sub1(
              ea,
              r'int ZeroGridPositionCount\(\)\s*\{.*?\n\}\n\nint ZeroGridPendingCount\(\)',
              '''int ZeroGridPositionCount()\n{\n   LoadZeroGridCycleState();\n   int count=0;\n   bool netting=ZeroGridAccountIsNetting();\n   for(int i=PositionsTotal()-1;i>=0;i--)\n   {\n      ulong ticket=PositionGetTicket(i);\n      if(ticket==0 || !PositionSelectByTicket(ticket)) continue;\n      if(PositionGetString(POSITION_SYMBOL)!=_Symbol || PositionGetInteger(POSITION_MAGIC)!=InpMagic) continue;\n      string comment=PositionGetString(POSITION_COMMENT);\n      // Hedging retains per-position comments: only ZERO-tagged positions belong\n      // to ZERO. Netting may merge fills/comments, so persisted cycle ownership\n      // is used there only while an actual ZERO cycle is active.\n      if(IsZeroGridComment(comment) || (netting && g_zeroGridCycleStartedAt>0)) count++;\n   }\n   return count;\n}\n\nint ZeroGridPendingCount()''',
              'ZERO position ownership',
              re.S,
          )

          ea = sub1(
              ea,
              r'bool RaceModeEnabled\(\)\s*\{\s*return g_engineMode == "RACE";\s*\}',
              'bool RaceModeEnabled()\n{\n   return EffectiveExecutionMode() == "RACE";\n}',
              'RACE mode authority',
              re.S,
          )

          ea = sub1(
              ea,
              r'\s*string requestedEngineMode = JsonString\(json, "engineMode", ""\);.*?\n\s*string mode = JsonString\(json, "entryMode", ""\);',
              '''\n\n   string requestedEngineMode = JsonString(json, "engineMode", "");\n   StringToUpper(requestedEngineMode);\n   bool hasEngineMode = requestedEngineMode == "AUTO" || requestedEngineMode == "RACE" || requestedEngineMode == "ZERO_GRID";\n\n   string requestedControlMode = JsonString(json, "controlMode", "");\n   StringToUpper(requestedControlMode);\n   bool hasControlMode =\n      requestedControlMode == "AUTO" || requestedControlMode == "RACE" ||\n      requestedControlMode == "ZERO_GRID" || requestedControlMode == "ASSISTED" ||\n      requestedControlMode == "MANUAL" || requestedControlMode == "LEGACY";\n\n   // Hard isolation: one execution owner at a time. controlMode is authoritative\n   // when both are present; partial/legacy payloads are normalized immediately.\n   if(hasControlMode)\n   {\n      g_controlMode = requestedControlMode;\n      if(g_controlMode == "ZERO_GRID") g_engineMode = "ZERO_GRID";\n      else if(g_controlMode == "RACE") g_engineMode = "RACE";\n      else g_engineMode = "AUTO";\n   }\n   else if(hasEngineMode)\n   {\n      g_engineMode = requestedEngineMode;\n      if(g_engineMode == "ZERO_GRID") g_controlMode = "ZERO_GRID";\n      else if(g_engineMode == "RACE") g_controlMode = "RACE";\n      else if(g_controlMode == "ZERO_GRID" || g_controlMode == "RACE" || g_controlMode == "LEGACY") g_controlMode = "AUTO";\n   }\n\n   string mode = JsonString(json, "entryMode", "");''',
              'settings mode normalization',
              re.S,
          )

          old = ',\\"engineMode\\":\\"ADAPTIVE\\",\\"basketFillActive\\":%s'
          new = ',\\"engineMode\\":\\"%s\\",\\"basketFillActive\\":%s'
          if old not in ea:
              raise SystemExit('heartbeat engineMode marker not found')
          ea = ea.replace(old, new, 1)
          marker = 'g_burstActive ? "true" : "false",'
          idx = ea.find(marker, ea.find(new))
          if idx < 0:
              raise SystemExit('heartbeat mode argument marker not found')
          ea = ea[:idx] + 'EffectiveExecutionMode(),\n         ' + ea[idx:]
          ea_path.write_text(ea, encoding="utf-8")

          api_path = Path("apps/api/src/bot.controller.ts")
          api = api_path.read_text(encoding="utf-8")
          api = sub1(
              api,
              r'\n\s*if \(body\.controlMode !== undefined\) \{.*?\n\s*if \(body\.entryMode !== undefined\) \{',
              '''\n\n    const requestedControlMode = body.controlMode !== undefined\n      ? String(body.controlMode || "").toUpperCase()\n      : null;\n    const requestedEngineMode = body.engineMode !== undefined\n      ? String(body.engineMode || "").toUpperCase()\n      : null;\n\n    if (requestedControlMode !== null && !["AUTO", "RACE", "ZERO_GRID", "ASSISTED", "MANUAL"].includes(requestedControlMode)) {\n      throw new BadRequestException("Control Mode ไม่ถูกต้อง");\n    }\n    if (requestedEngineMode !== null && !["AUTO", "RACE", "ZERO_GRID"].includes(requestedEngineMode)) {\n      throw new BadRequestException("Engine Mode ไม่ถูกต้อง");\n    }\n\n    // Canonical DB pair: never persist a stale ZERO/RACE engine next to another mode.\n    if (requestedControlMode !== null) {\n      clean.controlMode = requestedControlMode;\n      clean.engineMode = requestedControlMode === "ZERO_GRID"\n        ? "ZERO_GRID"\n        : requestedControlMode === "RACE"\n          ? "RACE"\n          : "AUTO";\n    } else if (requestedEngineMode !== null) {\n      clean.engineMode = requestedEngineMode;\n      clean.controlMode = requestedEngineMode === "ZERO_GRID"\n        ? "ZERO_GRID"\n        : requestedEngineMode === "RACE"\n          ? "RACE"\n          : "AUTO";\n    }\n\n    if (body.entryMode !== undefined) {''',
              'API canonical mode pair',
              re.S,
          )
          api_path.write_text(api, encoding="utf-8")

          web_path = Path("apps/web/app/dashboard/page.tsx")
          web = web_path.read_text(encoding="utf-8")
          web = sub1(
              web,
              r'\n\s*const eaSettingsTelemetryReady =\s*isMt5Online &&',
              '''\n  const desiredControlMode = String(settings.controlMode || settings.engineMode || "AUTO").toUpperCase();\n  const desiredEngineMode = desiredControlMode === "ZERO_GRID"\n    ? "ZERO_GRID"\n    : desiredControlMode === "RACE"\n      ? "RACE"\n      : "AUTO";\n  const eaSettingsTelemetryReady =\n    isMt5Online &&\n    metrics.controlMode !== undefined &&\n    metrics.engineMode !== undefined &&''',
              'dashboard mode sync readiness',
              re.S,
          )
          web = sub1(
              web,
              r'(const eaSettingsSynced =\s*eaSettingsTelemetryReady &&\s*)String\(metrics\.profitTargetMode',
              r'\1String(metrics.controlMode || "").toUpperCase() === desiredControlMode &&\n    String(metrics.engineMode || "").toUpperCase() === desiredEngineMode &&\n    String(metrics.profitTargetMode',
              'dashboard mode sync comparison',
              re.S,
          )
          old_chip = '<span>{String(settings.engineMode || "AUTO").toUpperCase() === "ZERO_GRID" ? "ZERO GRID" : String(settings.engineMode || "AUTO").toUpperCase() === "RACE" ? "RACE" : settings.entryMode === "AUTO_MOMENTUM" ? "AUTO SMART" : settings.entryMode}</span>'
          new_chip = '<span>{String(settings.controlMode || settings.engineMode || "AUTO").toUpperCase() === "ZERO_GRID" ? "ZERO GRID" : String(settings.controlMode || settings.engineMode || "AUTO").toUpperCase() === "RACE" ? "RACE" : settings.entryMode === "AUTO_MOMENTUM" ? "AUTO SMART" : settings.entryMode}</span>'
          if old_chip not in web:
              raise SystemExit('dashboard hero mode chip not found')
          web = web.replace(old_chip, new_chip, 1)
          web_path.write_text(web, encoding="utf-8")
          PY

      - name: Validate isolation contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ea = Path("mt5/FastBasketBot.mq5").read_text(encoding="utf-8")
          api = Path("apps/api/src/bot.controller.ts").read_text(encoding="utf-8")
          web = Path("apps/web/app/dashboard/page.tsx").read_text(encoding="utf-8")
          required = [
            (ea, '#property version   "1.0.5"'),
            (ea, 'string EffectiveExecutionMode()'),
            (ea, 'return EffectiveExecutionMode() == "ZERO_GRID";'),
            (ea, 'return EffectiveExecutionMode() == "RACE";'),
            (ea, '(netting && g_zeroGridCycleStartedAt>0)'),
            (ea, 'bool hasControlMode ='),
            (ea, 'EffectiveExecutionMode(),'),
            (api, 'Canonical DB pair:'),
            (web, 'const desiredControlMode = String(settings.controlMode || settings.engineMode || "AUTO").toUpperCase();'),
            (web, 'String(metrics.engineMode || "").toUpperCase() === desiredEngineMode'),
          ]
          for text, marker in required:
              if marker not in text:
                  raise SystemExit('missing sentinel: ' + marker)
          if 'g_engineMode == "ZERO_GRID" || g_controlMode == "ZERO_GRID"' in ea:
              raise SystemExit('stale ZERO OR ownership remains')
          if '\\"engineMode\\":\\"ADAPTIVE\\"' in ea:
              raise SystemExit('fake ADAPTIVE engineMode telemetry remains')
          PY

      - name: Commit isolated-mode fix
        shell: bash
        run: |
          git config user.name "SCENOVA Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5 apps/api/src/bot.controller.ts apps/web/app/dashboard/page.tsx
          if git diff --cached --quiet; then
            echo "Mode isolation already applied."
            exit 0
          fi
          git commit -m "fix: isolate ZERO GRID from AUTO and RACE"
          git push origin HEAD:main
