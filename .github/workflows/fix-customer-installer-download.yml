name: Fix Customer Installer Download

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-customer-installer-download.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch customer installer flow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          page = Path("apps/web/app/dashboard/page.tsx")
          text = page.read_text(encoding="utf-8")
          start_marker = "  async function downloadInstallerForSlot(slotId: string) {"
          end_marker = "\n\n  async function rebindDetectedAccount"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("dashboard installer block not found")
          replacement = r'''  function submitInstallerDownload(code: string, version: string) {
            if (typeof document === "undefined") {
              throw new Error("เบราว์เซอร์ยังไม่พร้อมดาวน์โหลด SCENOVA Installer");
            }
            const form = document.createElement("form");
            form.method = "POST";
            form.action = "/installer-download";
            form.style.display = "none";
            const addField = (name: string, value: string) => {
              const input = document.createElement("input");
              input.type = "hidden";
              input.name = name;
              input.value = value;
              form.appendChild(input);
            };
            addField("code", code);
            addField("version", version);
            document.body.appendChild(form);
            form.submit();
            window.setTimeout(() => form.remove(), 1000);
          }

          async function downloadInstallerForSlot(slotId: string) {
            const result = await api("/bot/installers/windows", {
              method: "POST",
              body: JSON.stringify({ slotId: slotId || undefined })
            });
            const code = String(result?.code || "").trim();
            const version = String(result?.installerVersion || "").trim();
            if (!code || !version) {
              throw new Error("ยังไม่มี SCENOVA Windows Installer สำหรับบัญชีนี้");
            }
            submitInstallerDownload(code, version);
            return result;
          }'''
          text = text[:start] + replacement + text[end:]
          page.write_text(text, encoding="utf-8", newline="\n")

          controls = Path("apps/web/components/Mt5ManualActionControls.tsx")
          text = controls.read_text(encoding="utf-8")
          start_marker = "  function downloadInstaller() {"
          end_marker = "\n\n  async function runOneClickUpdate"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("manual control installer block not found")
          replacement = r'''  async function downloadInstaller() {
            if (typeof document === "undefined" || !slotId) return false;
            const result = await api("/bot/installers/windows", {
              method: "POST",
              body: JSON.stringify({ slotId })
            });
            const code = String(result?.code || "").trim();
            const version = String(result?.installerVersion || installerVersion || "").trim();
            if (!code || !version) {
              throw new Error("ยังไม่มี SCENOVA Windows Installer สำหรับบัญชีนี้");
            }

            const form = document.createElement("form");
            form.method = "POST";
            form.action = "/installer-download";
            form.style.display = "none";
            for (const [name, value] of [["code", code], ["version", version]]) {
              const input = document.createElement("input");
              input.type = "hidden";
              input.name = name;
              input.value = value;
              form.appendChild(input);
            }
            document.body.appendChild(form);
            form.submit();
            window.setTimeout(() => form.remove(), 1000);
            return true;
          }'''
          text = text[:start] + replacement + text[end:]
          text = text.replace("      downloadInstaller();\n", "      await downloadInstaller();\n")
          controls.write_text(text, encoding="utf-8", newline="\n")

          runtime = Path("tools/windows-installer/Runtime.cs")
          text = runtime.read_text(encoding="utf-8")
          marker = "        return code.Length >= 12 ? code : null;"
          if marker not in text:
              raise SystemExit("Runtime enrollment return not found")
          if "duplicateMarker" not in text:
              addition = r'''        // Browsers may append " (1)", " (2)", ... when the same
        // personalized installer is downloaded more than once. Strip only that
        // local duplicate suffix so the original enrollment code stays valid.
        var duplicateMarker = code.LastIndexOf(" (", StringComparison.Ordinal);
        if (duplicateMarker > 0 && code.EndsWith(")", StringComparison.Ordinal))
        {
            var suffix = code[(duplicateMarker + 2)..^1];
            if (int.TryParse(suffix, out _))
                code = code[..duplicateMarker].Trim();
        }

'''
              text = text.replace(marker, addition + marker, 1)
          runtime.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Verify personalized download code paths
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'form.action = "/installer-download"' apps/web/app/dashboard/page.tsx
          grep -q 'form.action = "/installer-download"' apps/web/components/Mt5ManualActionControls.tsx
          grep -q 'duplicateMarker' tools/windows-installer/Runtime.cs
          test -f apps/web/app/installer-download/route.ts
          if grep -A35 'async function downloadInstallerForSlot' apps/web/app/dashboard/page.tsx | grep -q 'response.blob'; then
            echo "legacy blob installer path is still present"
            exit 1
          fi

      - name: Commit customer installer fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/app/dashboard/page.tsx apps/web/components/Mt5ManualActionControls.tsx tools/windows-installer/Runtime.cs
          if git diff --cached --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git commit -m "fix: make customer installer download reliable"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
