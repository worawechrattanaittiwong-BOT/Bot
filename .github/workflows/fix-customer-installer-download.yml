name: Fix Customer Installer Download

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-customer-installer-download.yml"
      - "scripts/fix_customer_installer_download.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch customer installer flow
        run: python3 scripts/fix_customer_installer_download.py

      - name: Verify personalized download code paths
        run: |
          set -euo pipefail
          grep -q 'form.action = "/installer-download"' apps/web/app/dashboard/page.tsx
          grep -q 'form.action = "/installer-download"' apps/web/components/Mt5ManualActionControls.tsx
          grep -q 'duplicateMarker' tools/windows-installer/Runtime.cs
          test -f apps/web/app/installer-download/route.ts
          if grep -A35 'async function downloadInstallerForSlot' apps/web/app/dashboard/page.tsx | grep -q 'response.blob'; then
            echo "legacy blob installer path is still present"
            exit 1
          fi

      - name: Commit customer installer fix
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/app/dashboard/page.tsx apps/web/components/Mt5ManualActionControls.tsx tools/windows-installer/Runtime.cs
          if git diff --cached --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git commit -m "fix: make customer installer download reliable"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
