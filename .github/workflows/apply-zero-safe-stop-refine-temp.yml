name: Refine ZERO GRID Safe Stop Temporary
on:
  push:
    branches: [fix/zero-grid-safe-stop-drain-feedback]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-grid-safe-stop-drain-feedback
          fetch-depth: 0
      - name: Apply explicit Safe Stop guard
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Validate explicit Safe Stop guard
        run: |
          node ./tests/zero-grid-v1-simulation.mjs
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/apply-zero-safe-stop-refine-temp.yml
          git config user.name "scenova-build"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5 tests/zero-grid-v1-simulation.mjs .github/workflows/apply-zero-safe-stop-refine-temp.yml
          git commit -m "fix: scope ZERO drain to explicit Safe Stop"
          git push origin HEAD:fix/zero-grid-safe-stop-drain-feedback
