name: TEMP guarded AUTO RACE fast-close patch v3

on:
  push:
    branches:
      - fix/fast-close-auto-race-latency

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact latency-only patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceSha = (git hash-object "mt5/FastBasketBot.mq5").Trim()
          if ($sourceSha -ne "284167076a7ec47892a7ef69a9b0c14e0683166f") { throw "Unexpected EA source SHA: $sourceSha" }
          $apiSha = (git hash-object "apps/api/src/release-version.ts").Trim()
          if ($apiSha -ne "d1909608cefd0a3672d6fcaf4c10c67747524ec7") { throw "Unexpected release-version SHA: $apiSha" }

          @'
          from pathlib import Path

          source_path = Path('mt5/FastBasketBot.mq5')
          text = source_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '\n'.join([
                  '#property version   "1.0.17"',
                  '#define SCENOVA_EA_VERSION "1.0.17"',
                  '#define SCENOVA_PRODUCT_VERSION "1.0.17"',
              ]),
              '\n'.join([
                  '#property version   "1.0.18"',
                  '#define SCENOVA_EA_VERSION "1.0.18"',
                  '#define SCENOVA_PRODUCT_VERSION "1.0.18"',
              ]),
              'EA version block')

          old_auto = '\n'.join([
              'bool AutoV20ManageOpenBasket(double momentum)',
              '{',
              '   if(!AutoV20Enabled() || BasketPositionCount()<=0 || BasketHasRacePosition())',
              '      return false;',
              '   int direction=BasketDirection();',
              '   if(direction==0)',
              '      return false;',
              '',
              '   double atrPoints=MathMax(10.0,',
              '      AverageTrueRangePoints(PERIOD_M5,g_atrPeriod));',
              '   MqlTick tick;',
              '   if(!SymbolInfoTick(_Symbol,tick))',
              '      return false;',
              '   double exitPrice=direction>0 ? tick.bid : tick.ask;',
              '',
              '   if(g_autoV20BasketStartedAt<=0)',
              '      g_autoV20BasketStartedAt=TimeCurrent();',
              '',
              '   if(g_autoV20BasketStopPrice>0.0)',
              '   {',
              '      bool stopHit=direction>0',
              '         ? exitPrice<=g_autoV20BasketStopPrice',
              '         : exitPrice>=g_autoV20BasketStopPrice;',
              '      if(stopHit)',
              '      {',
              '         bool closed=CloseAllBasket("AUTO_V20_STRUCTURE_STOP");',
              '         if(closed) AutoV20ResetCycle();',
              '         g_executionStatus="AUTO_V20_STRUCTURE_STOP";',
              '         return true;',
              '      }',
              '   }',
              '',
              '   if(g_autoV20BasketTargetPrice>0.0 && g_profitTargetMode=="AUTO")',
              '   {',
              '      bool targetHit=direction>0',
              '         ? exitPrice>=g_autoV20BasketTargetPrice',
              '         : exitPrice<=g_autoV20BasketTargetPrice;',
              '      if(targetHit)',
              '      {',
              '         bool closed=CloseAllBasket("AUTO_V20_MODERATE_TARGET");',
              '         if(closed) AutoV20ResetCycle();',
              '         g_executionStatus="AUTO_V20_MODERATE_TARGET";',
              '         return true;',
              '      }',
              '   }',
              '',
              '   double progress=BasketFavorableProgressPoints(direction);',
          ])
          new_auto = '\n'.join([
              'bool AutoV20FastPriceExit()',
              '{',
              '   if(!AutoV20Enabled() || BasketPositionCount()<=0 || BasketHasRacePosition())',
              '      return false;',
              '   int direction=BasketDirection();',
              '   if(direction==0)',
              '      return false;',
              '',
              '   MqlTick tick;',
              '   if(!SymbolInfoTick(_Symbol,tick))',
              '      return false;',
              '   double exitPrice=direction>0 ? tick.bid : tick.ask;',
              '',
              '   if(g_autoV20BasketStartedAt<=0)',
              '      g_autoV20BasketStartedAt=TimeCurrent();',
              '',
              '   if(g_autoV20BasketStopPrice>0.0)',
              '   {',
              '      bool stopHit=direction>0',
              '         ? exitPrice<=g_autoV20BasketStopPrice',
              '         : exitPrice>=g_autoV20BasketStopPrice;',
              '      if(stopHit)',
              '      {',
              '         bool closed=CloseAllBasket("AUTO_V20_STRUCTURE_STOP");',
              '         if(closed) AutoV20ResetCycle();',
              '         g_executionStatus="AUTO_V20_STRUCTURE_STOP";',
              '         return true;',
              '      }',
              '   }',
              '',
              '   if(g_autoV20BasketTargetPrice>0.0 && g_profitTargetMode=="AUTO")',
              '   {',
              '      bool targetHit=direction>0',
              '         ? exitPrice>=g_autoV20BasketTargetPrice',
              '         : exitPrice<=g_autoV20BasketTargetPrice;',
              '      if(targetHit)',
              '      {',
              '         bool closed=CloseAllBasket("AUTO_V20_MODERATE_TARGET");',
              '         if(closed) AutoV20ResetCycle();',
              '         g_executionStatus="AUTO_V20_MODERATE_TARGET";',
              '         return true;',
              '      }',
              '   }',
              '   return false;',
              '}',
              '',
              'bool AutoV20ManageOpenBasket(double momentum)',
              '{',
              '   if(!AutoV20Enabled() || BasketPositionCount()<=0 || BasketHasRacePosition())',
              '      return false;',
              '   int direction=BasketDirection();',
              '   if(direction==0)',
              '      return false;',
              '',
              '   // Preserve the original V20 stop/target precedence at the original call site.',
              '   if(AutoV20FastPriceExit())',
              '      return true;',
              '',
              '   double atrPoints=MathMax(10.0,',
              '      AverageTrueRangePoints(PERIOD_M5,g_atrPeriod));',
              '',
              '   double progress=BasketFavorableProgressPoints(direction);',
          ])
          replace_once(old_auto, new_auto, 'AUTO V20 fast-price exit refactor')

          old_ontick = '\n'.join([
              '   if(count > 0)',
              '   {',
              '      // Dynamic protection never decides whether an entry is allowed. It only',
              '      // manages exits after a Position exists.',
              '      RefreshMarketContext(false);',
              '      RecoverOpenBasketJournal();',
              '      ManageDynamicProtection();',
              '',
              '      bool tacticalBasket=BasketHasTacticalPosition();',
              '      if(tacticalBasket)',
          ])
          new_ontick = '\n'.join([
              '   if(count > 0)',
              '   {',
              '      bool tacticalBasket=BasketHasTacticalPosition();',
              '',
              '      // The existing V20 locked price stop/target can be checked before',
              '      // market-context, journal and protection work without changing its rule.',
              '      if(!tacticalBasket && AutoV20Enabled() && AutoV20FastPriceExit())',
              '         return;',
              '',
              '      // Dynamic protection never decides whether an entry is allowed. It only',
              '      // manages exits after a Position exists.',
              '      RefreshMarketContext(false);',
              '      RecoverOpenBasketJournal();',
              '      ManageDynamicProtection();',
              '',
              '      if(tacticalBasket)',
          ])
          replace_once(old_ontick, new_ontick, 'OnTick AUTO V20 fast-price dispatch')

          race_start = text.index('bool ManageRaceBasket(double momentum)')
          race_end = text.index('\nvoid OnTick()', race_start)
          race = text[race_start:race_end]
          if race.count('   RefreshMarketContext(false);') != 1:
              raise SystemExit('RACE expected exactly one pre-existing context refresh')
          race = race.replace('   RefreshMarketContext(false);\n', '', 1)

          def race_replace(old, new, label, expected=1):
              global race
              count = race.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected}, found {count}')
              race = race.replace(old, new)

          race_replace(
              '      g_raceState = "FILLING";\n      ProcessRaceFill(direction);\n      return true;',
              '      g_raceState = "FILLING";\n      RefreshMarketContext(false);\n      ProcessRaceFill(direction);\n      return true;',
              'RACE fill context')
          race_replace(
              '      g_raceState = "RECOVERY_WAIT";\n      g_executionStatus = "RACE_RECOVERY_WAIT";\n      return true;',
              '      RefreshMarketContext(false);\n      g_raceState = "RECOVERY_WAIT";\n      g_executionStatus = "RACE_RECOVERY_WAIT";\n      return true;',
              'RACE recovery context', expected=2)
          race_replace(
              '      g_raceState = "PROFIT_RUN";\n      g_executionStatus = "RACE_PROFIT_RUN";\n      return true;',
              '      RefreshMarketContext(false);\n      g_raceState = "PROFIT_RUN";\n      g_executionStatus = "RACE_PROFIT_RUN";\n      return true;',
              'RACE profit-run context')
          race_replace(
              '   g_raceState = "FULL_WAIT_PROFIT";\n   g_executionStatus = "RACE_FULL_WAIT_PROFIT";\n   return true;',
              '   RefreshMarketContext(false);\n   g_raceState = "FULL_WAIT_PROFIT";\n   g_executionStatus = "RACE_FULL_WAIT_PROFIT";\n   return true;',
              'RACE full-wait context')
          race = race.replace(
              '   int direction = BasketDirection();',
              '   // RACE close decisions use direct P/L, current price and completed M5 data.\n'
              '   // Defer expensive market-context refresh to non-close paths only.\n'
              '   int direction = BasketDirection();',
              1)
          text = text[:race_start] + race + text[race_end:]

          checks = {
              'manual fast path retained': text.count('double fastCycleProfit = BasketCycleProfit();') == 1,
              'AUTO fast helper singular': text.count('bool AutoV20FastPriceExit()') == 1,
              'AUTO fast dispatch singular': text.count('AutoV20Enabled() && AutoV20FastPriceExit()') == 1,
              'AUTO manage singular': text.count('bool AutoV20ManageOpenBasket(double momentum)') == 1,
              'RACE manage singular': text.count('bool ManageRaceBasket(double momentum)') == 1,
              'RACE profit harvest retained': text.count('int harvested = RaceHarvestProfitablePositions();') == 1,
              'RACE close cycle retained': text.count('bool RaceCloseCycle(string reason)') == 1,
              'CloseAllBasket retained': text.count('bool CloseAllBasket(string reason)') == 1,
              'generic close retained': text.count('bool ClosePositionByTicket(ulong ticket)') == 1,
              'ZERO ownership retained': text.count('if(g_zeroGridClosing || ZeroGridPositionCount()>0 || ZeroGridPendingCount()>0)') == 1,
              'RACE ownership retained': text.count('if(count > 0 && BasketHasRacePosition())') == 1,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Invariant checks failed: ' + ', '.join(failed))

          source_path.write_text(text, encoding='utf-8')

          api_path = Path('apps/api/src/release-version.ts')
          api = api_path.read_text(encoding='utf-8')
          old_api = 'export const DEFAULT_EA_VERSION = "1.0.17";'
          if api.count(old_api) != 1:
              raise SystemExit('API EA version anchor mismatch')
          api_path.write_text(api.replace(old_api, 'export const DEFAULT_EA_VERSION = "1.0.18";', 1), encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\patch.py"
          python "$env:RUNNER_TEMP\patch.py"

          $changed = @(git diff --name-only)
          $expected = @('apps/api/src/release-version.ts','mt5/FastBasketBot.mq5')
          if (($changed -join "`n") -ne ($expected -join "`n")) { throw "Unexpected changed files: $($changed -join ', ')" }

      - name: Verify release and latency invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./tests/release-version-consistency.ps1
          $text = [System.IO.File]::ReadAllText((Resolve-Path 'mt5/FastBasketBot.mq5'))
          foreach ($sentinel in @(
            '#property version   "1.0.18"',
            'bool AutoV20FastPriceExit()',
            'if(!tacticalBasket && AutoV20Enabled() && AutoV20FastPriceExit())',
            'bool AutoV20ManageOpenBasket(double momentum)',
            'int harvested = RaceHarvestProfitablePositions();',
            'RACE_QUICK_PROFIT',
            'RACE_PROFIT_GIVEBACK',
            'RACE_FLOW_ENDED_PROFIT',
            'double fastCycleProfit = BasketCycleProfit();',
            'bool CloseAllBasket(string reason)',
            'void SendHeartbeat()'
          )) {
            if (-not $text.Contains($sentinel)) { throw "Missing invariant: $sentinel" }
          }

      - name: Install official MetaTrader 5 build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          $installDir = "C:\SCENOVA-MT5-AutoRace-Latency-Check"
          Invoke-WebRequest -UseBasicParsing -Uri "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto /path:`"$installDir`"" -Wait
          $metaEditor = Get-ChildItem -Path $installDir -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaEditor) { throw "metaeditor64.exe was not installed" }
          "METAEDITOR=$($metaEditor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile patched FastBasketBot.mq5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sourceDir = "$env:RUNNER_TEMP\SCENOVA-AutoRace-Latency"
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
          $source = Join-Path $sourceDir "FastBasketBot.mq5"
          Copy-Item -Force "mt5\FastBasketBot.mq5" $source
          $log = "$env:RUNNER_TEMP\FastBasketBot-auto-race-latency.log"
          Start-Process -FilePath "$env:METAEDITOR" -ArgumentList "/compile:`"$source`" /log:`"$log`"" -Wait
          if (Test-Path $log) { Get-Content $log }
          $ex5 = [System.IO.Path]::ChangeExtension($source, ".ex5")
          if (-not (Test-Path $ex5)) { throw "FastBasketBot.ex5 was not produced" }
          if (Test-Path $log) {
            $logText = Get-Content $log -Raw
            if ($logText -match "(?im)\b[1-9][0-9]*\s+errors?\b") { throw "MetaEditor reported compile errors" }
          }

      - name: Commit guarded patch and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Latency Patch"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5 apps/api/src/release-version.ts
          git rm .github/workflows/_temp-auto-race-fast-close.yml .github/workflows/_temp-auto-race-fast-close-v2.yml .github/workflows/_temp-auto-race-fast-close-v3.yml
          git commit -m "fix(mt5): reduce AUTO and RACE close-path latency"
          git push origin HEAD:fix/fast-close-auto-race-latency
