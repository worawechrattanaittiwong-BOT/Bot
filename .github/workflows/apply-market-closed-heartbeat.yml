name: Apply Market Closed Heartbeat Fix

concurrency:
  group: apply-market-closed-heartbeat
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade-market-closed-heartbeat.ps1"
      - ".github/workflows/apply-market-closed-heartbeat.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source patch
        shell: pwsh
        run: ./scripts/upgrade-market-closed-heartbeat.ps1

      - name: Normalize regression sentinel
        shell: pwsh
        run: |
          $path = 'tests/market-closed-heartbeat-contract.ps1'
          $text = [System.IO.File]::ReadAllText((Resolve-Path $path))
          $text = $text.Replace("  '`"marketSessionState`"'", "  'marketSessionState'")
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, [System.Text.UTF8Encoding]::new($false))

      - name: Verify market-closed heartbeat contract
        shell: pwsh
        run: ./tests/market-closed-heartbeat-contract.ps1

      - name: Verify unified 1.0.0 release remains unchanged
        shell: pwsh
        run: ./tests/release-version-consistency.ps1

      - name: Typecheck and build API Web
        run: |
          npm install
          npm run typecheck
          npm run build

      - name: Publish source fix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git diff --quiet HEAD origin/main
          if ($LASTEXITCODE -eq 1) { throw "main moved during validation; rerun on newest main" }
          if ($LASTEXITCODE -ne 0) { throw "could not compare main" }

          git add mt5/FastBasketBot.mq5
          git add apps/web/app/dashboard/page.tsx
          git add tests/market-closed-heartbeat-contract.ps1
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Patch already current"; exit 0 }
          if ($LASTEXITCODE -ne 1) { throw "could not inspect staged source" }

          git commit -m "fix: keep EA heartbeat alive when market is closed"
          git push origin HEAD:main
