name: Apply FLIP LOCK Clip V2

on:
  push:
    branches: [feature/flip-lock-clip-v2]
    paths:
      - "scripts/patch-flip-lock-clip-v2.py"
      - "mt5/include/FlipLockV1.mqh"
      - ".github/workflows/apply-flip-lock-clip-v2.yml"

permissions:
  contents: write

concurrency:
  group: apply-flip-lock-clip-v2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply isolated FLIP LOCK patch
        run: python3 scripts/patch-flip-lock-clip-v2.py

      - name: Static FLIP LOCK isolation checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ea = Path('mt5/FastBasketBot.mq5').read_text(encoding='utf-8')
          flip = Path('mt5/include/FlipLockV1.mqh').read_text(encoding='utf-8')
          web = Path('apps/web/app/dashboard/page.tsx').read_text(encoding='utf-8')
          release = Path('apps/api/src/release-version.ts').read_text(encoding='utf-8')

          required_ea = [
              'FLIP LOCK V2 owns its entry',
              'FlipLockManage();',
              'FlipLockRemoveAllPending();',
              'g_profitTargetMode = "OFF"',
              '!FlipLockModeEnabled() &&',
              '#property version   "1.0.25"',
          ]
          required_flip = [
              '#define FLIP_LOCK_PENDING_COMMENT "SCNFlipLock"',
              'TRADE_ACTION_PENDING',
              'ORDER_TYPE_BUY_STOP',
              'ORDER_TYPE_SELL_STOP',
              'TRADE_ACTION_SLTP',
              'STARTER_OPENED',
          ]
          for token in required_ea:
              assert token in ea, f'missing EA sentinel: {token}'
          for token in required_flip:
              assert token in flip, f'missing FLIP sentinel: {token}'
          assert 'props.onEdit?.("profitTargetMode","OFF")' in web
          assert 'DEFAULT_EA_VERSION = "1.0.25"' in release
          for forbidden in ('StartRaceCycle(', 'ZeroGridPlace', 'ZeroGridArm'):
              assert forbidden not in flip, f'FLIP LOCK leaked into foreign execution owner: {forbidden}'
          assert 'FLIP_LOCK_MAX_FLIPS_PER_RUN' not in flip
          print('FLIP LOCK V2 static isolation checks passed')
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build web and API
        run: npm run build

      - name: Commit validated source patch to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5 \
            mt5/include/FlipLockV1.mqh \
            apps/web/app/dashboard/page.tsx \
            apps/api/src/release-version.ts
          if git diff --cached --quiet; then
            echo "Patch already current."
            exit 0
          fi
          git commit -m "feat: make FLIP LOCK immediate pending baton mode"
          git push origin HEAD:feature/flip-lock-clip-v2
