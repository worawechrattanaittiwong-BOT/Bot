name: Apply EA Heartbeat Resilience

on:
  push:
    branches:
      - "fix/ea-heartbeat-resilience-1046"
    paths:
      - ".github/workflows/apply-ea-heartbeat-resilience.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact source patch
        run: python tools/patch-ea-heartbeat.py

      - name: Validate patch shape
        run: |
          grep -F '#property version   "1.046"' mt5/FastBasketBot.mq5
          grep -F 'CONTROL_RETRYING' mt5/FastBasketBot.mq5
          grep -F 'RECONNECTING' mt5/FastBasketBot.mq5
          grep -F 'DEFAULT_EA_VERSION = "1.046"' apps/api/src/release-version.ts
          git diff --check

      - name: Commit patched source to feature branch
        run: |
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-ea-heartbeat-resilience.yml tools/patch-ea-heartbeat.py
          git add mt5/FastBasketBot.mq5 apps/api/src/release-version.ts
          git diff --cached --check
          git commit -m "fix: make EA heartbeat resilient to transient network gaps"
          git push origin HEAD:fix/ea-heartbeat-resilience-1046
