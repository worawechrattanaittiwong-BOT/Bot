name: Apply ZERO simple stable v1.0.17

on:
  push:
    branches:
      - fix/zero-simple-stable-v117

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip zero patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply isolated ZERO simplification
        run: python3 .github/scripts/apply_zero_simple_v117.py

      - name: Verify ZERO simple stable contract
        run: node tests/zero-simple-stable-v117.mjs

      - name: Verify ZERO geometry regression
        run: node tests/zero-grid-v1-simulation.mjs

      - name: Verify ZERO close and rearm contract
        shell: pwsh
        run: ./tests/zero-grid-close-geometry-contract.ps1

      - name: Verify AUTO remains isolated
        shell: pwsh
        run: ./tests/auto-v20-policy-regression.ps1

      - name: Commit tested branch patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "SCENOVA Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5 apps/api/src/release-version.ts tests/zero-grid-v1-simulation.mjs tests/zero-grid-close-geometry-contract.ps1 .github/workflows/build-mt5-ea.yml
          git commit -m "fix(mt5): simplify ZERO pending engine v1.0.17 [skip zero patch]"
          git push origin HEAD:fix/zero-simple-stable-v117
