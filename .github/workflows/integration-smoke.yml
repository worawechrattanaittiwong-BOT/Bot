          BACKTEST_LIST=$(curl -fsS "$BASE/backtest/runs?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$BACKTEST_LIST" | jq 'length')" -ge "1"
          test "$(printf '%s' "$BACKTEST_LIST" | jq -r '.[0].id')" = "$BACKTEST_ID"

          curl -fsS "$BASE/backtest/export.csv?id=$BACKTEST_ID" -H "authorization: Bearer $TOKEN" >/tmp/backtest.csv
          grep -q "Trade,Opened At,Closed At,Direction" /tmp/backtest.csv

          BACKTEST_PUBLISH=$(curl -fsS -X POST "$BASE/backtest/publish" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "{\"id\":\"$BACKTEST_ID\",\"published\":true}")
          BACKTEST_SLUG=$(printf '%s' "$BACKTEST_PUBLISH" | jq -r '.public_slug')
          test -n "$BACKTEST_SLUG"
          PUBLIC_PERF=$(curl -fsS "$BASE/performance/$BACKTEST_SLUG")
          test "$(printf '%s' "$PUBLIC_PERF" | jq -r '.label')" = "SIMULATED DEMO"
          test "$(printf '%s' "$PUBLIC_PERF" | jq -r '.summary.closedTrades')" = "24"
          test "$(printf '%s' "$PUBLIC_PERF" | jq '.trades | length')" -gt "0"

          echo "[integration] entitlement expiry forces SAFE_STOP on the next heartbeat"
          PGPASSWORD=bot psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -c "update trial_grants set expires_at=now()-interval '1 second' where mt5_account_id='$ACCOUNT_ID';" >/dev/null
          EXPIRED_HB=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"RUNNING\",\"metrics\":{\"accountNumber\":\"100001\",\"eaVersion\":\"$EA_VERSION\",\"runtimeContract\":\"$RUNTIME_CONTRACT\",\"server\":\"SCENOVA-Demo\",\"positions\":0}}")
          test "$(printf '%s' "$EXPIRED_HB" | jq -r '.access')" = "false"
          test "$(printf '%s' "$EXPIRED_HB" | jq -r '.desiredState')" = "SAFE_STOP"

          curl -fsS -X POST "$BASE/bot/stop?slotId=$SLOT" -H "authorization: Bearer $TOKEN" >/dev/null

          echo "[integration] account change is blocked while old MT5 has open positions"
          OLD_WITH_POS=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"SAFE_STOP\",\"metrics\":{\"accountNumber\":\"100001\",\"eaVersion\":\"$EA_VERSION\",\"runtimeContract\":\"$RUNTIME_CONTRACT\",\"server\":\"SCENOVA-Demo\",\"positions\":2}}")
          echo "[integration] owner can queue per-account Close All from maintenance control"
          CLOSE_ONE=$(curl -fsS -X POST "$BASE/admin/maintenance/close-instance" -H 'x-admin-key: integration-admin' -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\"}")
          test "$(printf '%s' "$CLOSE_ONE" | jq -r '.queued')" = "true"
          test "$(printf '%s' "$CLOSE_ONE" | jq -r '.positions')" = "2"
          CLOSE_ONE_CMD=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select command from bot_commands where bot_instance_id='$INSTANCE' and status='PENDING' order by id desc limit 1;")
          test "$CLOSE_ONE_CMD" = "CLOSE_ALL"
          DETECT_REAL_BLOCKED=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"SAFE_STOP\",\"metrics\":{\"accountNumber\":\"200002\",\"eaVersion\":\"$EA_VERSION\",\"runtimeContract\":\"$RUNTIME_CONTRACT\",\"server\":\"SCENOVA-Real\",\"positions\":0}}")
          test "$(printf '%s' "$DETECT_REAL_BLOCKED" | jq -r '.accountMismatch')" = "true"
          test "$(printf '%s' "$DETECT_REAL_BLOCKED" | jq -r '.previousBoundPositions')" = "2"
          test "$(printf '%s' "$DETECT_REAL_BLOCKED" | jq -r '.accountChangeBlocked')" = "true"
          REBIND_BLOCKED_HTTP=$(curl -sS -o /tmp/rebind-open-positions.json -w "%{http_code}" -X POST "$BASE/bot/mt5/rebind?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$REBIND_BLOCKED_HTTP" = "409"

          echo "[integration] pending Basket journal blocks MT5 account-follow until the old account journal drains"
          OLD_FLAT=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"SAFE_STOP\",\"metrics\":{\"accountNumber\":\"100001\",\"eaVersion\":\"$EA_VERSION\",\"runtimeContract\":\"$RUNTIME_CONTRACT\",\"server\":\"SCENOVA-Demo\",\"currency\":\"USD\",\"symbol\":\"XAUUSDm\",\"positions\":0,\"pendingBasketJournal\":true}}")
          PENDING_REAL=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"SAFE_STOP\",\"metrics\":{\"accountNumber\":\"200002\",\"eaVersion\":\"$EA_VERSION\",\"runtimeContract\":\"$RUNTIME_CONTRACT\",\"server\":\"SCENOVA-Real\",\"currency\":\"USC\",\"symbol\":\"XAUUSDc\",\"positions\":0,\"pendingBasketJournal\":true}}")
          test "$(printf '%s' "$PENDING_REAL" | jq -r '.accountMismatch')" = "true"
          test "$(printf '%s' "$PENDING_REAL" | jq -r '.journalDrainPending')" = "true"
          test "$(printf '%s' "$PENDING_REAL" | jq -r '.accountChangeBlocked')" = "true"
          PENDING_ACCOUNT=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select a.account_number from bot_instances bi join mt5_accounts a on a.id=bi.mt5_account_id where bi.id='$INSTANCE';")
          test "$PENDING_ACCOUNT" = "100001"
          PENDING_CURRENCY=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select metrics->>'currency' from bot_instances where id='$INSTANCE';")
          test "$PENDING_CURRENCY" = "USD"
          PENDING_REBIND_HTTP=$(curl -sS -o /tmp/rebind-pending-journal.json -w "%{http_code}" -X POST "$BASE/bot/mt5/rebind?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$PENDING_REBIND_HTTP" = "409"

          echo "[integration] delayed Basket journal is persisted under the old MT5 account and old currency"
          curl -fsS -X POST "$BASE/ea/journal" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"dealTicket\":\"900099\",\"eventType\":\"BASKET\",\"direction\":\"BUY\",\"volume\":0.01,\"netProfit\":2.50,\"entryTrigger\":\"PENDING_DRAIN_TEST\",\"entryModel\":\"PENDING_DRAIN_TEST\",\"basketIndex\":1,\"symbol\":\"XAUUSDc\",\"brokerServer\":\"SCENOVA-Real\",\"journalSchema\":3}" >/dev/null
          DRAIN_ACCOUNT=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select a.account_number from trade_journal tj join mt5_accounts a on a.id=tj.mt5_account_id where tj.deal_ticket=900099 and tj.event_type='BASKET';")
          test "$DRAIN_ACCOUNT" = "100001"
          DRAIN_CURRENCY=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select metadata->>'currency' from trade_journal where deal_ticket=900099 and event_type='BASKET';")
          test "$DRAIN_CURRENCY" = "USD"
          DRAIN_SERVER=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select metadata->>'brokerServer' from trade_journal where deal_ticket=900099 and event_type='BASKET';")
          test "$DRAIN_SERVER" = "SCENOVA-Demo"
          DRAIN_SYMBOL=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select metadata->>'symbol' from trade_journal where deal_ticket=900099 and event_type='BASKET';")
          test "$DRAIN_SYMBOL" = "XAUUSDm"

          echo "[integration] automatic account-follow succeeds after the old Basket journal is drained"
          DETECT_REAL=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"SAFE_STOP\",\"metrics\":{\"accountNumber\":\"200002\",\"eaVersion\":\"$EA_VERSION\",\"runtimeContract\":\"$RUNTIME_CONTRACT\",\"server\":\"SCENOVA-Real\",\"currency\":\"USC\",\"symbol\":\"XAUUSDc\",\"positions\":0,\"pendingBasketJournal\":false}}")
          test "$(printf '%s' "$DETECT_REAL" | jq -r '.accountMismatch // false')" = "false"
          test "$(printf '%s' "$DETECT_REAL" | jq -r '.access')" = "false"
          test "$(printf '%s' "$DETECT_REAL" | jq -r '.desiredState')" = "SAFE_STOP"
          test "$(printf '%s' "$DETECT_REAL" | jq -r '.previousBoundPositions')" = "0"

          FOLLOW_DASH=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$FOLLOW_DASH" | jq -r '.account.account_number')" = "200002"
          test "$(printf '%s' "$FOLLOW_DASH" | jq -r '.account.broker_server')" = "SCENOVA-Real"
          test "$(printf '%s' "$FOLLOW_DASH" | jq -r '.instance.pending_account_number // empty')" = ""
          test "$(printf '%s' "$FOLLOW_DASH" | jq -r '.instance.metrics.currency')" = "USC"
          test "$(printf '%s' "$FOLLOW_DASH" | jq -r '.settings.accountCurrencyReviewRequired')" = "true"
          test "$(printf '%s' "$FOLLOW_DASH" | jq -r '.settings.previousAccountCurrency')" = "USD"

          echo "[integration] currency review overrides a stale RUNNING intent before START delivery"
          FOLLOW_ACCOUNT_ID=$(printf '%s' "$FOLLOW_DASH" | jq -r '.account.id')
          FOLLOW_USER_ID=$(printf '%s' "$FOLLOW_DASH" | jq -r '.user.id')
          LOCAL_PLAN_ID=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select id from plans where code='LOCAL_30D' limit 1;")
          REVIEW_SUB_ID=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "insert into subscriptions(user_id,plan_id,status,starts_at,expires_at) values('$FOLLOW_USER_ID','$LOCAL_PLAN_ID','ACTIVE',now()-interval '1 minute',now()+interval '1 day') returning id;")
          PGPASSWORD=bot psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -c "update bot_instances set desired_state='RUNNING' where id='$INSTANCE'; insert into bot_commands(bot_instance_id,command) values('$INSTANCE','START');" >/dev/null
          REVIEW_HB=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"STOPPED\",\"metrics\":{\"accountNumber\":\"200002\",\"eaVersion\":\"$EA_VERSION\",\"runtimeContract\":\"$RUNTIME_CONTRACT\",\"server\":\"SCENOVA-Real\",\"currency\":\"USC\",\"symbol\":\"XAUUSDc\",\"positions\":0,\"pendingBasketJournal\":false}}")
          test "$(printf '%s' "$REVIEW_HB" | jq -r '.access')" = "true"
          test "$(printf '%s' "$REVIEW_HB" | jq -r '.desiredState')" = "SAFE_STOP"
          REVIEW_START_PENDING=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select count(*) from bot_commands where bot_instance_id='$INSTANCE' and command='START' and status in ('PENDING','DELIVERED');")
          test "$REVIEW_START_PENDING" = "0"
          PGPASSWORD=bot psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -c "delete from subscriptions where id='$REVIEW_SUB_ID';" >/dev/null

          echo "[integration] currency mismatch blocks partial settings save even if the explicit review flag is missing"
          PGPASSWORD=bot psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -c "update bot_settings set settings=settings-'accountCurrencyReviewRequired' where bot_instance_id='$INSTANCE';" >/dev/null
          PARTIAL_CURRENCY_SAVE_HTTP=$(curl -sS -o /tmp/currency-review-partial.json -w "%{http_code}" -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"maxPositions":7}')
          test "$PARTIAL_CURRENCY_SAVE_HTTP" = "409"

          REVIEW_PAYLOAD=$(printf '%s' "$FOLLOW_DASH" | jq -c '.settings')
          FULL_CURRENCY_SAVE=$(curl -fsS -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "$REVIEW_PAYLOAD")
          test "$(printf '%s' "$FULL_CURRENCY_SAVE" | jq -r '.settings.accountCurrency')" = "USC"
          test "$(printf '%s' "$FULL_CURRENCY_SAVE" | jq -r '.settings.accountCurrencyReviewRequired')" = "false"

          echo "[integration] same deal ticket on a different MT5 account does not collide or mix history"
          curl -fsS -X POST "$BASE/ea/journal" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"dealTicket\":\"900001\",\"eventType\":\"BASKET\",\"direction\":\"BUY\",\"volume\":0.01,\"netProfit\":5.00,\"entryTrigger\":\"CENT_REBIND_TEST\",\"entryModel\":\"CENT_REBIND_TEST\",\"basketIndex\":1,\"symbol\":\"XAUUSDm\",\"brokerServer\":\"SCENOVA-Real\",\"journalSchema\":3}" >/dev/null
          SAME_TICKET_ROWS=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select count(*) from trade_journal where deal_ticket=900001 and event_type='BASKET';")
          test "$SAME_TICKET_ROWS" = "2"
          SAME_TICKET_ACCOUNTS=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select count(distinct mt5_account_id) from trade_journal where deal_ticket=900001 and event_type='BASKET';")
          test "$SAME_TICKET_ACCOUNTS" = "2"
          CENT_JOURNAL_DASH=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$CENT_JOURNAL_DASH" | jq -r '.tradeJournal.stats.closedTrades')" = "1"
          test "$(printf '%s' "$CENT_JOURNAL_DASH" | jq -r '.tradeJournal.stats.netProfit')" = "5"

          echo "[integration] historical account performance survives MT5 rebind without mixing currencies"
          FOLLOW_ACCOUNT_ID=$(printf '%s' "$FOLLOW_DASH" | jq -r '.account.id')
          test -n "$FOLLOW_ACCOUNT_ID"
          OLD_ACCOUNT_PERF=$(curl -fsS "$BASE/performance-analytics/report?accountId=$ACCOUNT_ID" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$OLD_ACCOUNT_PERF" | jq -r '.summary.netProfit')" = "15"
          test "$(printf '%s' "$OLD_ACCOUNT_PERF" | jq -r '.summary.trades')" = "2"
          NEW_ACCOUNT_PERF=$(curl -fsS "$BASE/performance-analytics/report?accountId=$FOLLOW_ACCOUNT_ID" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$NEW_ACCOUNT_PERF" | jq -r '.summary.netProfit')" = "5"
          test "$(printf '%s' "$NEW_ACCOUNT_PERF" | jq -r '.summary.trades')" = "1"

          TRIAL_COUNT=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select count(*) from trial_grants where user_id=(select id from users where email='integration@scenova.test');")
          test "$TRIAL_COUNT" = "1"
          OLD_TRIAL=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select count(*) from trial_grants where account_number='100001';")
          test "$OLD_TRIAL" = "1"


          # Device identity is telemetry only; active MT5 identity remains unique.
          REGISTER2=$(curl -fsS -X POST "$BASE/auth/register" -H 'content-type: application/json' -d '{"email":"integration2@scenova.test","password":"Integration123!"}')
          TOKEN2=$(printf '%s' "$REGISTER2" | jq -r '.token')
          DASH_SECOND=$(curl -fsS "$BASE/bot/dashboard" -H "authorization: Bearer $TOKEN2")
          USER2_ID=$(printf '%s' "$DASH_SECOND" | jq -r '.user.id')
          SLOT_SECOND=$(printf '%s' "$DASH_SECOND" | jq -r '.selectedSlot.id')
          test -n "$USER2_ID"

          PREP_SECOND=$(curl -fsS -X POST "$BASE/bot/installers/windows" -H "authorization: Bearer $TOKEN2" -H 'content-type: application/json' -d "{\"slotId\":\"$SLOT_SECOND\"}")
          CODE_SECOND=$(printf '%s' "$PREP_SECOND" | jq -r '.code')

          ENROLL_SECOND=$(curl -fsS -X POST "$BASE/installer/enroll" -H 'content-type: application/json' -d "{\"code\":\"$CODE_SECOND\",\"devicePublicId\":\"integration-device-001\",\"deviceSecret\":\"another-device-secret-1234567890\",\"hostname\":\"CI-PC\",\"terminalPath\":\"/tmp/terminal2\"}")
          INSTANCE_SECOND=$(printf '%s' "$ENROLL_SECOND" | jq -r '.instanceId')
          INSTALL_TOKEN_SECOND=$(printf '%s' "$ENROLL_SECOND" | jq -r '.installToken')
          test -n "$INSTANCE_SECOND"
          test -n "$INSTALL_TOKEN_SECOND"

          echo "[integration] same physical PC is allowed; Server rights still decide trading"
          SECOND_HB=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE_SECOND\",\"installToken\":\"$INSTALL_TOKEN_SECOND\",\"state\":\"STOPPED\",\"metrics\":{\"accountNumber\":\"222222\",\"broker\":\"SCENOVA\",\"eaVersion\":\"$EA_VERSION\",\"runtimeContract\":\"$RUNTIME_CONTRACT\",\"server\":\"SCENOVA-Demo2\",\"positions\":0}}")
          test "$(printf '%s' "$SECOND_HB" | jq -r '.accountMismatch // false')" = "false"
          test "$(printf '%s' "$SECOND_HB" | jq -r '.access')" = "false"
          test "$(printf '%s' "$SECOND_HB" | jq -r '.desiredState')" = "SAFE_STOP"
          SECOND_DASH=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT_SECOND" -H "authorization: Bearer $TOKEN2")
          test "$(printf '%s' "$SECOND_DASH" | jq -r '.account.account_number')" = "222222"
          NO_ACCESS_START=$(curl -sS -o /tmp/no-access-start.json -w "%{http_code}" -X POST "$BASE/bot/start?slotId=$SLOT_SECOND" -H "authorization: Bearer $TOKEN2")
          test "$NO_ACCESS_START" = "409"

          echo "[integration] first MT5 bind is automatic without Device Lock"
          REGISTER3=$(curl -fsS -X POST "$BASE/auth/register" -H 'content-type: application/json' -d '{"email":"integration3@scenova.test","password":"Integration123!"}')
          TOKEN3=$(printf '%s' "$REGISTER3" | jq -r '.token')
          DASH3=$(curl -fsS "$BASE/bot/dashboard" -H "authorization: Bearer $TOKEN3")
          SLOT3=$(printf '%s' "$DASH3" | jq -r '.selectedSlot.id')

          PREP3=$(curl -fsS -X POST "$BASE/bot/installers/windows" -H "authorization: Bearer $TOKEN3" -H 'content-type: application/json' -d "{\"slotId\":\"$SLOT3\"}")
          CODE3=$(printf '%s' "$PREP3" | jq -r '.code')
          ENROLL3=$(curl -fsS -X POST "$BASE/installer/enroll" -H 'content-type: application/json' -d "{\"code\":\"$CODE3\",\"devicePublicId\":\"integration-device-003\",\"deviceSecret\":\"integration-device-secret-3333333333\",\"hostname\":\"LEGACY-PC\",\"terminalPath\":\"/tmp/terminal3\"}")
          INSTANCE3=$(printf '%s' "$ENROLL3" | jq -r '.instanceId')
          INSTALL_TOKEN3=$(printf '%s' "$ENROLL3" | jq -r '.installToken')

          # Device telemetry may be missing; authenticated EA still auto-binds MT5.
          PGPASSWORD=bot psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -c "update bot_instances set device_status='UNREGISTERED',device_last_seen_at=NULL,device_last_ip=NULL,mt5_account_id=NULL where id='$INSTANCE3';" >/dev/null

          FIRST_DETECT=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE3\",\"installToken\":\"$INSTALL_TOKEN3\",\"state\":\"SAFE_STOP\",\"metrics\":{\"accountNumber\":\"300003\",\"broker\":\"SCENOVA\",\"eaVersion\":\"$EA_VERSION\",\"runtimeContract\":\"$RUNTIME_CONTRACT\",\"server\":\"SCENOVA-Legacy\",\"currency\":\"USC\",\"positions\":0}}")
          test "$(printf '%s' "$FIRST_DETECT" | jq -r '.accountMismatch // false')" = "false"

          FIRST_DASH=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT3" -H "authorization: Bearer $TOKEN3")
          test "$(printf '%s' "$FIRST_DASH" | jq -r '.account.account_number')" = "300003"
          test "$(printf '%s' "$FIRST_DASH" | jq -r '.instance.metrics.currency')" = "USC"
          test "$(printf '%s' "$FIRST_DASH" | jq -r '.settings.accountCurrencyReviewRequired')" = "true"
          test "$(printf '%s' "$FIRST_DASH" | jq -r '.settings.previousAccountCurrency')" = "UNSET"

          echo "[integration] reinstalling the same Slot revokes the old EA token"
          REGISTER4=$(curl -fsS -X POST "$BASE/auth/register" -H 'content-type: application/json' -d '{"email":"integration4@scenova.test","password":"Integration123!"}')
          TOKEN4=$(printf '%s' "$REGISTER4" | jq -r '.token')
          DASH4=$(curl -fsS "$BASE/bot/dashboard" -H "authorization: Bearer $TOKEN4")
          SLOT4=$(printf '%s' "$DASH4" | jq -r '.selectedSlot.id')

          PREP4A=$(curl -fsS -X POST "$BASE/bot/installers/windows" -H "authorization: Bearer $TOKEN4" -H 'content-type: application/json' -d "{\"slotId\":\"$SLOT4\"}")
          CODE4A=$(printf '%s' "$PREP4A" | jq -r '.code')
          ENROLL4A=$(curl -fsS -X POST "$BASE/installer/enroll" -H 'content-type: application/json' -d "{\"code\":\"$CODE4A\",\"devicePublicId\":\"integration-device-004a\",\"deviceSecret\":\"integration-device-secret-4444444444a\",\"hostname\":\"OLD-PC\",\"terminalPath\":\"/tmp/terminal4a\"}")
          INSTANCE4=$(printf '%s' "$ENROLL4A" | jq -r '.instanceId')
          INSTALL_TOKEN4A=$(printf '%s' "$ENROLL4A" | jq -r '.installToken')

          PREP4B=$(curl -fsS -X POST "$BASE/bot/installers/windows" -H "authorization: Bearer $TOKEN4" -H 'content-type: application/json' -d "{\"slotId\":\"$SLOT4\"}")
          CODE4B=$(printf '%s' "$PREP4B" | jq -r '.code')
          ENROLL4B=$(curl -fsS -X POST "$BASE/installer/enroll" -H 'content-type: application/json' -d "{\"code\":\"$CODE4B\",\"devicePublicId\":\"integration-device-004b\",\"deviceSecret\":\"integration-device-secret-4444444444b\",\"hostname\":\"NEW-PC\",\"terminalPath\":\"/tmp/terminal4b\"}")
          INSTALL_TOKEN4B=$(printf '%s' "$ENROLL4B" | jq -r '.installToken')
          test "$INSTALL_TOKEN4A" != "$INSTALL_TOKEN4B"

          OLD_TOKEN_HTTP=$(curl -sS -o /tmp/old-token.json -w "%{http_code}" -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE4\",\"installToken\":\"$INSTALL_TOKEN4A\",\"state\":\"STOPPED\",\"metrics\":{\"accountNumber\":\"400004\",\"eaVersion\":\"$EA_VERSION\",\"runtimeContract\":\"$RUNTIME_CONTRACT\",\"server\":\"SCENOVA-Demo4\",\"positions\":0}}")
          test "$OLD_TOKEN_HTTP" = "401"

          NEW_TOKEN_HB=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE4\",\"installToken\":\"$INSTALL_TOKEN4B\",\"state\":\"STOPPED\",\"metrics\":{\"accountNumber\":\"400004\",\"broker\":\"SCENOVA\",\"eaVersion\":\"$EA_VERSION\",\"runtimeContract\":\"$RUNTIME_CONTRACT\",\"server\":\"SCENOVA-Demo4\",\"positions\":0}}")
          test "$(printf '%s' "$NEW_TOKEN_HB" | jq -r '.accountMismatch // false')" = "false"

          DUP_MT5_HTTP=$(curl -sS -o /tmp/duplicate-mt5.json -w "%{http_code}" -X POST "$BASE/bot/mt5" -H "authorization: Bearer $TOKEN2" -H 'content-type: application/json' -d '{"accountNumber":"200002","broker":"SCENOVA","brokerServer":"SCENOVA-Real","mode":"CLOUD"}')
          test "$DUP_MT5_HTTP" = "409"

          ACTIVE_IDENTITY_COUNT=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select count(*) from mt5_accounts where lower(account_number)='200002' and lower(broker_server)='scenova-real' and status='ACTIVE';")
          test "$ACTIVE_IDENTITY_COUNT" = "1"

      - name: Show API log on failure
        if: failure()
        run: cat /tmp/scenova-api.log || true
