name: Integration Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-db-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bot -d bot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Apply database migrations twice
        env:
          PGPASSWORD: bot
        run: |
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/001_init.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/002_slots_devices.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/002_slots_devices.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/003_unique_mt5_identity.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/003_unique_mt5_identity.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/004_mt5_change_request.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/004_mt5_change_request.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/005_gold_spread_default.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/005_gold_spread_default.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/006_adaptive_engine.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/006_adaptive_engine.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/007_adaptive_spread.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/007_adaptive_spread.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/008_market_open_adaptive.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/008_market_open_adaptive.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/010_trade_journal.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/010_trade_journal.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/011_basket_intelligence.sql
          psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -f database/011_basket_intelligence.sql

      - name: Build API
        run: npm run build -w @bot/api

      - name: Start API
        env:
          DATABASE_URL: postgresql://bot:bot@localhost:5432/bot
          JWT_SECRET: integration-jwt-secret
          ADMIN_KEY: integration-admin
          CREDENTIAL_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          EA_ARTIFACT_PATH: /tmp/FastBasketBot.ex5
          PUBLIC_API_BASE: http://127.0.0.1:4000
          PUBLIC_WEB_BASE: http://127.0.0.1:3000
          PORT: 4000
        run: |
          printf 'integration-ea-artifact' > /tmp/FastBasketBot.ex5
          export SCENOVA_EA_VERSION="$(sed -n 's/^#property version[[:space:]]*"\([^"]*\)"/\1/p' mt5/FastBasketBot.mq5)"
          test -n "$SCENOVA_EA_VERSION"
          node apps/api/dist/main.js > /tmp/scenova-api.log 2>&1 &
          echo $! > /tmp/scenova-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/scenova-api.log
          exit 1

      - name: Exercise signup device enrollment MT5 rebind Trial and Start
        env:
          BASE: http://127.0.0.1:4000/api
        run: |
          set -euo pipefail

          PRODUCT_VERSION=$(sed -n 's/^#define SCENOVA_PRODUCT_VERSION "\([^"]*\)"/\1/p' mt5/FastBasketBot.mq5)
          INSTALLER_VERSION=$(sed -n 's/^export const DEFAULT_INSTALLER_VERSION = "\([^"]*\)";/\1/p' apps/api/src/release-version.ts)
          SOURCE_EA_VERSION=$(sed -n 's/^#property version[[:space:]]*"\([^"]*\)"/\1/p' mt5/FastBasketBot.mq5)
          API_EA_VERSION=$(sed -n 's/^export const DEFAULT_EA_VERSION = "\([^"]*\)";/\1/p' apps/api/src/release-version.ts)
          MANIFEST_EA_VERSION=$(jq -r '.eaVersion // empty' mt5/release/manifest.json)
          EA_VERSION="$SOURCE_EA_VERSION"
          test -n "$PRODUCT_VERSION"
          test -n "$INSTALLER_VERSION"
          test -n "$SOURCE_EA_VERSION"
          test -n "$MANIFEST_EA_VERSION"
          test -n "$EA_VERSION"
          # Windows Agent/Installer and EA are independently versioned. Agent
          # fixes must not force an EX5 rebuild when EA trading logic is unchanged.
          test "$SOURCE_EA_VERSION" = "$API_EA_VERSION"

          REGISTER=$(curl -fsS -X POST "$BASE/auth/register" -H 'content-type: application/json' -d '{"email":"integration@scenova.test","password":"Integration123!"}')
          TOKEN=$(printf '%s' "$REGISTER" | jq -r '.token')
          test -n "$TOKEN"

          DASH=$(curl -fsS "$BASE/bot/dashboard" -H "authorization: Bearer $TOKEN")
          USER1_ID=$(printf '%s' "$DASH" | jq -r '.user.id')
          SLOT=$(printf '%s' "$DASH" | jq -r '.selectedSlot.id')
          test -n "$USER1_ID"
          test -n "$SLOT"
          test "$(printf '%s' "$DASH" | jq -r '.account')" = "null"

          PREP=$(curl -fsS -X POST "$BASE/bot/installers/windows" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "{\"slotId\":\"$SLOT\"}")
          CODE=$(printf '%s' "$PREP" | jq -r '.code')
          test -n "$CODE"

          ENROLL=$(curl -fsS -X POST "$BASE/installer/enroll" -H 'content-type: application/json' -d "{\"code\":\"$CODE\",\"devicePublicId\":\"integration-device-001\",\"deviceSecret\":\"integration-device-secret-1234567890\",\"hostname\":\"CI-PC\",\"terminalPath\":\"/tmp/terminal\"}")
          INSTANCE=$(printf '%s' "$ENROLL" | jq -r '.instanceId')
          INSTALL_TOKEN=$(printf '%s' "$ENROLL" | jq -r '.installToken')
          test -n "$INSTANCE"
          test -n "$INSTALL_TOKEN"

          echo "[integration] authenticated reinstall accepts an old consumed installer code"
          PGPASSWORD=bot psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -c "update install_enrollments set used_at=now()-interval '2 days',expires_at=now()-interval '1 day' where slot_id='$SLOT' and status='USED';" >/dev/null
          REINSTALL=$(curl -fsS -X POST "$BASE/installer/enroll" -H 'content-type: application/json' -d "{\"code\":\"$CODE\",\"devicePublicId\":\"integration-device-001-retry\",\"deviceSecret\":\"integration-device-secret-1234567890\",\"hostname\":\"CI-PC\",\"terminalPath\":\"/tmp/terminal\",\"legacyInstanceId\":\"$INSTANCE\",\"legacyInstallToken\":\"$INSTALL_TOKEN\"}")
          test "$(printf '%s' "$REINSTALL" | jq -r '.authenticatedReinstall')" = "true"
          test "$(printf '%s' "$REINSTALL" | jq -r '.installToken')" = "$INSTALL_TOKEN"

          EA_HASH=$(sha256sum /tmp/FastBasketBot.ex5 | awk '{print $1}')
          AGENT=$(curl -fsS -X POST "$BASE/ea/agent-heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"agentVersion\":\"2.0.9\",\"terminalPath\":\"/tmp/terminal\",\"eaHash\":\"$EA_HASH\",\"hostname\":\"CI-PC\",\"devicePublicId\":\"integration-device-001\",\"deviceSecret\":\"integration-device-secret-1234567890\"}")
          test "$(printf '%s' "$AGENT" | jq -r '.deviceVerified')" = "true"

          echo "[integration] auto-binding first LOCAL MT5 from EA runtime"
          DETECT=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"STOPPED\",\"metrics\":{\"accountNumber\":\"100001\",\"broker\":\"SCENOVA\",\"eaVersion\":\"$EA_VERSION\",\"productVersion\":\"2.0.8\",\"server\":\"SCENOVA-Demo\",\"positions\":0}}")
          test "$(printf '%s' "$DETECT" | jq -r '.accountMismatch // false')" = "false"

          DASH2=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          ACCOUNT_ID=$(printf '%s' "$DASH2" | jq -r '.account.id')
          test -n "$ACCOUNT_ID"
          test "$(printf '%s' "$DASH2" | jq -r '.account.account_number')" = "100001"
          test "$(printf '%s' "$DASH2" | jq -r '.account.broker_server')" = "SCENOVA-Demo"
          test "$(printf '%s' "$DASH2" | jq -r '.instance.pending_account_number // empty')" = ""
          test "$(printf '%s' "$DASH2" | jq -r '.instance.metrics.productVersion')" = "2.0.8"

          echo "[integration] saving bot settings with Basket profit mode"
          SETTINGS_HTTP=$(curl -sS -o /tmp/settings-save.json -w "%{http_code}" -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"symbol":"XAUUSDm","lot":0.02,"maxPositions":7,"basketTriggerMoney":3.5,"basketTrailMoney":0.75,"maxBasketLossMoney":12,"dailyLossMoney":30,"dailyProfitTargetMoney":10,"dailyProfitContinueAfterTarget":true,"dailyProfitDrawdownPercent":20,"basketProfitTargetMoney":10,"perPositionProfitMoney":0,"perPositionLossMoney":2,"manualStopLossPoints":900,"minOrderIntervalMs":450,"maxOrdersPerMinute":90,"entryMode":"BUY_ONLY","allowMinimumLotOverride":true}')
          if [ "$SETTINGS_HTTP" != "200" ]; then cat /tmp/settings-save.json; exit 1; fi
          SETTINGS=$(cat /tmp/settings-save.json)
          test "$(printf '%s' "$SETTINGS" | jq -r '.settings.symbol')" = "XAUUSDm"
          test "$(printf '%s' "$SETTINGS" | jq -r '.settings.lot')" = "0.02"
          test "$(printf '%s' "$SETTINGS" | jq -r '.settings.maxPositions')" = "7"
          test "$(printf '%s' "$SETTINGS" | jq -r '.settings.dailyProfitTargetMoney')" = "10"
          test "$(printf '%s' "$SETTINGS" | jq -r '.settings.dailyProfitContinueAfterTarget')" = "true"
          test "$(printf '%s' "$SETTINGS" | jq -r '.settings.dailyProfitDrawdownPercent')" = "20"
          test "$(printf '%s' "$SETTINGS" | jq -r '.settings.basketProfitTargetMoney')" = "10"
          test "$(printf '%s' "$SETTINGS" | jq -r '.settings.perPositionProfitMoney')" = "0"
          test "$(printf '%s' "$SETTINGS" | jq -r '.settings.perPositionLossMoney')" = "0"
          test "$(printf '%s' "$SETTINGS" | jq -r '.settings.manualStopLossPoints')" = "900"
          test "$(printf '%s' "$SETTINGS" | jq -r '.settings.entryMode')" = "BUY_ONLY"
          test "$(printf '%s' "$SETTINGS" | jq -r '.settings.allowMinimumLotOverride')" = "true"

          echo "[integration] verifying unified Adaptive Engine"
          UNIFIED_ENGINE=$(curl -fsS -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"maxPositions":7}')
          test "$(printf '%s' "$UNIFIED_ENGINE" | jq -r '.settings.tradingProfile // empty')" = ""
          test "$(printf '%s' "$UNIFIED_ENGINE" | jq -r '.settings.adaptiveEngine')" = "true"
          test "$(printf '%s' "$UNIFIED_ENGINE" | jq -r '.settings.maxPositions')" = "7"
          test "$(printf '%s' "$UNIFIED_ENGINE" | jq -r '.settings.minOrderIntervalMs')" = "300"
          test "$(printf '%s' "$UNIFIED_ENGINE" | jq -r '.settings.maxOrdersPerMinute')" = "120"
          test "$(printf '%s' "$UNIFIED_ENGINE" | jq -r '.settings.allowMinimumLotOverride')" = "true"
          test "$(printf '%s' "$UNIFIED_ENGINE" | jq -r '.settings.sessionStartHour')" = "0"
          test "$(printf '%s' "$UNIFIED_ENGINE" | jq -r '.settings.sessionEndHour')" = "24"
          test "$(printf '%s' "$UNIFIED_ENGINE" | jq -r '.settings.confidenceGateEnabled // false')" = "false"

          echo "[integration] optional Confidence gate can be enabled and disabled"
          CONF_ON=$(curl -fsS -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"confidenceGateEnabled":true}')
          test "$(printf '%s' "$CONF_ON" | jq -r '.settings.confidenceGateEnabled')" = "true"
          CONF_PRESERVE=$(curl -fsS -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"maxPositions":7}')
          test "$(printf '%s' "$CONF_PRESERVE" | jq -r '.settings.confidenceGateEnabled')" = "true"
          CONF_OFF=$(curl -fsS -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"confidenceGateEnabled":false}')
          test "$(printf '%s' "$CONF_OFF" | jq -r '.settings.confidenceGateEnabled')" = "false"

          echo "[integration] enabling per-position profit automatically disables Basket profit"
          PER_POSITION=$(curl -fsS -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"perPositionProfitMoney":2}')
          test "$(printf '%s' "$PER_POSITION" | jq -r '.settings.perPositionProfitMoney')" = "2"
          test "$(printf '%s' "$PER_POSITION" | jq -r '.settings.basketProfitTargetMoney')" = "0"

          echo "[integration] enabling Basket profit automatically disables per-position profit"
          BASKET_MODE=$(curl -fsS -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"basketProfitTargetMoney":10}')
          test "$(printf '%s' "$BASKET_MODE" | jq -r '.settings.basketProfitTargetMoney')" = "10"
          test "$(printf '%s' "$BASKET_MODE" | jq -r '.settings.perPositionProfitMoney')" = "0"
          echo "[integration] Basket target run-on preserves target and daily profit target"
          PROFIT_RUN=$(curl -fsS -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"profitRunTrailPercent":20}')
          test "$(printf '%s' "$PROFIT_RUN" | jq -r '.settings.profitRunTrailPercent')" = "20"
          test "$(printf '%s' "$PROFIT_RUN" | jq -r '.settings.dailyProfitTargetMoney')" = "10"
          test "$(printf '%s' "$PROFIT_RUN" | jq -r '.settings.dailyProfitContinueAfterTarget')" = "true"
          test "$(printf '%s' "$PROFIT_RUN" | jq -r '.settings.dailyProfitDrawdownPercent')" = "20"
          test "$(printf '%s' "$PROFIT_RUN" | jq -r '.settings.basketProfitTargetMoney')" = "10"
          test "$(printf '%s' "$PROFIT_RUN" | jq -r '.settings.perPositionProfitMoney')" = "0"
          test "$(printf '%s' "$PROFIT_RUN" | jq -r '.settings.basketTriggerMoney')" = "0"
          test "$(printf '%s' "$PROFIT_RUN" | jq -r '.settings.basketTrailMoney')" = "0"
          test "$(printf '%s' "$PROFIT_RUN" | jq -r '.settings.perPositionLossMoney')" = "0"
          test "$(printf '%s' "$PROFIT_RUN" | jq -r '.settings.manualStopLossPoints')" = "900"
          test "$(printf '%s' "$PROFIT_RUN" | jq -r '.settings.maxBasketLossMoney')" = "12"


          echo "[integration] verifying settings in dashboard"
          SETTINGS_DASH=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$SETTINGS_DASH" | jq -r '.settings.lot')" = "0.02"
          test "$(printf '%s' "$SETTINGS_DASH" | jq -r '.settings.maxPositions')" = "7"
          test "$(printf '%s' "$SETTINGS_DASH" | jq -r '.settings.dailyProfitTargetMoney')" = "10"
          test "$(printf '%s' "$SETTINGS_DASH" | jq -r '.settings.dailyProfitContinueAfterTarget')" = "true"
          test "$(printf '%s' "$SETTINGS_DASH" | jq -r '.settings.dailyProfitDrawdownPercent')" = "20"
          test "$(printf '%s' "$SETTINGS_DASH" | jq -r '.settings.basketProfitTargetMoney')" = "10"
          test "$(printf '%s' "$SETTINGS_DASH" | jq -r '.settings.perPositionProfitMoney')" = "0"
          test "$(printf '%s' "$SETTINGS_DASH" | jq -r '.settings.profitRunTrailPercent')" = "20"
          test "$(printf '%s' "$SETTINGS_DASH" | jq -r '.settings.perPositionLossMoney')" = "0"
          test "$(printf '%s' "$SETTINGS_DASH" | jq -r '.settings.manualStopLossPoints')" = "900"
          test "$(printf '%s' "$SETTINGS_DASH" | jq -r '.settings.entryMode')" = "BUY_ONLY"
          test "$(printf '%s' "$SETTINGS_DASH" | jq -r '.settings.allowMinimumLotOverride')" = "true"

          echo "[integration] verifying settings in EA heartbeat"
          SETTINGS_HB=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"STOPPED\",\"metrics\":{\"accountNumber\":\"100001\",\"eaVersion\":\"$EA_VERSION\",\"symbol\":\"XAUUSDm\",\"server\":\"SCENOVA-Demo\",\"positions\":0}}")
          test "$(printf '%s' "$SETTINGS_HB" | jq -r '.settings.lot')" = "0.02"
          test "$(printf '%s' "$SETTINGS_HB" | jq -r '.settings.maxPositions')" = "7"
          test "$(printf '%s' "$SETTINGS_HB" | jq -r '.settings.dailyProfitTargetMoney')" = "10"
          test "$(printf '%s' "$SETTINGS_HB" | jq -r '.settings.dailyProfitContinueAfterTarget')" = "true"
          test "$(printf '%s' "$SETTINGS_HB" | jq -r '.settings.dailyProfitDrawdownPercent')" = "20"
          test "$(printf '%s' "$SETTINGS_HB" | jq -r '.settings.basketProfitTargetMoney')" = "10"
          test "$(printf '%s' "$SETTINGS_HB" | jq -r '.settings.perPositionProfitMoney')" = "0"
          test "$(printf '%s' "$SETTINGS_HB" | jq -r '.settings.profitRunTrailPercent')" = "20"
          test "$(printf '%s' "$SETTINGS_HB" | jq -r '.settings.perPositionLossMoney')" = "0"
          test "$(printf '%s' "$SETTINGS_HB" | jq -r '.settings.manualStopLossPoints')" = "900"
          test "$(printf '%s' "$SETTINGS_HB" | jq -r '.settings.entryMode')" = "BUY_ONLY"
          test "$(printf '%s' "$SETTINGS_HB" | jq -r '.settings.allowMinimumLotOverride')" = "true"

          echo "[integration] verifying invalid settings rejection"
          BAD_SETTINGS_HTTP=$(curl -sS -o /tmp/bad-settings.json -w "%{http_code}" -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"lot":0}')
          test "$BAD_SETTINGS_HTTP" = "400"
          BAD_POSITION_LOSS_HTTP=$(curl -sS -o /tmp/bad-position-loss.json -w "%{http_code}" -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"perPositionLossMoney":-1}')
          test "$BAD_POSITION_LOSS_HTTP" = "400"
          BAD_MANUAL_SL_HTTP=$(curl -sS -o /tmp/bad-manual-sl.json -w "%{http_code}" -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"manualStopLossPoints":-1}')
          test "$BAD_MANUAL_SL_HTTP" = "400"
          BAD_PERCENT_HTTP=$(curl -sS -o /tmp/bad-profit-percent.json -w "%{http_code}" -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"profitRunTrailPercent":96}')
          test "$BAD_PERCENT_HTTP" = "400"
          BAD_DAILY_DRAWDOWN_HTTP=$(curl -sS -o /tmp/bad-daily-drawdown.json -w "%{http_code}" -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"dailyProfitDrawdownPercent":96}')
          test "$BAD_DAILY_DRAWDOWN_HTTP" = "400"
          BAD_DAILY_CONTINUE_HTTP=$(curl -sS -o /tmp/bad-daily-continue.json -w "%{http_code}" -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"dailyProfitContinueAfterTarget":"true"}')
          test "$BAD_DAILY_CONTINUE_HTTP" = "400"
          BAD_MIN_LOT_OVERRIDE_HTTP=$(curl -sS -o /tmp/bad-min-lot-override.json -w "%{http_code}" -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"allowMinimumLotOverride":"true"}')
          BAD_CONFIDENCE_GATE_HTTP=$(curl -sS -o /tmp/bad-confidence-gate.json -w "%{http_code}" -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"confidenceGateEnabled":"true"}')
          test "$BAD_CONFIDENCE_GATE_HTTP" = "400"
          LEGACY_PROFILE_HTTP=$(curl -sS -o /tmp/legacy-profile.json -w "%{http_code}" -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"tradingProfile":"UNKNOWN"}')
          test "$LEGACY_PROFILE_HTTP" = "200"
          test "$(jq -r '.settings.tradingProfile // empty' /tmp/legacy-profile.json)" = ""
          test "$BAD_MIN_LOT_OVERRIDE_HTTP" = "400"
          CONFLICT_PROFIT_HTTP=$(curl -sS -o /tmp/conflict-profit.json -w "%{http_code}" -X PUT "$BASE/bot/settings?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"basketProfitTargetMoney":10,"perPositionProfitMoney":2}')
          test "$CONFLICT_PROFIT_HTTP" = "400"

          echo "[integration] requesting trial after settings"
          curl -fsS -X POST "$BASE/bot/trial-request?slotId=$SLOT" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"lineContact":"@integration-line"}' >/tmp/trial-request.json

          curl -fsS -X POST "$BASE/admin/trials/grant" -H 'x-admin-key: integration-admin' -H 'content-type: application/json' -d "{\"mt5AccountId\":\"$ACCOUNT_ID\",\"minutes\":180,\"approvedBy\":\"CI\"}" >/tmp/trial-grant.json

          echo "[integration] exact EA runtime version mismatch blocks Start"
          OLD_RUNTIME=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"STOPPED\",\"metrics\":{\"accountNumber\":\"100001\",\"eaVersion\":\"1.014\",\"server\":\"SCENOVA-Demo\",\"positions\":0}}")
          RUNTIME_DASH=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$RUNTIME_DASH" | jq -r '.softwareUpdate.eaVersionMatch')" = "false"
          OLD_RUNTIME_START_HTTP=$(curl -sS -o /tmp/outdated-ea-start.json -w "%{http_code}" -X POST "$BASE/bot/start?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$OLD_RUNTIME_START_HTTP" = "409"

          CURRENT_RUNTIME=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"STOPPED\",\"metrics\":{\"accountNumber\":\"100001\",\"eaVersion\":\"$EA_VERSION\",\"server\":\"SCENOVA-Demo\",\"positions\":0}}")
          CURRENT_RUNTIME_DASH=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$CURRENT_RUNTIME_DASH" | jq -r '.softwareUpdate.eaVersionMatch')" = "true"

          echo "[integration] mandatory installer update blocks Start"
          OLD_AGENT=$(curl -fsS -X POST "$BASE/ea/agent-heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"agentVersion\":\"2.0.4\",\"terminalPath\":\"/tmp/terminal\",\"eaHash\":\"$EA_HASH\",\"hostname\":\"CI-PC\",\"devicePublicId\":\"integration-device-001\",\"deviceSecret\":\"integration-device-secret-1234567890\"}")
          test "$(printf '%s' "$OLD_AGENT" | jq -r '.agentUpdateRequired')" = "true"
          test "$(printf '%s' "$OLD_AGENT" | jq -r '.agentVersionRequired')" = "2.0.9"

          UPDATE_DASH=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$UPDATE_DASH" | jq -r '.softwareUpdate.required')" = "true"
          test "$(printf '%s' "$UPDATE_DASH" | jq -r '.softwareUpdate.currentVersion')" = "2.0.4"
          test "$(printf '%s' "$UPDATE_DASH" | jq -r '.softwareUpdate.latestVersion')" = "2.0.9"

          OUTDATED_START_HTTP=$(curl -sS -o /tmp/outdated-installer-start.json -w "%{http_code}" -X POST "$BASE/bot/start?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$OUTDATED_START_HTTP" = "409"

          CURRENT_AGENT=$(curl -fsS -X POST "$BASE/ea/agent-heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"agentVersion\":\"2.0.9\",\"terminalPath\":\"/tmp/terminal\",\"eaHash\":\"$EA_HASH\",\"hostname\":\"CI-PC\",\"devicePublicId\":\"integration-device-001\",\"deviceSecret\":\"integration-device-secret-1234567890\"}")
          test "$(printf '%s' "$CURRENT_AGENT" | jq -r '.agentUpdateRequired')" = "false"

          UPDATED_DASH=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$UPDATED_DASH" | jq -r '.softwareUpdate.required')" = "false"
          test "$(printf '%s' "$UPDATED_DASH" | jq -r '.softwareUpdate.eaVersionMatch')" = "true"
          test "$(printf '%s' "$UPDATED_DASH" | jq -r '.softwareUpdate.eaHashMatch')" = "true"

          echo "[integration] exact EX5 hash is a mandatory Start gate"
          PGPASSWORD=bot psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -c "update bot_instances set agent_ea_hash=NULL where id='$INSTANCE';" >/dev/null
          HASHLESS_START_HTTP=$(curl -sS -o /tmp/hashless-start.json -w "%{http_code}" -X POST "$BASE/bot/start?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$HASHLESS_START_HTTP" = "409"

          HASH_REFRESH=$(curl -fsS -X POST "$BASE/ea/agent-heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"agentVersion\":\"2.0.9\",\"terminalPath\":\"/tmp/terminal\",\"eaHash\":\"$EA_HASH\",\"hostname\":\"CI-PC\",\"devicePublicId\":\"integration-device-001\",\"deviceSecret\":\"integration-device-secret-1234567890\"}")
          test "$(printf '%s' "$HASH_REFRESH" | jq -r '.agentUpdateRequired')" = "false"

          START=$(curl -fsS -X POST "$BASE/bot/start?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$START" | jq -r '.state')" = "RUNNING"

          HB=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"RUNNING\",\"metrics\":{\"accountNumber\":\"100001\",\"eaVersion\":\"$EA_VERSION\",\"server\":\"SCENOVA-Demo\",\"positions\":0}}")
          test "$(printf '%s' "$HB" | jq -r '.access')" = "true"

          echo "[integration] trade journal records entries/exits and one Basket result"
          curl -fsS -X POST "$BASE/ea/journal" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"dealTicket\":\"900001\",\"positionId\":\"700001\",\"eventType\":\"ENTRY\",\"direction\":\"BUY\",\"volume\":0.01,\"price\":4400.25,\"entryTrigger\":\"OB_FIB_PULLBACK\",\"entryModel\":\"OB_FIB_PULLBACK\",\"entryQuality\":\"A\",\"entryQualityScore\":87,\"marketRegime\":\"TREND_UP\",\"marketRegimeDetail\":\"TREND_PULLBACK\",\"fibSetupScore\":91,\"orderBlockQuality\":84,\"confidence\":51,\"basketIndex\":1}" >/dev/null
          curl -fsS -X POST "$BASE/ea/journal" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"dealTicket\":\"900002\",\"positionId\":\"700001\",\"eventType\":\"EXIT\",\"direction\":\"BUY\",\"volume\":0.01,\"price\":4412.50,\"netProfit\":12.50,\"entryTrigger\":\"OB_FIB_PULLBACK\",\"entryModel\":\"OB_FIB_PULLBACK\",\"entryQuality\":\"A\",\"entryQualityScore\":87,\"marketRegime\":\"TREND_UP\",\"marketRegimeDetail\":\"TREND_CONTINUATION\",\"fibSetupScore\":91,\"orderBlockQuality\":84,\"confidence\":51,\"basketIndex\":1}" >/dev/null
          curl -fsS -X POST "$BASE/ea/journal" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"dealTicket\":\"900001\",\"eventType\":\"BASKET\",\"direction\":\"BUY\",\"volume\":0.01,\"netProfit\":12.50,\"entryTrigger\":\"OB_FIB_PULLBACK\",\"entryModel\":\"OB_FIB_PULLBACK\",\"entryQuality\":\"A\",\"entryQualityScore\":87,\"marketRegime\":\"TREND_UP\",\"marketRegimeDetail\":\"TREND_PULLBACK\",\"fibSetupScore\":91,\"orderBlockQuality\":84,\"confidence\":51,\"basketIndex\":1,\"symbol\":\"XAUUSDm\",\"brokerServer\":\"SCENOVA-Demo\",\"startedAt\":100,\"endedAt\":200,\"peakPositions\":1,\"sessionProfile\":\"LONDON\"}" >/dev/null
          JOURNAL_DASH=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$JOURNAL_DASH" | jq -r '.tradeJournal.stats.closedTrades')" = "1"
          test "$(printf '%s' "$JOURNAL_DASH" | jq -r '.tradeJournal.stats.wins')" = "1"
          test "$(printf '%s' "$JOURNAL_DASH" | jq -r '.tradeJournal.stats.netProfit')" = "12.5"
          test "$(printf '%s' "$JOURNAL_DASH" | jq -r '.tradeJournal.recent | length')" = "3"
          JOURNAL_HB=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"STOPPED\",\"metrics\":{\"accountNumber\":\"100001\",\"eaVersion\":\"$EA_VERSION\",\"symbol\":\"XAUUSDm\",\"server\":\"SCENOVA-Demo\",\"positions\":0}}")
          test "$(printf '%s' "$JOURNAL_HB" | jq -r '.buyWinProbability')" = "100"
          test "$(printf '%s' "$JOURNAL_HB" | jq -r '.buyWinSamples')" = "1"

          echo "[integration] entitlement expiry forces SAFE_STOP on the next heartbeat"
          PGPASSWORD=bot psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -c "update trial_grants set expires_at=now()-interval '1 second' where mt5_account_id='$ACCOUNT_ID';" >/dev/null
          EXPIRED_HB=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"RUNNING\",\"metrics\":{\"accountNumber\":\"100001\",\"eaVersion\":\"$EA_VERSION\",\"server\":\"SCENOVA-Demo\",\"positions\":0}}")
          test "$(printf '%s' "$EXPIRED_HB" | jq -r '.access')" = "false"
          test "$(printf '%s' "$EXPIRED_HB" | jq -r '.desiredState')" = "SAFE_STOP"

          curl -fsS -X POST "$BASE/bot/stop?slotId=$SLOT" -H "authorization: Bearer $TOKEN" >/dev/null

          echo "[integration] account change is blocked while old MT5 has open positions"
          OLD_WITH_POS=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"SAFE_STOP\",\"metrics\":{\"accountNumber\":\"100001\",\"eaVersion\":\"$EA_VERSION\",\"server\":\"SCENOVA-Demo\",\"positions\":2}}")
          DETECT_REAL_BLOCKED=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"SAFE_STOP\",\"metrics\":{\"accountNumber\":\"200002\",\"eaVersion\":\"$EA_VERSION\",\"server\":\"SCENOVA-Real\",\"positions\":0}}")
          test "$(printf '%s' "$DETECT_REAL_BLOCKED" | jq -r '.accountMismatch')" = "true"
          test "$(printf '%s' "$DETECT_REAL_BLOCKED" | jq -r '.previousBoundPositions')" = "2"
          test "$(printf '%s' "$DETECT_REAL_BLOCKED" | jq -r '.accountChangeBlocked')" = "true"
          REBIND_BLOCKED_HTTP=$(curl -sS -o /tmp/rebind-open-positions.json -w "%{http_code}" -X POST "$BASE/bot/mt5/rebind?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$REBIND_BLOCKED_HTTP" = "409"

          echo "[integration] rebind succeeds after old MT5 reports flat"
          OLD_FLAT=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"SAFE_STOP\",\"metrics\":{\"accountNumber\":\"100001\",\"eaVersion\":\"$EA_VERSION\",\"server\":\"SCENOVA-Demo\",\"positions\":0}}")
          DETECT_REAL=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE\",\"installToken\":\"$INSTALL_TOKEN\",\"state\":\"SAFE_STOP\",\"metrics\":{\"accountNumber\":\"200002\",\"eaVersion\":\"$EA_VERSION\",\"server\":\"SCENOVA-Real\",\"positions\":0}}")
          test "$(printf '%s' "$DETECT_REAL" | jq -r '.accountMismatch')" = "true"
          test "$(printf '%s' "$DETECT_REAL" | jq -r '.previousBoundPositions')" = "0"

          REBIND_REAL=$(curl -fsS -X POST "$BASE/bot/mt5/rebind?slotId=$SLOT" -H "authorization: Bearer $TOKEN")
          test "$(printf '%s' "$REBIND_REAL" | jq -r '.account.account_number')" = "200002"

          TRIAL_COUNT=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select count(*) from trial_grants where user_id=(select id from users where email='integration@scenova.test');")
          test "$TRIAL_COUNT" = "1"
          OLD_TRIAL=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select count(*) from trial_grants where account_number='100001';")
          test "$OLD_TRIAL" = "1"


          # Device identity is telemetry only; active MT5 identity remains unique.
          REGISTER2=$(curl -fsS -X POST "$BASE/auth/register" -H 'content-type: application/json' -d '{"email":"integration2@scenova.test","password":"Integration123!"}')
          TOKEN2=$(printf '%s' "$REGISTER2" | jq -r '.token')
          DASH_SECOND=$(curl -fsS "$BASE/bot/dashboard" -H "authorization: Bearer $TOKEN2")
          USER2_ID=$(printf '%s' "$DASH_SECOND" | jq -r '.user.id')
          SLOT_SECOND=$(printf '%s' "$DASH_SECOND" | jq -r '.selectedSlot.id')
          test -n "$USER2_ID"

          PREP_SECOND=$(curl -fsS -X POST "$BASE/bot/installers/windows" -H "authorization: Bearer $TOKEN2" -H 'content-type: application/json' -d "{\"slotId\":\"$SLOT_SECOND\"}")
          CODE_SECOND=$(printf '%s' "$PREP_SECOND" | jq -r '.code')

          ENROLL_SECOND=$(curl -fsS -X POST "$BASE/installer/enroll" -H 'content-type: application/json' -d "{\"code\":\"$CODE_SECOND\",\"devicePublicId\":\"integration-device-001\",\"deviceSecret\":\"another-device-secret-1234567890\",\"hostname\":\"CI-PC\",\"terminalPath\":\"/tmp/terminal2\"}")
          INSTANCE_SECOND=$(printf '%s' "$ENROLL_SECOND" | jq -r '.instanceId')
          INSTALL_TOKEN_SECOND=$(printf '%s' "$ENROLL_SECOND" | jq -r '.installToken')
          test -n "$INSTANCE_SECOND"
          test -n "$INSTALL_TOKEN_SECOND"

          echo "[integration] same physical PC is allowed; Server rights still decide trading"
          SECOND_HB=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE_SECOND\",\"installToken\":\"$INSTALL_TOKEN_SECOND\",\"state\":\"STOPPED\",\"metrics\":{\"accountNumber\":\"222222\",\"broker\":\"SCENOVA\",\"eaVersion\":\"$EA_VERSION\",\"server\":\"SCENOVA-Demo2\",\"positions\":0}}")
          test "$(printf '%s' "$SECOND_HB" | jq -r '.accountMismatch // false')" = "false"
          test "$(printf '%s' "$SECOND_HB" | jq -r '.access')" = "false"
          test "$(printf '%s' "$SECOND_HB" | jq -r '.desiredState')" = "SAFE_STOP"
          SECOND_DASH=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT_SECOND" -H "authorization: Bearer $TOKEN2")
          test "$(printf '%s' "$SECOND_DASH" | jq -r '.account.account_number')" = "222222"
          NO_ACCESS_START=$(curl -sS -o /tmp/no-access-start.json -w "%{http_code}" -X POST "$BASE/bot/start?slotId=$SLOT_SECOND" -H "authorization: Bearer $TOKEN2")
          test "$NO_ACCESS_START" = "409"

          echo "[integration] first MT5 bind is automatic without Device Lock"
          REGISTER3=$(curl -fsS -X POST "$BASE/auth/register" -H 'content-type: application/json' -d '{"email":"integration3@scenova.test","password":"Integration123!"}')
          TOKEN3=$(printf '%s' "$REGISTER3" | jq -r '.token')
          DASH3=$(curl -fsS "$BASE/bot/dashboard" -H "authorization: Bearer $TOKEN3")
          SLOT3=$(printf '%s' "$DASH3" | jq -r '.selectedSlot.id')

          PREP3=$(curl -fsS -X POST "$BASE/bot/installers/windows" -H "authorization: Bearer $TOKEN3" -H 'content-type: application/json' -d "{\"slotId\":\"$SLOT3\"}")
          CODE3=$(printf '%s' "$PREP3" | jq -r '.code')
          ENROLL3=$(curl -fsS -X POST "$BASE/installer/enroll" -H 'content-type: application/json' -d "{\"code\":\"$CODE3\",\"devicePublicId\":\"integration-device-003\",\"deviceSecret\":\"integration-device-secret-3333333333\",\"hostname\":\"LEGACY-PC\",\"terminalPath\":\"/tmp/terminal3\"}")
          INSTANCE3=$(printf '%s' "$ENROLL3" | jq -r '.instanceId')
          INSTALL_TOKEN3=$(printf '%s' "$ENROLL3" | jq -r '.installToken')

          # Device telemetry may be missing; authenticated EA still auto-binds MT5.
          PGPASSWORD=bot psql -h localhost -U bot -d bot -v ON_ERROR_STOP=1 -c "update bot_instances set device_status='UNREGISTERED',device_last_seen_at=NULL,device_last_ip=NULL,mt5_account_id=NULL where id='$INSTANCE3';" >/dev/null

          FIRST_DETECT=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE3\",\"installToken\":\"$INSTALL_TOKEN3\",\"state\":\"SAFE_STOP\",\"metrics\":{\"accountNumber\":\"300003\",\"broker\":\"SCENOVA\",\"eaVersion\":\"$EA_VERSION\",\"server\":\"SCENOVA-Legacy\",\"positions\":0}}")
          test "$(printf '%s' "$FIRST_DETECT" | jq -r '.accountMismatch // false')" = "false"

          FIRST_DASH=$(curl -fsS "$BASE/bot/dashboard?slotId=$SLOT3" -H "authorization: Bearer $TOKEN3")
          test "$(printf '%s' "$FIRST_DASH" | jq -r '.account.account_number')" = "300003"

          echo "[integration] reinstalling the same Slot revokes the old EA token"
          REGISTER4=$(curl -fsS -X POST "$BASE/auth/register" -H 'content-type: application/json' -d '{"email":"integration4@scenova.test","password":"Integration123!"}')
          TOKEN4=$(printf '%s' "$REGISTER4" | jq -r '.token')
          DASH4=$(curl -fsS "$BASE/bot/dashboard" -H "authorization: Bearer $TOKEN4")
          SLOT4=$(printf '%s' "$DASH4" | jq -r '.selectedSlot.id')

          PREP4A=$(curl -fsS -X POST "$BASE/bot/installers/windows" -H "authorization: Bearer $TOKEN4" -H 'content-type: application/json' -d "{\"slotId\":\"$SLOT4\"}")
          CODE4A=$(printf '%s' "$PREP4A" | jq -r '.code')
          ENROLL4A=$(curl -fsS -X POST "$BASE/installer/enroll" -H 'content-type: application/json' -d "{\"code\":\"$CODE4A\",\"devicePublicId\":\"integration-device-004a\",\"deviceSecret\":\"integration-device-secret-4444444444a\",\"hostname\":\"OLD-PC\",\"terminalPath\":\"/tmp/terminal4a\"}")
          INSTANCE4=$(printf '%s' "$ENROLL4A" | jq -r '.instanceId')
          INSTALL_TOKEN4A=$(printf '%s' "$ENROLL4A" | jq -r '.installToken')

          PREP4B=$(curl -fsS -X POST "$BASE/bot/installers/windows" -H "authorization: Bearer $TOKEN4" -H 'content-type: application/json' -d "{\"slotId\":\"$SLOT4\"}")
          CODE4B=$(printf '%s' "$PREP4B" | jq -r '.code')
          ENROLL4B=$(curl -fsS -X POST "$BASE/installer/enroll" -H 'content-type: application/json' -d "{\"code\":\"$CODE4B\",\"devicePublicId\":\"integration-device-004b\",\"deviceSecret\":\"integration-device-secret-4444444444b\",\"hostname\":\"NEW-PC\",\"terminalPath\":\"/tmp/terminal4b\"}")
          INSTALL_TOKEN4B=$(printf '%s' "$ENROLL4B" | jq -r '.installToken')
          test "$INSTALL_TOKEN4A" != "$INSTALL_TOKEN4B"

          OLD_TOKEN_HTTP=$(curl -sS -o /tmp/old-token.json -w "%{http_code}" -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE4\",\"installToken\":\"$INSTALL_TOKEN4A\",\"state\":\"STOPPED\",\"metrics\":{\"accountNumber\":\"400004\",\"eaVersion\":\"$EA_VERSION\",\"server\":\"SCENOVA-Demo4\",\"positions\":0}}")
          test "$OLD_TOKEN_HTTP" = "401"

          NEW_TOKEN_HB=$(curl -fsS -X POST "$BASE/ea/heartbeat" -H 'content-type: application/json' -d "{\"instanceId\":\"$INSTANCE4\",\"installToken\":\"$INSTALL_TOKEN4B\",\"state\":\"STOPPED\",\"metrics\":{\"accountNumber\":\"400004\",\"broker\":\"SCENOVA\",\"eaVersion\":\"$EA_VERSION\",\"server\":\"SCENOVA-Demo4\",\"positions\":0}}")
          test "$(printf '%s' "$NEW_TOKEN_HB" | jq -r '.accountMismatch // false')" = "false"

          DUP_MT5_HTTP=$(curl -sS -o /tmp/duplicate-mt5.json -w "%{http_code}" -X POST "$BASE/bot/mt5" -H "authorization: Bearer $TOKEN2" -H 'content-type: application/json' -d '{"accountNumber":"200002","broker":"SCENOVA","brokerServer":"SCENOVA-Real","mode":"CLOUD"}')
          test "$DUP_MT5_HTTP" = "409"

          ACTIVE_IDENTITY_COUNT=$(PGPASSWORD=bot psql -h localhost -U bot -d bot -Atc "select count(*) from mt5_accounts where lower(account_number)='200002' and lower(broker_server)='scenova-real' and status='ACTIVE';")
          test "$ACTIVE_IDENTITY_COUNT" = "1"

      - name: Show API log on failure
        if: failure()
        run: cat /tmp/scenova-api.log || true
