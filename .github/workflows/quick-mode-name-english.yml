name: Quick mode name English

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/quick-mode-name-english.yml"

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Change only displayed mode names to English
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/app/dashboard/page.tsx")
          text = path.read_text(encoding="utf-8-sig")

          replacements = {
              '? "กริดสองทิศทาง" :': '? "ZERO GRID" :',
              '? "เร่งจังหวะ" :': '? "RACE" :',
              '? "กำหนดค่าเอง" :': '? "MANUAL" :',
              '? "อัตโนมัติ" :': '? "AUTO" :',
              'AUTO:{title:"โหมดอัตโนมัติ",': 'AUTO:{title:"AUTO",',
              'RACE:{title:"โหมดเร่งจังหวะ",': 'RACE:{title:"RACE",',
              'ZERO_GRID:{title:"โหมดกริดสองทิศทาง",': 'ZERO_GRID:{title:"ZERO GRID",',
              'MANUAL:{title:"โหมดกำหนดค่าเอง",': 'MANUAL:{title:"MANUAL",',
          }

          changed = text
          for old, new in replacements.items():
              changed = changed.replace(old, new)

          required = ['AUTO:{title:"AUTO",', 'RACE:{title:"RACE",', 'ZERO_GRID:{title:"ZERO GRID",', 'MANUAL:{title:"MANUAL",']
          if any(item not in changed for item in required):
              raise SystemExit("mode title replacement verification failed")
          if changed == text:
              raise SystemExit("no mode names changed")

          path.write_text(changed, encoding="utf-8")

      - name: Commit mode-name-only change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/quick-mode-name-english.yml
          git add apps/web/app/dashboard/page.tsx .github/workflows/quick-mode-name-english.yml
          git commit -m "fix: use English mode names only"
          git push origin HEAD:main
