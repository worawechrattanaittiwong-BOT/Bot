name: Apply Settings Limit UI Fix Temporary

on:
  push:
    branches:
      - fix/settings-limit-controls-ui

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'scenova-build' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settings-limit-controls-ui
          fetch-depth: 0

      - name: Apply narrow settings UI patch
        shell: python
        run: |
          from pathlib import Path

          page_path = Path('apps/web/app/dashboard/page.tsx')
          css_path = Path('apps/web/app/globals.css')
          page = page_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          replacements = [
              (
                  'payload.controlMode = ["ASSISTED", "MANUAL"].includes(requestedControlMode)\n          ? requestedControlMode\n          : "AUTO";',
                  'payload.controlMode = requestedControlMode === "MANUAL" ? "MANUAL" : "AUTO";'
              ),
              (
                  'const inferredControlMode = engineMode === "ZERO_GRID" ? "ZERO_GRID" : engineMode === "RACE" ? "RACE" : entryMode === "AUTO_MOMENTUM" ? "AUTO" : hasManualExit ? "MANUAL" : "ASSISTED";\n  const requestedControlMode = String(props.settings?.controlMode || inferredControlMode).toUpperCase();\n  const controlMode = ["AUTO","RACE","ZERO_GRID","ASSISTED","MANUAL"].includes(requestedControlMode)\n    ? requestedControlMode\n    : inferredControlMode;',
                  'const inferredControlMode = engineMode === "ZERO_GRID" ? "ZERO_GRID" : engineMode === "RACE" ? "RACE" : hasManualExit ? "MANUAL" : "AUTO";\n  const requestedControlModeRaw = String(props.settings?.controlMode || inferredControlMode).toUpperCase();\n  const requestedControlMode = requestedControlModeRaw === "ASSISTED" ? "AUTO" : requestedControlModeRaw;\n  const controlMode = ["AUTO","RACE","ZERO_GRID","MANUAL"].includes(requestedControlMode)\n    ? requestedControlMode\n    : inferredControlMode;'
              ),
              (
                  '    ZERO_GRID:{title:"ZERO GRID",subtitle:"BUY STOP + SELL STOP · เลือกได้ 10–30 Pending ต่อฝั่ง"},\n    ASSISTED:{title:"ช่วยตัดสินใจ",subtitle:"EA วิเคราะห์ BUY / SELL และเข้าไม้อัตโนมัติ คุณเลือกแนวทางบริหารรอบ"},\n    MANUAL:{title:"กำหนดเอง",subtitle:"EA วิเคราะห์ BUY / SELL และเข้าไม้อัตโนมัติ คุณกำหนด Lot เป้ากำไร และ SL"}',
                  '    ZERO_GRID:{title:"ZERO GRID",subtitle:"BUY STOP + SELL STOP · เลือกได้ 1–30 Pending Orders ต่อฝั่ง"},\n    MANUAL:{title:"กำหนดเอง",subtitle:"EA วิเคราะห์ BUY / SELL และเข้าไม้อัตโนมัติ คุณกำหนด Lot Size, Profit Target และ Stop Loss"}'
              ),
              (
                  '    if (mode === "ASSISTED") {\n      props.onEdit?.("profitTargetMode","AUTO");\n      props.onEdit?.("manualStopLossPoints",0);\n      return;\n    }\n',
                  ''
              ),
              (
                  '                {id:"ZERO_GRID",icon:"layers",tag:"Hedging Grid"},\n                {id:"ASSISTED",icon:"target",tag:"กึ่งอัตโนมัติ"},\n                {id:"MANUAL",icon:"settings",tag:"ควบคุมละเอียด"}',
                  '                {id:"ZERO_GRID",icon:"layers",tag:"Hedging Grid"},\n                {id:"MANUAL",icon:"settings",tag:"ควบคุมละเอียด"}'
              ),
              (
                  '<div className="cc-bot-v2-engine-line"><ScenovaIcon name="spark" size={16}/><b>Basket Ladder อัตโนมัติ</b><span>EA กระจายจังหวะเพิ่มไม้ตาม ATR และแรงตลาด</span></div>',
                  '<div className="cc-bot-v2-engine-line"><ScenovaIcon name="spark" size={16}/><b>Automatic Basket Ladder</b><span>EA กระจายจังหวะเพิ่มไม้ตาม ATR และแรงตลาด</span></div>'
              ),
              (
                  '<b>Setup-First 5 TF</b>',
                  '<b>5-Timeframe Setup</b>'
              ),
          ]

          for old, new in replacements:
              count = page.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one page match, found {count}: {old[:120]}')
              page = page.replace(old, new, 1)

          css_old = '.cc-bot-v2-modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}'
          css_new = '.cc-bot-v2-modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}'
          if css.count(css_old) != 1:
              raise SystemExit('Mode grid CSS anchor did not match exactly once')
          css = css.replace(css_old, css_new, 1)

          limit_old = '.cc-bot-v2-limit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cc-bot-v2-limit-grid>div{min-height:112px;padding:10px;border:1px solid #293650;border-radius:11px;background:linear-gradient(145deg,#0b1420,#070c15)}.cc-bot-v2-limit-grid>div>div:first-child{display:flex;align-items:center;gap:8px;margin-bottom:9px}'
          limit_new = '.cc-bot-v2-limit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cc-bot-v2-limit-grid>div{position:relative;min-height:112px;padding:10px;border:1px solid #293650;border-radius:11px;background:linear-gradient(145deg,#0b1420,#070c15)}.cc-bot-v2-limit-grid>div>div:first-child{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding-right:50px}'
          if css.count(limit_old) != 1:
              raise SystemExit('Limit grid CSS anchor did not match exactly once')
          css = css.replace(limit_old, limit_new, 1)

          switch_old = '.cc-bot-v2-limit-grid .toggle-select-field{gap:7px}.cc-bot-v2-limit-grid .toggle-setting-label{min-height:28px}.cc-bot-v2-limit-grid .money-input-shell{min-height:34px}'
          switch_new = '.cc-bot-v2-limit-grid .toggle-select-field{gap:7px}.cc-bot-v2-limit-grid .toggle-setting-label{position:absolute!important;top:10px!important;right:10px!important;left:auto!important;min-height:22px!important;margin:0!important;display:flex!important}.cc-bot-v2-limit-grid .money-input-shell{min-height:34px}'
          if css.count(switch_old) != 1:
              raise SystemExit('Limit switch CSS anchor did not match exactly once')
          css = css.replace(switch_old, switch_new, 1)

          responsive_old = '@media(max-width:1100px){.cc-bot-v2-workspace{grid-template-columns:1fr}'
          responsive_new = '@media(max-width:1100px){.cc-bot-v2-modes{grid-template-columns:repeat(2,minmax(0,1fr))}.cc-bot-v2-workspace{grid-template-columns:1fr}'
          if css.count(responsive_old) != 1:
              raise SystemExit('Responsive CSS anchor did not match exactly once')
          css = css.replace(responsive_old, responsive_new, 1)

          if '{id:"ASSISTED"' in page or 'title:"ช่วยตัดสินใจ"' in page:
              raise SystemExit('ASSISTED mode is still visible in settings UI')
          if 'requestedControlModeRaw === "ASSISTED" ? "AUTO"' not in page:
              raise SystemExit('Legacy ASSISTED compatibility mapping is missing')
          if 'position:absolute!important;top:10px!important;right:10px!important' not in css:
              raise SystemExit('Limit switch placement fix is missing')

          page_path.write_text(page, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-settings-limit-ui-fix-temp.yml
          git config user.name "scenova-build"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/app/dashboard/page.tsx apps/web/app/globals.css .github/workflows/apply-settings-limit-ui-fix-temp.yml
          git diff --cached --check
          git commit -m "fix: repair trade limit controls and simplify modes"
          git push origin HEAD:fix/settings-limit-controls-ui
