name: Apply Live Price Chart 15m

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade-live-price-chart-15m.ps1"
      - ".github/workflows/apply-live-price-chart-15m.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply source patch
        shell: pwsh
        run: ./scripts/upgrade-live-price-chart-15m.ps1
      - name: Verify live-price contract
        shell: pwsh
        run: ./tests/live-price-chart-15m-contract.ps1
      - name: Verify unified release version
        shell: pwsh
        run: ./tests/release-version-consistency.ps1
      - name: Typecheck and build
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Publish source patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git diff --quiet HEAD origin/main
          if ($LASTEXITCODE -eq 1) { throw "main moved during validation; rerun" }
          if ($LASTEXITCODE -ne 0) { throw "could not compare main" }
          git add apps/web/app/dashboard/page.tsx mt5/FastBasketBot.mq5 tests/live-price-chart-15m-contract.ps1
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "feat: flowing 15-minute live price chart"
          git push origin HEAD:main
