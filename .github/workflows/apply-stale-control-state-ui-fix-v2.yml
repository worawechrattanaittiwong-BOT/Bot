name: Apply Stale Control State Cleanup V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-stale-control-state-ui-fix-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply stale Control Center state cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing expected block: {label}")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one block for {label}, got {text.count(old)}")
              return text.replace(old, new, 1)

          web_path = Path('apps/web/app/dashboard/page.tsx')
          web = web_path.read_text()
          web = replace_once(
              web,
              '  const startTimedOut = startPhase === "TIMEOUT";\n',
              '  // A timeout is only an active UI state while the Server is still trying RUNNING.\n  // Once the Server has released control back to STOPPED/SAFE_STOP, do not keep an old red banner.\n  const startTimedOut = startPhase === "TIMEOUT" && desired === "RUNNING";\n',
              'start timeout display guard'
          )
          web = replace_once(
              web,
              '  const safeStopAwaitingAck =\n    desired === "SAFE_STOP" && safeStopPositionCount === 0;\n',
              '',
              'obsolete safe stop awaiting ack flag'
          )
          old_label = '''  const controlStateLabel =\n    startTimedOut\n      ? "เริ่มบอทไม่สำเร็จ — พร้อมให้ลองใหม่"\n      : desired === "RUNNING"\n        ? (state === "RUNNING" ? "บอทกำลังทำงาน" : (startPhaseLabel[startPhase] || "กำลังเริ่มบอท"))\n        : desired === "SAFE_STOP"\n          ? Number(metrics.positions || 0) > 0\n            ? `กำลังหยุดอย่างปลอดภัย — รอจัดการ ${Math.max(0, Number(metrics.positions || 0))} Position`\n            : safeStopAwaitingAck\n              ? "กำลังยืนยันการหยุดกับ EA — ไม่มี Position ค้าง · เริ่มใหม่ได้หากต้องการ"\n              : "หยุดอย่างปลอดภัยแล้ว — ไม่มี Position ค้าง"\n          : "บอทหยุดอยู่";\n'''
          new_label = '''  const controlStateLabel =\n    startTimedOut\n      ? "เริ่มบอทไม่สำเร็จ — พร้อมให้ลองใหม่"\n      : desired === "RUNNING"\n        ? (state === "RUNNING" ? "บอทกำลังทำงาน" : (startPhaseLabel[startPhase] || "กำลังเริ่มบอท"))\n        : safeStopInProgress\n          ? `กำลังหยุดอย่างปลอดภัย — รอจัดการ ${safeStopPositionCount} Position`\n          : "บอทหยุดอยู่";\n'''
          web = replace_once(web, old_label, new_label, 'control state label normalization')
          old_run_state = '''                  <div className={"cc-v6-run-state "+(state==="RUNNING"?"running":state==="SAFE_STOP"?"safe":"stopped")}>\n                    <span className="cc-state-dot"/>\n                    <div>\n                      <b>{startTimedOut?"เริ่มบอทไม่สำเร็จ":botStarting?"กำลังเริ่มบอท":state==="RUNNING"?"กำลังทำงาน":desired==="SAFE_STOP"?"กำลังหยุดอย่างปลอดภัย":state==="SAFE_STOP"?"หยุดอย่างปลอดภัย":"บอทหยุดอยู่"}</b>\n                      <small>{startTimedOut ? String(startTransition.message || startPhaseLabel.TIMEOUT) : botStarting ? (startPhaseLabel[startPhase] || controlStateLabel) : controlStateLabel} · Heartbeat {heartbeatAgeSeconds.toFixed(0)} วินาที</small>\n                    </div>\n                  </div>\n'''
          new_run_state = '''                  <div className={"cc-v6-run-state "+(state==="RUNNING"?"running":safeStopInProgress?"safe":"stopped")}>\n                    <span className="cc-state-dot"/>\n                    <div>\n                      <b>{startTimedOut?"เริ่มบอทไม่สำเร็จ":botStarting?"กำลังเริ่มบอท":state==="RUNNING"?"กำลังทำงาน":safeStopInProgress?"กำลังหยุดอย่างปลอดภัย":"บอทหยุดอยู่"}</b>\n                      <small>{startTimedOut ? String(startTransition.message || startPhaseLabel.TIMEOUT) : botStarting ? (startPhaseLabel[startPhase] || controlStateLabel) : controlStateLabel} · Heartbeat {heartbeatAgeSeconds.toFixed(0)} วินาที</small>\n                    </div>\n                  </div>\n'''
          web = replace_once(web, old_run_state, new_run_state, 'hero run state normalization')
          web_path.write_text(web)

          api_path = Path('apps/api/src/bot.controller.ts')
          api = api_path.read_text()
          anchor = '''\n    let startTransition: any = {\n      phase: "IDLE",\n'''
          recovery = '''\n    // Dashboard-side recovery for a completed Safe Stop. Heartbeat normally finalizes\n    // this transition; this fallback prevents a flat account from staying visually stuck.\n    const dashboardPositions = Number(instance?.metrics?.positions);\n    const dashboardActualState = String(instance?.actual_state || "").toUpperCase();\n    if (\n      instance &&\n      String(instance.desired_state || "").toUpperCase() === "SAFE_STOP" &&\n      Number.isFinite(dashboardPositions) &&\n      dashboardPositions <= 0 &&\n      (dashboardActualState === "SAFE_STOP" || dashboardActualState === "STOPPED")\n    ) {\n      await this.db.query(\n        "UPDATE bot_instances SET desired_state='STOPPED',lock_owner=NULL WHERE id=$1 AND desired_state='SAFE_STOP'",\n        [instance.id]\n      );\n      await this.db.query(\n        "UPDATE bot_commands SET status='ACKED',acked_at=COALESCE(acked_at,now()) WHERE bot_instance_id=$1 AND command='SAFE_STOP' AND status IN ('PENDING','DELIVERED')",\n        [instance.id]\n      );\n      instance.desired_state = "STOPPED";\n    }\n\n    let startTransition: any = {\n      phase: "IDLE",\n'''
          api = replace_once(api, anchor, recovery, 'dashboard safe stop recovery')
          api_path.write_text(api)

          test_path = Path('tests/production-hardening-phase4-contract.ps1')
          test = test_path.read_text()
          old_test = "Require $dashboard 'กำลังยืนยันการหยุดกับ EA' 'dashboard explains flat Safe Stop acknowledgement phase'"
          new_test = """Reject $dashboard 'กำลังยืนยันการหยุดกับ EA' 'dashboard must not keep a flat Safe Stop acknowledgement banner'\nRequire $dashboard 'startPhase === \"TIMEOUT\" && desired === \"RUNNING\"' 'stale Start timeout is hidden after Server releases RUNNING'\nRequire $botApi 'dashboardPositions' 'dashboard has flat Safe Stop recovery fallback'\nRequire $botApi \"UPDATE bot_instances SET desired_state='STOPPED',lock_owner=NULL WHERE id=\\$1 AND desired_state='SAFE_STOP'\" 'dashboard canonicalizes a flat stale Safe Stop to STOPPED'"""
          test = replace_once(test, old_test, new_test, 'flat Safe Stop UI regression expectation')
          test_path.write_text(test)
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck API and web
        run: npm run typecheck

      - name: Safe Stop contract regression
        shell: pwsh
        run: ./tests/production-hardening-phase4-contract.ps1

      - name: Commit cleanup to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-stale-control-state-ui-fix.yml .github/workflows/apply-stale-control-state-ui-fix-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/bot.controller.ts apps/web/app/dashboard/page.tsx tests/production-hardening-phase4-contract.ps1
          git commit -m 'fix: clear stale stopped control states'
          git push origin HEAD:main
