name: Build SCENOVA Cloud Server Setup

on:
  pull_request:
    paths:
      - "tools/windows-cloud-worker/Setup/**"
      - "tools/windows-cloud-worker/Worker/**"
      - "mt5/release/FastBasketBot.ex5"
      - "apps/web/components/CloudConsole.tsx"
      - "apps/api/src/worker.controller.ts"
      - "apps/api/src/cloud.controller.ts"
      - "apps/api/src/server-enrollment.controller.ts"
      - "apps/api/src/server-enrollment.service.ts"
      - ".github/workflows/build-cloud-server-setup.yml"
  push:
    branches: [main]
    paths:
      - "tools/windows-cloud-worker/Setup/**"
      - "tools/windows-cloud-worker/Worker/**"
      - "mt5/release/FastBasketBot.ex5"
      - "apps/web/components/CloudConsole.tsx"
      - "apps/api/src/server-enrollment.controller.ts"
      - "apps/api/src/server-enrollment.service.ts"
      - ".github/workflows/build-cloud-server-setup.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scenova-cloud-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Cloud Worker
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore tools/windows-cloud-worker/Worker/ScenovaCloudWorker.csproj
          dotnet publish tools/windows-cloud-worker/Worker/ScenovaCloudWorker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o cloud-worker-publish
          if (-not (Test-Path "cloud-worker-publish/SCENOVA-CloudWorker.exe")) {
            throw "SCENOVA-CloudWorker.exe was not produced"
          }

      - name: Verify isolated provisioning checkpoints
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process -FilePath "cloud-worker-publish/SCENOVA-CloudWorker.exe" -ArgumentList "--provision-self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Cloud Worker provisioning self-test failed"
          }

      - name: Verify Fleet Update package and rollback
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process -FilePath "cloud-worker-publish/SCENOVA-CloudWorker.exe" -ArgumentList "--fleet-update-self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Cloud Worker Fleet Update self-test failed"
          }

      - name: Publish Cloud Setup with embedded Worker and EA
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $workerPayload = (Resolve-Path "cloud-worker-publish/SCENOVA-CloudWorker.exe").Path
          dotnet restore tools/windows-cloud-worker/Setup/ScenovaCloudSetup.csproj
          dotnet publish tools/windows-cloud-worker/Setup/ScenovaCloudSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:WorkerPayloadPath="$workerPayload" -o cloud-setup-publish
          if (-not (Test-Path "cloud-setup-publish/SCENOVA-Cloud-Setup.exe")) {
            throw "SCENOVA-Cloud-Setup.exe was not produced"
          }

      - name: Generate Cloud Server release manifest
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $setupSource = Get-Content "tools/windows-cloud-worker/Setup/Program.cs" -Raw
          $workerSource = Get-Content "tools/windows-cloud-worker/Worker/WorkerLoop.cs" -Raw
          if ($setupSource -notmatch 'SetupVersion\s*=\s*"([^"]+)"') { throw "SetupVersion not found" }
          $setupVersion = $Matches[1]
          if ($workerSource -notmatch 'Version\s*=\s*"([^"]+)"') { throw "Worker Version not found" }
          $workerVersion = $Matches[1]
          $setupSha = (Get-FileHash "cloud-setup-publish/SCENOVA-Cloud-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $workerSha = (Get-FileHash "cloud-worker-publish/SCENOVA-CloudWorker.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            setupVersion = $setupVersion
            workerVersion = $workerVersion
            setupSha256 = $setupSha
            workerSha256 = $workerSha
            builtAt = (Get-Date).ToUniversalTime().ToString("O")
          } | ConvertTo-Json
          Set-Content -Path "cloud-setup-publish/SCENOVA-Cloud-Server.json" -Value $manifest -Encoding utf8

      - name: Verify Cloud Setup infrastructure self-test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & "cloud-setup-publish/SCENOVA-Cloud-Setup.exe" --setup-self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Cloud Setup infrastructure self-test failed"
          }

      - name: Upload Cloud Server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SCENOVA-Cloud-Server
          path: |
            cloud-setup-publish/SCENOVA-Cloud-Setup.exe
            cloud-setup-publish/SCENOVA-Cloud-Server.json
            cloud-worker-publish/SCENOVA-CloudWorker.exe
          if-no-files-found: error

      - name: Publish Cloud binaries to website on main
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $setupPayload = (Resolve-Path "cloud-setup-publish/SCENOVA-Cloud-Setup.exe").Path
          $manifestPayload = (Resolve-Path "cloud-setup-publish/SCENOVA-Cloud-Server.json").Path
          $workerPayload = (Resolve-Path "cloud-worker-publish/SCENOVA-CloudWorker.exe").Path

          git config user.name "scenova-build"
          git config user.email "actions@users.noreply.github.com"

          $published = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 2
              continue
            }

            # Always apply the freshly built binaries onto the newest main.
            # Do not rebase a binary artifact commit: concurrent Cloud Setup
            # builds can legitimately publish the same paths and Git cannot
            # auto-merge those executable files.
            git reset --hard origin/main
            Copy-Item -Force $setupPayload "apps/web/public/downloads/SCENOVA-Cloud-Setup.exe"
            Copy-Item -Force $manifestPayload "apps/web/public/downloads/SCENOVA-Cloud-Server.json"
            Copy-Item -Force $workerPayload "apps/web/public/downloads/SCENOVA-CloudWorker.exe"
            git add "apps/web/public/downloads/SCENOVA-Cloud-Setup.exe" "apps/web/public/downloads/SCENOVA-Cloud-Server.json" "apps/web/public/downloads/SCENOVA-CloudWorker.exe"

            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Published Cloud binaries are already current."
              $published = $true
              break
            }

            git commit -m "[server-setup-generated] build: publish hardened Cloud Setup"
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              $published = $true
              break
            }

            git reset --hard origin/main
            Start-Sleep -Seconds 2
          }

          if (-not $published) {
            throw "Failed to publish SCENOVA Cloud binaries to main"
          }
