name: Build SCENOVA Cloud Server Setup

on:
  pull_request:
    paths:
      - "tools/windows-cloud-worker/Setup/**"
      - "tools/windows-cloud-worker/Worker/**"
      - "apps/web/components/CloudConsole.tsx"
      - ".github/workflows/build-cloud-server-setup.yml"
  push:
    branches: [main]
    paths:
      - "tools/windows-cloud-worker/Setup/**"
      - "tools/windows-cloud-worker/Worker/**"
      - "apps/web/components/CloudConsole.tsx"
      - ".github/workflows/build-cloud-server-setup.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: scenova-cloud-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Cloud Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore tools/windows-cloud-worker/Setup/ScenovaCloudSetup.csproj
          dotnet publish tools/windows-cloud-worker/Setup/ScenovaCloudSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o cloud-setup-publish
          if (-not (Test-Path "cloud-setup-publish/SCENOVA-Cloud-Setup.exe")) {
            throw "SCENOVA-Cloud-Setup.exe was not produced"
          }

      - name: Publish Cloud Worker
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore tools/windows-cloud-worker/Worker/ScenovaCloudWorker.csproj
          dotnet publish tools/windows-cloud-worker/Worker/ScenovaCloudWorker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o cloud-worker-publish
          if (-not (Test-Path "cloud-worker-publish/SCENOVA-CloudWorker.exe")) {
            throw "SCENOVA-CloudWorker.exe was not produced"
          }

      - name: Upload Cloud Server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SCENOVA-Cloud-Server
          path: |
            cloud-setup-publish/SCENOVA-Cloud-Setup.exe
            cloud-worker-publish/SCENOVA-CloudWorker.exe
          if-no-files-found: error

      - name: Publish Cloud binaries to website on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item -Force "cloud-setup-publish/SCENOVA-Cloud-Setup.exe" "apps/web/public/downloads/SCENOVA-Cloud-Setup.exe"
          Copy-Item -Force "cloud-worker-publish/SCENOVA-CloudWorker.exe" "apps/web/public/downloads/SCENOVA-CloudWorker.exe"

          git config user.name "scenova-build"
          git config user.email "actions@users.noreply.github.com"
          git add "apps/web/public/downloads/SCENOVA-Cloud-Setup.exe" "apps/web/public/downloads/SCENOVA-CloudWorker.exe"

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Published Cloud binaries are already current."
            exit 0
          }

          git commit -m "[phase3-generated] build: publish SCENOVA Cloud binaries"

          $published = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 2
              continue
            }

            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort
              throw "Could not rebase Cloud binaries onto latest main"
            }

            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              $published = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $published) {
            throw "Failed to publish SCENOVA Cloud binaries to main"
          }
