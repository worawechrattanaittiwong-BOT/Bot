name: TEMP verify MT5 fast-close patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact patched source and scope invariants
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sha = (git hash-object "mt5/FastBasketBot.mq5").Trim()
          if ($sha -ne "284167076a7ec47892a7ef69a9b0c14e0683166f") { throw "Source SHA changed unexpectedly: $sha" }
          $text = Get-Content "mt5/FastBasketBot.mq5" -Raw
          $markerCount = ([regex]::Matches($text, [regex]::Escape('double fastCycleProfit = BasketCycleProfit();'))).Count
          if ($markerCount -ne 1) { throw "Fast path marker count is $markerCount, expected 1" }
          if (-not $text.Contains('else if(cycleProfit >= g_basketProfitTarget)')) { throw "Existing fixed-target fallback missing" }
          if (-not $text.Contains('if(g_profitRunTrailPercent > 0.0)')) { throw "Run-on behavior missing" }
          if (-not $text.Contains('bool CloseAllBasket(string reason)')) { throw "CloseAllBasket implementation missing" }
          if (-not $text.Contains('void SendHeartbeat()')) { throw "Heartbeat implementation missing" }
          if (-not $text.Contains('if(count > 0 && BasketHasRacePosition())')) { throw "RACE ownership guard missing" }
          if (-not $text.Contains('if(g_zeroGridClosing || ZeroGridPositionCount()>0 || ZeroGridPendingCount()>0)')) { throw "ZERO GRID ownership guard missing" }

      - name: Install official MetaTrader 5 build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          $installDir = "C:\SCENOVA-MT5-FastClose-Check"
          Invoke-WebRequest -UseBasicParsing -Uri "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto /path:`"$installDir`"" -Wait
          $metaEditor = Get-ChildItem -Path $installDir -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaEditor) { throw "metaeditor64.exe was not installed" }
          "METAEDITOR=$($metaEditor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile FastBasketBot.mq5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sourceDir = "$env:RUNNER_TEMP\SCENOVA-EA-FastClose"
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
          $source = Join-Path $sourceDir "FastBasketBot.mq5"
          Copy-Item -Force "mt5\FastBasketBot.mq5" $source
          $log = "$env:RUNNER_TEMP\FastBasketBot-fastclose-compile.log"
          Start-Process -FilePath "$env:METAEDITOR" -ArgumentList "/compile:`"$source`" /log:`"$log`"" -Wait
          if (Test-Path $log) { Get-Content $log }
          $ex5 = [System.IO.Path]::ChangeExtension($source, ".ex5")
          if (-not (Test-Path $ex5)) { throw "FastBasketBot.ex5 was not produced" }
          if (Test-Path $log) {
            $logText = Get-Content $log -Raw
            if ($logText -match "(?im)\b[1-9][0-9]*\s+errors?\b") { throw "MetaEditor reported compile errors" }
          }

      - name: Remove temporary verification workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Fast Close Verify"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_temp-fast-close-compile.yml
          git commit -m "chore: remove temporary fast-close verifier"
          git push origin HEAD:main
