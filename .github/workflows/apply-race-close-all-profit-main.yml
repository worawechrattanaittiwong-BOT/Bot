name: Apply RACE Close-All Profit Main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-race-close-all-profit-main.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Execute staged RACE feature patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess, textwrap

          try:
              workflow = Path('.github/workflows/apply-race-close-all-profit-temp.yml').read_text(encoding='utf-8')
              marker = '      - name: Apply RACE close-all profit feature\n        shell: python\n        run: |\n'
              start = workflow.find(marker)
              if start < 0:
                  raise RuntimeError('staged patch marker missing')
              body = workflow[start + len(marker):]
              end = body.find('\n      - name:')
              if end < 0:
                  raise RuntimeError('staged patch end marker missing')
              script = textwrap.dedent(body[:end])
              exec(compile(script, '<race-close-all-profit-patch>', 'exec'))
          except BaseException as exc:
              subprocess.run(['git','reset','--hard','HEAD'], check=True)
              Path('.race-patch-error.txt').write_text(type(exc).__name__ + ': ' + str(exc), encoding='utf-8')

      - name: Commit diagnostic or feature
        shell: bash
        run: |
          git config user.name "scenova-build"
          git config user.email "actions@users.noreply.github.com"
          if [ -f .race-patch-error.txt ]; then
            git add .race-patch-error.txt
            git commit -m "chore: record RACE patch error"
            git push origin HEAD:main
            exit 0
          fi
          pwsh ./tests/race-close-all-profit-contract.ps1
          rm -f .github/workflows/apply-race-close-all-profit-temp.yml
          rm -f .github/workflows/apply-race-close-all-profit-main.yml
          git add apps/web/app/dashboard/page.tsx apps/api/src/bot.controller.ts apps/api/src/release-version.ts database/001_init.sql mt5/FastBasketBot.mq5 tests/race-close-all-profit-contract.ps1 .github/workflows/ci.yml .github/workflows/apply-race-close-all-profit-temp.yml .github/workflows/apply-race-close-all-profit-main.yml
          git commit -m "feat: add RACE close-all profit target"
          git push origin HEAD:main
