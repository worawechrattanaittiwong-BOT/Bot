name: Apply Start Control Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-start-control-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply hotfix
        run: python3 scripts/apply-start-control-hotfix.py

      - name: Commit hotfix directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: make bot start state reliable and updates manual"
          git push origin HEAD:main
