name: Apply EA Brain V20 Observability

concurrency:
  group: apply-ea-brain-v20-observability
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade-ea-brain-v20-observability.ps1"
      - ".github/workflows/apply-ea-brain-v20-observability.yml"

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install official MetaTrader 5 build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          $installDir = "C:\SCENOVA-MT5-Build"
          Invoke-WebRequest -UseBasicParsing -Uri "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto /path:`"$installDir`"" -Wait
          $metaEditor = Get-ChildItem -Path $installDir -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaEditor) { throw "metaeditor64.exe was not installed" }
          "METAEDITOR=$($metaEditor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply AUTO V20 audit patch and protect RACE bodies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $eaPath = "mt5\FastBasketBot.mq5"
          $patchPath = "scripts\upgrade-ea-brain-v20-observability.ps1"

          # Repair the original V20 audit patch anchor. The old line used a
          # single-quoted PowerShell string containing literal `r`n characters,
          # so it could never match the real CRLF/LF in the MQ5 source.
          $patchLines = Get-Content $patchPath
          $fixedAnchor = $false
          $patchLines = $patchLines | ForEach-Object {
            if ($_ -like 'Insert-EaBefore *heartbeatUrl*autoDiag*') {
              $fixedAnchor = $true
              'Insert-EaBefore ''   string heartbeatUrl = InpApiBase + "/api/ea/heartbeat";'' $autoDiag ''autoV20Diagnostics=StringFormat'' ''append AUTO V20 heartbeat audit telemetry'''
            } else {
              $_
            }
          }
          if (-not $fixedAnchor) { throw "V20 heartbeat audit anchor line was not found" }
          [System.IO.File]::WriteAllLines((Resolve-Path $patchPath), $patchLines, [System.Text.UTF8Encoding]::new($false))

          $before = [System.IO.File]::ReadAllText((Resolve-Path $eaPath))
          function Function-Text([string]$source,[string]$signature) {
            $start=$source.IndexOf($signature,[System.StringComparison]::Ordinal)
            if($start -lt 0){ throw "Missing $signature" }
            $brace=$source.IndexOf('{',$start); $depth=0
            for($i=$brace;$i -lt $source.Length;$i++){
              if($source[$i] -eq '{'){$depth++}
              elseif($source[$i] -eq '}'){$depth--; if($depth -eq 0){return $source.Substring($start,$i-$start+1)}}
            }
            throw "Unclosed $signature"
          }
          $race=@(
            'int RaceM5CandleDirection()',
            'int RaceAnalysisDirection(double momentum)',
            'int RaceHarvestProfitablePositions()',
            'bool ProcessRaceFill(int direction)',
            'bool ManageRaceBasket(double momentum)'
          )
          $raceBefore=@{}; foreach($sig in $race){$raceBefore[$sig]=Function-Text $before $sig}

          & ".\scripts\upgrade-ea-brain-v20-observability.ps1"
          $after=[System.IO.File]::ReadAllText((Resolve-Path $eaPath))
          if($after -notmatch '#property\s+version\s+"1\.060"'){throw "EA 1.060 not produced"}
          foreach($sig in $race){if($raceBefore[$sig] -cne (Function-Text $after $sig)){throw "RACE body changed: $sig"}}
          foreach($s in @(
            'return g_engineMode != "RACE" && g_controlMode == "AUTO";',
            'string g_controlMode = "LEGACY";',
            'autoV20Diagnostics=StringFormat',
            'g_basketJournalAutoDecisionId',
            'if(!AutoV20Enabled() && BasketFillEnabled() && g_burstActive)'
          )){if(-not $after.Contains($s)){throw "AUTO V20 sentinel missing: $s"}}

          Copy-Item -Force $eaPath "$env:RUNNER_TEMP\FastBasketBot-V20Audit.mq5"
          Copy-Item -Force "apps\api\src\ea.controller.ts" "$env:RUNNER_TEMP\ea.controller-v20.ts"
          Copy-Item -Force "apps\web\app\dashboard\page.tsx" "$env:RUNNER_TEMP\dashboard-v20.tsx"
          "PATCHED_EA=$env:RUNNER_TEMP\FastBasketBot-V20Audit.mq5" | Out-File $env:GITHUB_ENV -Append
          "PATCHED_API=$env:RUNNER_TEMP\ea.controller-v20.ts" | Out-File $env:GITHUB_ENV -Append
          "PATCHED_WEB=$env:RUNNER_TEMP\dashboard-v20.tsx" | Out-File $env:GITHUB_ENV -Append

          $sourceDir="C:\SCENOVA-EA-Source"; New-Item -ItemType Directory -Force $sourceDir | Out-Null
          Copy-Item -Force $eaPath "$sourceDir\FastBasketBot.mq5"
          "EA_SOURCE=$sourceDir\FastBasketBot.mq5" | Out-File $env:GITHUB_ENV -Append

      - name: Typecheck and build API and Web
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm install
          npm run typecheck
          npm run build

      - name: Compile EA 1.060
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $log="$env:RUNNER_TEMP\FastBasketBot-compile.log"
          Start-Process -FilePath "$env:METAEDITOR" -ArgumentList "/compile:`"$env:EA_SOURCE`" /log:`"$log`"" -Wait
          if(Test-Path $log){Get-Content $log}
          $ex5=[System.IO.Path]::ChangeExtension($env:EA_SOURCE,'.ex5')
          if(-not (Test-Path $ex5)){throw "EX5 not produced"}
          if(Test-Path $log){$raw=Get-Content $log -Raw; if($raw -match '(?i)\b[1-9][0-9]*\s+errors?\b'){throw "MetaEditor compile errors"}}
          Copy-Item -Force $ex5 "$env:RUNNER_TEMP\FastBasketBot-V20Audit.ex5"

      - name: Publish AUTO V20 audit build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          Copy-Item -Force $env:PATCHED_EA "mt5\FastBasketBot.mq5"
          Copy-Item -Force $env:PATCHED_API "apps\api\src\ea.controller.ts"
          Copy-Item -Force $env:PATCHED_WEB "apps\web\app\dashboard\page.tsx"
          New-Item -ItemType Directory -Force "mt5\release" | Out-Null
          Copy-Item -Force "$env:RUNNER_TEMP\FastBasketBot-V20Audit.ex5" "mt5\release\FastBasketBot.ex5"
          $hash=(Get-FileHash -Algorithm SHA256 "mt5\release\FastBasketBot.ex5").Hash.ToLowerInvariant()
          @{
            file='FastBasketBot.ex5'; sha256=$hash; eaVersion='1.060'; sourceCommit='${{ github.sha }}';
            builtAt=(Get-Date).ToUniversalTime().ToString('o'); brain='V20';
            policy='AUTO_V20_CENTRAL_DECISION_AUDIT_STATS_RACE_ISOLATED'
          } | ConvertTo-Json | Set-Content -Encoding UTF8 "mt5\release\manifest.json"
          git add mt5/FastBasketBot.mq5 apps/api/src/ea.controller.ts apps/web/app/dashboard/page.tsx mt5/release/manifest.json
          git add -f mt5/release/FastBasketBot.ex5
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){Write-Host 'Already current'; exit 0}
          if($LASTEXITCODE -ne 1){throw 'Could not inspect changes'}
          git commit -m "build: publish Brain V20 AUTO audit v1.060 [skip ea build]"
          git push origin HEAD:main
