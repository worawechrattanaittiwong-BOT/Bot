name: Preview ZERO GRID UI 1-30 Fix

on:
  push:
    branches:
      - fix/zero-grid-ui-1-30-preview

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/zero-grid-ui-1-30-preview

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply minimal ZERO GRID UI contract fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/app/dashboard/page.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "Math.max(10, Math.min(30, Number(nextSettings.zeroGridLevelsPerSide) || 10))",
                  "Math.max(1, Math.min(30, Number(nextSettings.zeroGridLevelsPerSide) || 10))",
                  1,
              ),
              (
                  "Math.max(10,Math.min(30,Number(settings.zeroGridLevelsPerSide)||10))",
                  "Math.max(1,Math.min(30,Number(settings.zeroGridLevelsPerSide)||10))",
                  2,
              ),
              (
                  "Math.max(10,Math.min(30,Number(props.settings?.zeroGridLevelsPerSide)||10))",
                  "Math.max(1,Math.min(30,Number(props.settings?.zeroGridLevelsPerSide)||10))",
                  2,
              ),
              (
                  "Math.max(10,Math.min(30,Number(props.settings.zeroGridLevelsPerSide)||10))",
                  "Math.max(1,Math.min(30,Number(props.settings.zeroGridLevelsPerSide)||10))",
                  3,
              ),
              (
                  "{Array.from({length:21},(_,i)=>i+10).map(value=><option key={value} value={value}>{value} ต่อฝั่ง</option>)}",
                  "{Array.from({length:30},(_,i)=>i+1).map(value=><option key={value} value={value}>{value} ต่อฝั่ง</option>)}",
                  1,
              ),
              (
                  "เลือกได้ 10–30 ต่อฝั่ง · หลังบันทึก รอ EA ยืนยัน ${selectedZeroLevels} ต่อฝั่งก่อน Start",
                  "เลือกได้ 1–30 Pending ต่อฝั่ง · หลังบันทึก รอ EA ยืนยัน ${selectedZeroLevels} ต่อฝั่งก่อน Start",
                  1,
              ),
          ]

          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"Refusing unsafe patch: expected {expected} occurrence(s) of {old!r}, found {actual}")
              text = text.replace(old, new)

          # Safety invariants: only the UI's minimum level and options/copy change.
          if 'Array.from({length:30},(_,i)=>i+1)' not in text:
              raise SystemExit("1..30 ZERO GRID option list missing after patch")
          if 'เลือกได้ 1–30 Pending ต่อฝั่ง' not in text:
              raise SystemExit("1..30 ZERO GRID explanation missing after patch")
          if 'numberSetting("zeroGridLevelsPerSide", 1, 30, true)' in text:
              raise SystemExit("Unexpected API code appeared inside dashboard file")

          path.write_text(text, encoding="utf-8")

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: ZERO GRID regression
        run: node ./tests/zero-grid-v1-simulation.mjs

      - name: Commit preview fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-zero-grid-ui-1-30-preview.yml
          git add apps/web/app/dashboard/page.tsx
          git diff --cached --check
          git commit -m "fix: expose ZERO GRID levels 1-30 [preview]"
          git push origin HEAD:fix/zero-grid-ui-1-30-preview
