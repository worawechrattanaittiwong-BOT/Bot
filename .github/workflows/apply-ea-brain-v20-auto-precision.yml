name: Apply EA Brain V20 AUTO Precision

concurrency:
  group: apply-ea-brain-v20-auto-precision
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade-ea-brain-v20-auto-precision.ps1"
      - ".github/workflows/apply-ea-brain-v20-auto-precision.yml"

permissions:
  contents: write

jobs:
  compile-publish:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install official MetaTrader 5 build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          $installDir = "C:\SCENOVA-MT5-Build"
          Invoke-WebRequest -UseBasicParsing -Uri "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto /path:`"$installDir`"" -Wait
          $metaEditor = Get-ChildItem -Path $installDir -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaEditor) { throw "metaeditor64.exe was not installed" }
          "METAEDITOR=$($metaEditor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply and validate Brain V20 AUTO-only policy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "mt5\FastBasketBot.mq5"
          $before = [System.IO.File]::ReadAllText((Resolve-Path $path))

          function Function-Text([string]$source,[string]$signature) {
            $start = $source.IndexOf($signature,[System.StringComparison]::Ordinal)
            if ($start -lt 0) { throw "Function signature missing: $signature" }
            $brace = $source.IndexOf('{',$start)
            if ($brace -lt 0) { throw "Function opening brace missing: $signature" }
            $depth = 0
            for ($i=$brace; $i -lt $source.Length; $i++) {
              if ($source[$i] -eq '{') { $depth++ }
              elseif ($source[$i] -eq '}') {
                $depth--
                if ($depth -eq 0) { return $source.Substring($start,$i-$start+1) }
              }
            }
            throw "Function closing brace missing: $signature"
          }

          $raceSignatures = @(
            'int RaceM5CandleDirection()',
            'int RaceAnalysisDirection(double momentum)',
            'int RaceHarvestProfitablePositions()',
            'bool ProcessRaceFill(int direction)',
            'bool ManageRaceBasket(double momentum)'
          )
          $raceBefore = @{}
          foreach($sig in $raceSignatures) { $raceBefore[$sig] = Function-Text $before $sig }

          & ".\scripts\upgrade-ea-brain-v20-auto-precision.ps1" -EaPath $path
          $after = [System.IO.File]::ReadAllText((Resolve-Path $path))

          if ($after -notmatch '#property\s+version\s+"1\.059"') {
            throw "Brain V20 patch did not produce EA 1.059"
          }
          foreach($sig in $raceSignatures) {
            $raceAfter = Function-Text $after $sig
            if ($raceBefore[$sig] -cne $raceAfter) {
              throw "RACE isolation regression: $sig changed during AUTO V20 patch"
            }
          }

          foreach($sentinel in @(
            'return g_engineMode != "RACE" && g_controlMode == "AUTO";',
            'int AutoV20PrecisionDirection(double momentum)',
            'AutoV20EvaluateSide(1,momentum,g_autoV20Levels,g_autoV20Buy);',
            'AutoV20EvaluateSide(-1,momentum,g_autoV20Levels,g_autoV20Sell);',
            'side.momentumWithPoints=MathMax(0.0,directionalNow);',
            'side.momentumAgainstPoints=MathMax(0.0,-directionalNow);',
            'AUTO_V20_WAIT_CONFLICT',
            'ADD_EXCEEDS_USER_BASKET_RISK',
            'if(!AutoV20Enabled() && BasketFillEnabled() && g_burstActive)',
            'int rawDirection = BrainV13SmartDirection(momentum);',
            'if(sent && AutoV20Enabled())'
          )) {
            if (-not $after.Contains($sentinel)) { throw "V20 sentinel missing: $sentinel" }
          }

          $patched = "$env:RUNNER_TEMP\FastBasketBot-BrainV20.mq5"
          Copy-Item -Force $path $patched
          "PATCHED_EA_SOURCE=$patched" | Out-File -FilePath $env:GITHUB_ENV -Append

          $sourceDir = "C:\SCENOVA-EA-Source"
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
          $source = Join-Path $sourceDir "FastBasketBot.mq5"
          Copy-Item -Force $path $source
          "EA_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile private MQ5 to EX5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $log = "$env:RUNNER_TEMP\FastBasketBot-compile.log"
          Start-Process -FilePath "$env:METAEDITOR" -ArgumentList "/compile:`"$env:EA_SOURCE`" /log:`"$log`"" -Wait
          if (Test-Path $log) { Get-Content $log }
          $ex5 = [System.IO.Path]::ChangeExtension($env:EA_SOURCE, ".ex5")
          if (-not (Test-Path $ex5)) { throw "FastBasketBot.ex5 was not produced" }
          if (Test-Path $log) {
            $compileLog = Get-Content $log -Raw
            if ($compileLog -match '(?i)\b[1-9][0-9]*\s+errors?\b') {
              throw "MetaEditor reported compile errors"
            }
          }
          Copy-Item -Force $ex5 "$env:RUNNER_TEMP\FastBasketBot-V20.ex5"

      - name: Publish Brain V20 AUTO source and compiled artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          Copy-Item -Force $env:PATCHED_EA_SOURCE "mt5\FastBasketBot.mq5"
          New-Item -ItemType Directory -Force -Path "mt5\release" | Out-Null
          Copy-Item -Force "$env:RUNNER_TEMP\FastBasketBot-V20.ex5" "mt5\release\FastBasketBot.ex5"
          $hash = (Get-FileHash -Algorithm SHA256 "mt5\release\FastBasketBot.ex5").Hash.ToLowerInvariant()
          @{
            file = "FastBasketBot.ex5"
            sha256 = $hash
            eaVersion = "1.059"
            sourceCommit = "${{ github.sha }}"
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
            brain = "V20"
            policy = "AUTO_V20_CENTRAL_DECISION_DIRECTIONAL_MOMENTUM_UNIFIED_PULLBACK_RR_AUDIT_RACE_ISOLATED"
          } | ConvertTo-Json | Set-Content -Encoding UTF8 "mt5\release\manifest.json"

          git add mt5/FastBasketBot.mq5
          git add -f mt5/release/FastBasketBot.ex5
          git add mt5/release/manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Brain V20 already current"; exit 0 }
          if ($LASTEXITCODE -ne 1) { throw "Could not inspect V20 changes" }
          git commit -m "build: publish EA Brain V20 AUTO v1.059 [skip ea build]"
          git push origin HEAD:main
