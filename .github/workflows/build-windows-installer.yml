name: Build SCENOVA Windows Installer

# Unified 1.0.0 release rebuild trigger. Installer/Agent/API version metadata
# is validated before publishing the website binary.

on:
  pull_request:
    paths:
      - "tools/windows-installer/**"
      - "apps/api/src/release-version.ts"
      - ".github/workflows/build-windows-installer.yml"
  push:
    branches: [main]
    paths:
      - "tools/windows-installer/**"
      - "apps/api/src/release-version.ts"
      - ".github/workflows/build-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: scenova-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SIGNING_ENABLED: ${{ vars.SCENOVA_WINDOWS_SIGNING_ENABLED }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
      EXPECTED_PUBLISHER: ${{ vars.SCENOVA_WINDOWS_EXPECTED_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate installer version consistency
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          [xml]$project = Get-Content "tools/windows-installer/ScenovaInstaller.csproj"
          $projectVersion = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)

          $agentText = Get-Content "tools/windows-installer/AgentBuildInfo.cs" -Raw
          $agentMatch = [regex]::Match($agentText, 'Version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $agentMatch.Success) {
            throw "AgentBuildInfo.Version was not found"
          }
          $agentVersion = $agentMatch.Groups[1].Value

          $apiText = Get-Content "apps/api/src/release-version.ts" -Raw
          $apiMatch = [regex]::Match($apiText, 'DEFAULT_INSTALLER_VERSION\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $apiMatch.Success) {
            throw "DEFAULT_INSTALLER_VERSION was not found"
          }
          $apiVersion = $apiMatch.Groups[1].Value

          Write-Host "Project version: $projectVersion"
          Write-Host "Agent version:   $agentVersion"
          Write-Host "API version:     $apiVersion"

          if ($projectVersion -ne $agentVersion -or $projectVersion -ne $apiVersion) {
            throw "Installer version mismatch: csproj=$projectVersion agent=$agentVersion api=$apiVersion"
          }

      - name: Publish self-contained Windows installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore tools/windows-installer/ScenovaInstaller.csproj
          dotnet publish tools/windows-installer/ScenovaInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o installer-publish

          if (-not (Test-Path "installer-publish/SCENOVA-Setup.exe")) {
            throw "SCENOVA-Setup.exe was not produced"
          }

      - name: Validate Artifact Signing configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_ENABLED == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $required = @{
            "AZURE_CLIENT_ID" = $env:AZURE_CLIENT_ID
            "AZURE_TENANT_ID" = $env:AZURE_TENANT_ID
            "AZURE_SUBSCRIPTION_ID" = $env:AZURE_SUBSCRIPTION_ID
            "AZURE_ARTIFACT_SIGNING_ENDPOINT" = $env:ARTIFACT_SIGNING_ENDPOINT
            "AZURE_ARTIFACT_SIGNING_ACCOUNT" = $env:ARTIFACT_SIGNING_ACCOUNT
            "AZURE_ARTIFACT_SIGNING_PROFILE" = $env:ARTIFACT_SIGNING_PROFILE
          }

          $missing = @()
          foreach ($item in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace([string]$item.Value)) {
              $missing += $item.Key
            }
          }

          if ($missing.Count -gt 0) {
            throw "SCENOVA Windows signing is enabled but these GitHub Secrets/Variables are missing: $($missing -join ', ')"
          }

      - name: Azure login for Artifact Signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign SCENOVA installer with Azure Artifact Signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\installer-publish\SCENOVA-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: SCENOVA MT5 BOT EA Windows Installer
          description-url: https://snvea-bot.online

      - name: Verify Authenticode signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_ENABLED == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $path = "installer-publish/SCENOVA-Setup.exe"
          $signature = Get-AuthenticodeSignature -FilePath $path

          Write-Host "Signature status: $($signature.Status)"
          Write-Host "Publisher subject: $($signature.SignerCertificate.Subject)"
          Write-Host "Thumbprint: $($signature.SignerCertificate.Thumbprint)"

          if ($signature.Status -ne "Valid") {
            throw "SCENOVA-Setup.exe does not have a valid Authenticode signature: $($signature.Status)"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_PUBLISHER)) {
            if ($signature.SignerCertificate.Subject -notlike "*$($env:EXPECTED_PUBLISHER)*") {
              throw "Unexpected publisher. Expected subject to contain '$($env:EXPECTED_PUBLISHER)' but got '$($signature.SignerCertificate.Subject)'"
            }
          }

      - name: Report unsigned build mode
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_ENABLED != 'true'
        shell: powershell
        run: |
          Write-Warning "SCENOVA Windows signing is not enabled yet. Build will be published unsigned until SCENOVA_WINDOWS_SIGNING_ENABLED=true is configured."

      - name: Upload installer test artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCENOVA-Windows-Installer
          path: installer-publish/SCENOVA-Setup.exe
          if-no-files-found: error

      - name: Publish installer to website on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [xml]$project = Get-Content "tools/windows-installer/ScenovaInstaller.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Installer version was not found in ScenovaInstaller.csproj"
          }

          $versionedPath = "apps/web/public/downloads/SCENOVA-Setup-v$version.exe"
          Copy-Item -Force "installer-publish/SCENOVA-Setup.exe" "apps/web/public/downloads/SCENOVA-Setup.exe"
          Copy-Item -Force "installer-publish/SCENOVA-Setup.exe" $versionedPath

          if (-not (Test-Path $versionedPath)) {
            throw "Versioned installer was not created: $versionedPath"
          }

          git config user.name "scenova-build"
          git config user.email "actions@users.noreply.github.com"
          git add "apps/web/public/downloads/SCENOVA-Setup.exe" $versionedPath

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Published installer is already current."
            exit 0
          }

          # Do not use [skip ci] here. The installer workflow is path-filtered and
          # will not loop on apps/web/public/downloads/**, while the production web
          # deploy still needs to see this binary publish commit.
          if ($env:SIGNING_ENABLED -eq "true") {
            git commit -m "build: publish signed SCENOVA Windows installer v$version"
          } else {
            git commit -m "build: publish SCENOVA Windows installer v$version"
          }

          # Main can advance again between fetch and push while other CI work
          # publishes status/UI commits. Retry fetch -> rebase -> push so the
          # generated binary release is not lost to a non-fast-forward race.
          $published = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            Write-Host "Publish attempt $attempt/6"

            git fetch origin main
            if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 2
              continue
            }

            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort
              throw "Could not rebase generated installer onto latest main"
            }

            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              $published = $true
              break
            }

            Write-Host "Main moved during publish; retrying..."
            Start-Sleep -Seconds 2
          }

          if (-not $published) {
            throw "Failed to publish SCENOVA installer to main after retries"
          }
