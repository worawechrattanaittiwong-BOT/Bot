name: Build SCENOVA Windows Installer

on:
  pull_request:
    paths:
      - "tools/windows-installer/**"
      - ".github/workflows/build-windows-installer.yml"
  push:
    branches: [main]
    paths:
      - "tools/windows-installer/**"
      - ".github/workflows/build-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SIGNING_ENABLED: ${{ vars.SCENOVA_WINDOWS_SIGNING_ENABLED }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
      EXPECTED_PUBLISHER: ${{ vars.SCENOVA_WINDOWS_EXPECTED_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained Windows installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore tools/windows-installer/ScenovaInstaller.csproj
          dotnet publish tools/windows-installer/ScenovaInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o installer-publish

          if (-not (Test-Path "installer-publish/SCENOVA-Setup.exe")) {
            throw "SCENOVA-Setup.exe was not produced"
          }

      - name: Validate Artifact Signing configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_ENABLED == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $required = @{
            "AZURE_CLIENT_ID" = $env:AZURE_CLIENT_ID
            "AZURE_TENANT_ID" = $env:AZURE_TENANT_ID
            "AZURE_SUBSCRIPTION_ID" = $env:AZURE_SUBSCRIPTION_ID
            "AZURE_ARTIFACT_SIGNING_ENDPOINT" = $env:ARTIFACT_SIGNING_ENDPOINT
            "AZURE_ARTIFACT_SIGNING_ACCOUNT" = $env:ARTIFACT_SIGNING_ACCOUNT
            "AZURE_ARTIFACT_SIGNING_PROFILE" = $env:ARTIFACT_SIGNING_PROFILE
          }

          $missing = @()
          foreach ($item in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace([string]$item.Value)) {
              $missing += $item.Key
            }
          }

          if ($missing.Count -gt 0) {
            throw "SCENOVA Windows signing is enabled but these GitHub Secrets/Variables are missing: $($missing -join ', ')"
          }

      - name: Azure login for Artifact Signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign SCENOVA installer with Azure Artifact Signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\installer-publish\SCENOVA-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: SCENOVA MT5 BOT EA Windows Installer
          description-url: https://snvea-bot.online

      - name: Verify Authenticode signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_ENABLED == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $path = "installer-publish/SCENOVA-Setup.exe"
          $signature = Get-AuthenticodeSignature -FilePath $path

          Write-Host "Signature status: $($signature.Status)"
          Write-Host "Publisher subject: $($signature.SignerCertificate.Subject)"
          Write-Host "Thumbprint: $($signature.SignerCertificate.Thumbprint)"

          if ($signature.Status -ne "Valid") {
            throw "SCENOVA-Setup.exe does not have a valid Authenticode signature: $($signature.Status)"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_PUBLISHER)) {
            if ($signature.SignerCertificate.Subject -notlike "*$($env:EXPECTED_PUBLISHER)*") {
              throw "Unexpected publisher. Expected subject to contain '$($env:EXPECTED_PUBLISHER)' but got '$($signature.SignerCertificate.Subject)'"
            }
          }

      - name: Report unsigned build mode
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_ENABLED != 'true'
        shell: powershell
        run: |
          Write-Warning "SCENOVA Windows signing is not enabled yet. Build will be published unsigned until SCENOVA_WINDOWS_SIGNING_ENABLED=true is configured."

      - name: Upload installer test artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCENOVA-Windows-Installer
          path: installer-publish/SCENOVA-Setup.exe
          if-no-files-found: error

      - name: Publish installer to website on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item -Force "installer-publish/SCENOVA-Setup.exe" "apps/web/public/downloads/SCENOVA-Setup.exe"

          git config user.name "scenova-build"
          git config user.email "actions@users.noreply.github.com"
          git add "apps/web/public/downloads/SCENOVA-Setup.exe"

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Published installer is already current."
            exit 0
          }

          if ($env:SIGNING_ENABLED -eq "true") {
            git commit -m "build: publish signed SCENOVA Windows installer [skip ci]"
          } else {
            git commit -m "build: publish SCENOVA Windows installer [skip ci]"
          }
          git push
