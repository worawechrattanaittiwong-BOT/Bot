name: Fix Control Mode Legacy Fallback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-control-mode-legacy-fallback.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preserve legacy mode inference until controlMode is explicitly saved
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "apps/web/app/dashboard/page.tsx"
          $text = [System.IO.File]::ReadAllText((Resolve-Path $path))
          $old = @'
          controlMode: "AUTO",
          engineMode: "AUTO",
'@
          $new = @'
          controlMode: undefined,
          engineMode: "AUTO",
'@
          if (-not $text.Contains($old)) { throw "controlMode default anchor not found" }
          $text = $text.Replace($old,$new)
          [System.IO.File]::WriteAllText((Resolve-Path $path),$text,[System.Text.UTF8Encoding]::new($false))
          if (-not $text.Contains('controlMode: undefined')) { throw "legacy fallback sentinel missing" }

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Publish fallback fix
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/app/dashboard/page.tsx
          git commit -m "fix: infer legacy control mode until explicitly saved"
          git push origin HEAD:main
