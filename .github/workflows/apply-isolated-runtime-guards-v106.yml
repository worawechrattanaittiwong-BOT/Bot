name: Apply Order Orchestration Stability V107

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-isolated-runtime-guards-v106.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-order-orchestration-v107
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch pending and basket orchestration only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one block, found {count}")
              return text.replace(old, new, 1)

          ea_path = Path("mt5/FastBasketBot.mq5")
          ea = ea_path.read_text(encoding="utf-8")

          # Release version only. Strategy settings are not changed.
          ea = replace_once(ea, '#property version   "1.0.6"', '#property version   "1.0.7"', 'EA property version')
          ea = replace_once(ea, '#define SCENOVA_EA_VERSION "1.0.6"', '#define SCENOVA_EA_VERSION "1.0.7"', 'EA runtime version')
          ea = replace_once(ea, '#define SCENOVA_PRODUCT_VERSION "1.0.6"', '#define SCENOVA_PRODUCT_VERSION "1.0.7"', 'EA product version')

          old_ladder = '''bool ZeroGridEnsureLadder()
          {
             if(g_zeroGridCenter<=0.0)
                return false;

             bool complete=true;
             int nettingDirection=ZeroGridAccountIsNetting() ? ZeroGridPositionDirection() : 0;
             for(int level=1;level<=g_zeroGridLevelsPerSide;level++)
             {
                // Hedging: both sides stay available. Netting: before the first fill both
                // sides are staged; after the first fill only that side may add levels.
                if(nettingDirection>=0 && !ZeroGridLevelExists(true,level) && !ZeroGridSendPending(true,level)) complete=false;
                if(nettingDirection<=0 && !ZeroGridLevelExists(false,level) && !ZeroGridSendPending(false,level)) complete=false;
                if(g_ordersInWindow>=g_maxOrdersPerMinute) break;
             }
             return complete;
          }'''
          new_ladder = '''bool ZeroGridEnsureLadder()
          {
             if(g_zeroGridCenter<=0.0)
                return false;

             bool complete=true;
             int nettingDirection=ZeroGridAccountIsNetting() ? ZeroGridPositionDirection() : 0;
             int attemptsThisPass=0;
             const int maxAttemptsPerPass=6;

             // Stage far/high-lot -> near/low-lot. Price still triggers naturally
             // near -> far; this order only controls stable Broker submission.
             // A small per-tick batch avoids flooding the trade server with all
             // 60 pending requests at once and retries missing levels next tick.
             for(int level=g_zeroGridLevelsPerSide;level>=1;level--)
             {
                if(nettingDirection>=0 && !ZeroGridLevelExists(true,level))
                {
                   if(!ZeroGridSendPending(true,level)) complete=false;
                   attemptsThisPass++;
                   if(attemptsThisPass>=maxAttemptsPerPass) break;
                }
                if(nettingDirection<=0 && !ZeroGridLevelExists(false,level))
                {
                   if(!ZeroGridSendPending(false,level)) complete=false;
                   attemptsThisPass++;
                   if(attemptsThisPass>=maxAttemptsPerPass) break;
                }
                if(g_ordersInWindow>=g_maxOrdersPerMinute) break;
             }
             return complete;
          }'''
          ea = replace_once(ea, old_ladder, new_ladder, 'ZERO GRID ladder ordering')

          close_pattern = re.compile(r'ulong ZeroGridNearestCloseTicket\(\)\n\{.*?\n\}\n\nvoid ZeroGridClosePositions\(\)', re.S)
          close_match = close_pattern.search(ea)
          if not close_match:
              raise SystemExit('ZERO GRID close selector not found')
          new_close = '''ulong ZeroGridNearestCloseTicket()
          {
             MqlTick tick;
             bool hasTick=SymbolInfoTick(_Symbol,tick);
             double mid=hasTick ? (tick.bid+tick.ask)*0.5 : 0.0;
             double tolerance=MathMax(ZeroGridTickSize()*0.5,_Point*0.5);
             ulong bestTicket=0;
             double bestVolume=1.0e100;
             int bestProfitRank=99;
             double bestDistance=1.0e100;

             for(int i=PositionsTotal()-1;i>=0;i--)
             {
                ulong ticket=PositionGetTicket(i);
                if(ticket==0 || !PositionSelectByTicket(ticket)) continue;
                if(PositionGetString(POSITION_SYMBOL)!=_Symbol || PositionGetInteger(POSITION_MAGIC)!=InpMagic) continue;

                double volume=PositionGetDouble(POSITION_VOLUME);
                double openPrice=PositionGetDouble(POSITION_PRICE_OPEN);
                double floating=PositionGetDouble(POSITION_PROFIT)+PositionGetDouble(POSITION_SWAP);
                int profitRank=floating>=0.0 ? 0 : 1;
                double distance=hasTick ? MathAbs(openPrice-mid) : 0.0;

                // Deterministic close order: smallest lot first. Profit/distance
                // are only tie-breakers between equal-volume tickets.
                bool better=false;
                if(bestTicket==0 || volume<bestVolume-0.0000001)
                   better=true;
                else if(MathAbs(volume-bestVolume)<=0.0000001)
                {
                   if(profitRank<bestProfitRank)
                      better=true;
                   else if(profitRank==bestProfitRank && distance<bestDistance-tolerance)
                      better=true;
                   else if(profitRank==bestProfitRank && MathAbs(distance-bestDistance)<=tolerance && ticket<bestTicket)
                      better=true;
                }

                if(better)
                {
                   bestTicket=ticket;
                   bestVolume=volume;
                   bestProfitRank=profitRank;
                   bestDistance=distance;
                }
             }
             return bestTicket;
          }

          void ZeroGridClosePositions()'''
          ea = ea[:close_match.start()] + new_close + ea[close_match.end():]

          old_mode = '''   // If mode is changed while a ZERO GRID cycle owns positions, cancel pending
             // entries and let that owned cycle drain safely. Do not hand it to AUTO/RACE.
             if(!ZeroGridModeEnabled())
             {
                ZeroGridCancelPending();
                if(positions<=0)
                {
                   ResetZeroGridCycleState();
                   g_executionStatus="ZERO_GRID_STOPPED_FLAT";
                   return true;
                }

                double drainNet=ZeroGridCycleNet();
                if(drainNet>=ZeroGridRequiredCloseNet())
                {
                   g_zeroGridClosing=true;
                   g_executionStatus="ZERO_GRID_CLOSING_PROFIT";
                   ZeroGridClosePositions();
                }
                else
                   g_executionStatus="ZERO_GRID_DRAINING";
                return true;
             }'''
          new_mode = '''   // Explicit Stop/Safe-Stop/lease loss still cancels future entries.
             // A settings-mode change alone does NOT steal an active ZERO GRID cycle:
             // keep its pending ladder and owned positions until the cycle is flat.
             bool zeroControlReady =
                g_state==STATE_RUNNING && g_access &&
                (MQLInfoInteger(MQL_TESTER) || EntryLeaseValid());
             if(!zeroControlReady)
             {
                ZeroGridCancelPending();
                if(positions<=0)
                {
                   ResetZeroGridCycleState();
                   g_executionStatus="ZERO_GRID_STOPPED_FLAT";
                   return true;
                }

                double drainNet=ZeroGridCycleNet();
                if(drainNet>=ZeroGridRequiredCloseNet())
                {
                   g_zeroGridClosing=true;
                   g_executionStatus="ZERO_GRID_CLOSING_PROFIT";
                   ZeroGridClosePositions();
                }
                else
                   g_executionStatus="ZERO_GRID_SAFE_DRAIN";
                return true;
             }

             if(!ZeroGridModeEnabled())
                g_executionStatus="ZERO_GRID_CYCLE_OWNER_LOCK";'''
          ea = replace_once(ea, old_mode, new_mode, 'ZERO GRID cycle ownership')

          old_harvest = '''   // V18: harvest blue RACE positions first, before any Basket-level profit
             // logic. Realized winners are then replenished back toward Max Positions.
             // This path is RACE-only and never changes AUTO position management.
             int harvested = RaceHarvestProfitablePositions();
             if(harvested > 0)
             {
                g_raceProfitArmed = false;
                g_racePeakProfit = 0.0;

                int remainingPositions = BasketPositionCount();
                if(remainingPositions <= 0)
                {
                   ResetRaceRuntime();
                   g_executionStatus = "RACE_PROFIT_HARVEST_FLAT";
                   return true;
                }

                int remainingUnits = RaceFilledUnits();
                if(remainingUnits < g_maxPositions)
                {
                   g_raceState = "HARVEST_REFILL";
                   g_executionStatus = "RACE_HARVEST_REFILL";
                   ProcessRaceFill(direction);
                   return true;
                }
             }

          '''
          ea = replace_once(ea, old_harvest, '', 'RACE early harvest block')

          fill_block = '''   // Max Positions means the requested target in RACE mode. Until full, no
             // profit score/quality/location logic is allowed to stop additional entries.
             if(filling)
             {
                if(floatingProfit < 0.0)
                   g_raceRecoveryWatch = true;
                g_raceState = "FILLING";
                ProcessRaceFill(direction);
                return true;
             }

          '''
          harvest_after_fill = fill_block + '''   // Stability: complete the requested RACE fill first. Harvesting starts
             // only after Max Positions is reached, preventing open/close/refill churn
             // while the Basket is still being built. Entry/exit signals are unchanged.
             int harvested = RaceHarvestProfitablePositions();
             if(harvested > 0)
             {
                g_raceProfitArmed = false;
                g_racePeakProfit = 0.0;

                int remainingPositions = BasketPositionCount();
                if(remainingPositions <= 0)
                {
                   ResetRaceRuntime();
                   g_executionStatus = "RACE_PROFIT_HARVEST_FLAT";
                   return true;
                }

                int remainingUnits = RaceFilledUnits();
                if(remainingUnits < g_maxPositions)
                {
                   g_raceState = "HARVEST_REFILL";
                   g_executionStatus = "RACE_HARVEST_REFILL";
                   ProcessRaceFill(direction);
                   return true;
                }
             }

          '''
          ea = replace_once(ea, fill_block, harvest_after_fill, 'RACE fill-before-harvest ordering')

          ea_path.write_text(ea, encoding="utf-8")

          # Keep one release number everywhere so deploy/update gates remain green.
          version_files = {
              Path('apps/api/src/release-version.ts'): [
                  ('DEFAULT_INSTALLER_VERSION = "1.0.6"', 'DEFAULT_INSTALLER_VERSION = "1.0.7"'),
                  ('DEFAULT_EA_VERSION = "1.0.6"', 'DEFAULT_EA_VERSION = "1.0.7"'),
              ],
              Path('tools/windows-installer/AgentBuildInfo.cs'): [
                  ('Version = "1.0.6"', 'Version = "1.0.7"'),
              ],
              Path('tools/windows-installer/ScenovaInstaller.csproj'): [
                  ('<Version>1.0.6</Version>', '<Version>1.0.7</Version>'),
                  ('<FileVersion>1.0.6.0</FileVersion>', '<FileVersion>1.0.7.0</FileVersion>'),
                  ('<AssemblyVersion>1.0.6.0</AssemblyVersion>', '<AssemblyVersion>1.0.7.0</AssemblyVersion>'),
              ],
              Path('apps/web/components/Mt5ManualActionControls.tsx'): [
                  ('installerVersionRequired || "1.0.6"', 'installerVersionRequired || "1.0.7"'),
              ],
          }
          for path, pairs in version_files.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: version marker not unique: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate orchestration contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ea = Path('mt5/FastBasketBot.mq5').read_text(encoding='utf-8')
          required = [
            '#property version   "1.0.7"',
            'for(int level=g_zeroGridLevelsPerSide;level>=1;level--)',
            'const int maxAttemptsPerPass=6;',
            'volume<bestVolume-0.0000001',
            'ZERO_GRID_CYCLE_OWNER_LOCK',
            'ZERO_GRID_SAFE_DRAIN',
            'complete the requested RACE fill first',
            'int harvested = RaceHarvestProfitablePositions();',
            'bool LegacyBasketEngineEnabled()',
          ]
          for marker in required:
              if marker not in ea:
                  raise SystemExit('missing orchestration marker: ' + marker)
          if 'for(int level=1;level<=g_zeroGridLevelsPerSide;level++)' in ea:
              raise SystemExit('old near-to-far ZERO GRID staging still present')
          if 'If mode is changed while a ZERO GRID cycle owns positions, cancel pending' in ea:
              raise SystemExit('old ZERO GRID mode-change cancellation still present')

          # Ensure RACE harvest appears after the filling return block.
          fill = ea.index('// Max Positions means the requested target in RACE mode.')
          harvest = ea.index('int harvested = RaceHarvestProfitablePositions();', fill)
          if harvest < fill:
              raise SystemExit('RACE harvest still occurs before fill completion')
          PY
          node tests/zero-grid-v1-simulation.mjs
          git diff --check

      - name: Commit orchestration stability patch
        shell: bash
        run: |
          git config user.name "SCENOVA Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            mt5/FastBasketBot.mq5 \
            apps/api/src/release-version.ts \
            tools/windows-installer/AgentBuildInfo.cs \
            tools/windows-installer/ScenovaInstaller.csproj \
            apps/web/components/Mt5ManualActionControls.tsx
          if git diff --cached --quiet; then
            echo "Order orchestration stability patch already applied."
            exit 0
          fi
          git commit -m "fix: stabilize pending and basket orchestration v1.0.7"
          git push origin HEAD:main
