name: Apply ZERO First Pair V110

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-zero-first-pair-v110.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ZERO first pair placement
        shell: python
        run: |
          from pathlib import Path
          import re

          mq = Path("mt5/FastBasketBot.mq5")
          text = mq.read_text(encoding="utf-8-sig")

          text = re.sub(r'#property version\s+"[^"]+"', '#property version   "1.0.10"', text, count=1)
          text = re.sub(r'#define SCENOVA_EA_VERSION\s+"[^"]+"', '#define SCENOVA_EA_VERSION "1.0.10"', text, count=1)
          text = re.sub(r'#define SCENOVA_PRODUCT_VERSION\s+"[^"]+"', '#define SCENOVA_PRODUCT_VERSION "1.0.10"', text, count=1)

          old_gap = '''double ZeroGridEntryGapPrice()
          {
             // Preferred first offset is 1.00 price unit. For 2-digit XAUUSD this is
             // about 100 points: center 4001.00 -> BUY ~4002.00 / SELL ~4000.00.
             // A broker requiring a wider StopsLevel always takes priority.
             double tick=ZeroGridTickSize();
             double preferredGap=1.0;
             double brokerSafeGap=ZeroGridMinPendingDistancePrice()+tick;
             double gap=MathMax(preferredGap,brokerSafeGap);
             double units=MathCeil((gap/tick)-1e-10);
             return NormalizeDouble(MathMax(1.0,units)*tick,_Digits);
          }'''
          new_gap = '''double ZeroGridEntryGapPrice()
          {
             // Customer geometry is explicit: current/center 4000.00 -> BUY STOP
             // 4001.00 and SELL STOP 3999.00. Keep exactly 1.00 price unit whenever
             // the broker permits it; widen only when StopsLevel genuinely requires it.
             double tick=ZeroGridTickSize();
             double preferredGap=1.0;
             double brokerSafeGap=ZeroGridMinPendingDistancePrice()+tick*2.0;
             double gap=MathMax(preferredGap,brokerSafeGap);
             double units=MathCeil((gap/tick)-1e-10);
             return NormalizeDouble(units*tick,_Digits);
          }'''
          if old_gap not in text:
              raise SystemExit("ZeroGridEntryGapPrice block not found")
          text = text.replace(old_gap, new_gap, 1)

          marker = '''bool ZeroGridSendPending(bool buySide,int level)
          {'''
          helper = '''ENUM_ORDER_TYPE_TIME ZeroGridPendingTimeType()
          {
             long modes=SymbolInfoInteger(_Symbol,SYMBOL_EXPIRATION_MODE);
             if((modes & SYMBOL_EXPIRATION_GTC)==SYMBOL_EXPIRATION_GTC)
                return ORDER_TIME_GTC;
             if((modes & SYMBOL_EXPIRATION_DAY)==SYMBOL_EXPIRATION_DAY)
                return ORDER_TIME_DAY;
             if((modes & SYMBOL_EXPIRATION_SPECIFIED)==SYMBOL_EXPIRATION_SPECIFIED)
                return ORDER_TIME_SPECIFIED;
             if((modes & SYMBOL_EXPIRATION_SPECIFIED_DAY)==SYMBOL_EXPIRATION_SPECIFIED_DAY)
                return ORDER_TIME_SPECIFIED_DAY;
             return ORDER_TIME_GTC;
          }

          datetime ZeroGridPendingExpiration(ENUM_ORDER_TYPE_TIME typeTime)
          {
             if(typeTime==ORDER_TIME_SPECIFIED || typeTime==ORDER_TIME_SPECIFIED_DAY)
                return TimeCurrent()+30*24*60*60;
             return 0;
          }

          bool ZeroGridRecenterFlatCycle()
          {
             if(ZeroGridPositionCount()>0 || ZeroGridPendingCount()>0)
                return false;
             MqlTick live;
             if(!SymbolInfoTick(_Symbol,live))
                return false;
             double mid=(live.bid+live.ask)*0.5;
             g_zeroGridCenter=ZeroGridNormalizeCenterPrice(mid);
             g_zeroGridCycleStartedAt=TimeCurrent();
             g_zeroGridClosing=false;
             SaveZeroGridCycleState();
             return g_zeroGridCenter>0.0;
          }

          bool ZeroGridSendPending(bool buySide,int level)
          {'''
          if marker not in text:
              raise SystemExit("ZeroGridSendPending marker not found")
          text = text.replace(marker, helper, 1)

          old_limit = '''      if(g_ordersInWindow>=g_maxOrdersPerMinute)
                {
                   g_executionStatus="ZERO_GRID_RATE_LIMIT";
                   return false;
                }'''
          new_limit = '''      // ZERO is a dedicated pending-order engine. Do not let the generic AUTO/RACE
                // order-rate setting starve its mandatory first pair. Still keep a bounded
                // per-minute budget large enough to stage the configured ladder quickly.
                int zeroRateLimit=(int)MathMax(2,MathMin(120,ZeroGridEffectiveLevelsPerSide()*2+8));
                if(g_ordersInWindow>=zeroRateLimit)
                {
                   g_executionStatus="ZERO_GRID_RATE_LIMIT";
                   return false;
                }'''
          if old_limit not in text:
              raise SystemExit("ZERO rate-limit block not found")
          text = text.replace(old_limit, new_limit, 1)

          old_time = '''      request.type=buySide ? ORDER_TYPE_BUY_STOP : ORDER_TYPE_SELL_STOP;
                request.type_time=ORDER_TIME_GTC;
                request.type_filling=ORDER_FILLING_RETURN;
                request.comment=ZeroGridComment(buySide,level);'''
          new_time = '''      request.type=buySide ? ORDER_TYPE_BUY_STOP : ORDER_TYPE_SELL_STOP;
                request.type_time=ZeroGridPendingTimeType();
                request.expiration=ZeroGridPendingExpiration(request.type_time);
                request.type_filling=ORDER_FILLING_RETURN;
                request.comment=ZeroGridComment(buySide,level);'''
          if old_time not in text:
              raise SystemExit("pending time block not found")
          text = text.replace(old_time, new_time, 1)

          old_pair = '''   // Stage the trigger pair FIRST. Never allow L2/L3/... to exist while a
             // required L1 is missing. This is the key guarantee for fast symmetric ZERO.
             if(needBuy && !ZeroGridLevelExists(true,1))
             {
                attemptsThisPass++;
                if(!ZeroGridSendPending(true,1)) complete=false;
             }
             if(needSell && !ZeroGridLevelExists(false,1))
             {
                attemptsThisPass++;
                if(!ZeroGridSendPending(false,1)) complete=false;
             }

             bool firstPairReady=
                (!needBuy || ZeroGridLevelExists(true,1)) &&
                (!needSell || ZeroGridLevelExists(false,1));
             if(!firstPairReady)
             {
                g_executionStatus="ZERO_GRID_WAIT_FIRST_PAIR";
                return false;
             }'''
          new_pair = '''   // Stage the trigger pair FIRST. On a flat cycle both sides are treated as one
             // atomic pair around a fresh center: center 4000 -> BUY 4001 / SELL 3999.
             // If one side is rejected while the quote is moving, remove the orphan side,
             // recenter, and retry the pair immediately instead of leaving a broken ladder.
             if(needBuy && needSell && ZeroGridPositionCount()==0 &&
                !ZeroGridLevelExists(true,1) && !ZeroGridLevelExists(false,1))
             {
                bool pairReady=false;
                for(int pairAttempt=0;pairAttempt<3 && !pairReady;pairAttempt++)
                {
                   if(ZeroGridPendingCount()==0)
                      ZeroGridRecenterFlatCycle();

                   attemptsThisPass++;
                   bool buyOk=ZeroGridSendPending(true,1);
                   attemptsThisPass++;
                   bool sellOk=ZeroGridSendPending(false,1);
                   pairReady=buyOk && sellOk &&
                      ZeroGridLevelExists(true,1) && ZeroGridLevelExists(false,1);

                   if(!pairReady)
                   {
                      ZeroGridCancelPending();
                      ZeroGridRecenterFlatCycle();
                      g_executionStatus="ZERO_GRID_RETRY_FIRST_PAIR";
                   }
                }
                if(!pairReady)
                {
                   g_executionStatus="ZERO_GRID_WAIT_FIRST_PAIR";
                   return false;
                }
             }
             else
             {
                if(needBuy && !ZeroGridLevelExists(true,1))
                {
                   attemptsThisPass++;
                   if(!ZeroGridSendPending(true,1)) complete=false;
                }
                if(needSell && !ZeroGridLevelExists(false,1))
                {
                   attemptsThisPass++;
                   if(!ZeroGridSendPending(false,1)) complete=false;
                }
             }

             bool firstPairReady=
                (!needBuy || ZeroGridLevelExists(true,1)) &&
                (!needSell || ZeroGridLevelExists(false,1));
             if(!firstPairReady)
             {
                g_executionStatus="ZERO_GRID_WAIT_FIRST_PAIR";
                return false;
             }'''
          if old_pair not in text:
              raise SystemExit("first pair block not found")
          text = text.replace(old_pair, new_pair, 1)

          old_cycle = '''      g_zeroGridCycleBaseLot=MathMax(0.0001,g_zeroGridBaseLot);
                SaveZeroGridCycleState();'''
          new_cycle = '''      g_zeroGridCycleBaseLot=MathMax(0.0001,g_zeroGridBaseLot);
                // ZERO owns its own fresh placement budget. Orders from a previously active
                // AUTO/RACE mode must never prevent BUY L1 / SELL L1 from being staged.
                g_orderWindowStart=TimeCurrent();
                g_ordersInWindow=0;
                SaveZeroGridCycleState();'''
          if old_cycle not in text:
              raise SystemExit("cycle init block not found")
          text = text.replace(old_cycle, new_cycle, 1)

          mq.write_text(text, encoding="utf-8")

          rv = Path("apps/api/src/release-version.ts")
          api = rv.read_text(encoding="utf-8-sig")
          api, count = re.subn(r'export const DEFAULT_EA_VERSION = "[^"]+";', 'export const DEFAULT_EA_VERSION = "1.0.10";', api, count=1)
          if count != 1:
              raise SystemExit("DEFAULT_EA_VERSION not found")
          rv.write_text(api, encoding="utf-8")

      - name: Validate patch contract
        shell: python
        run: |
          from pathlib import Path
          mq = Path("mt5/FastBasketBot.mq5").read_text(encoding="utf-8")
          api = Path("apps/api/src/release-version.ts").read_text(encoding="utf-8")
          required = [
            '#property version   "1.0.10"',
            '#define SCENOVA_EA_VERSION "1.0.10"',
            'double preferredGap=1.0;',
            'bool ZeroGridRecenterFlatCycle()',
            'ZERO_GRID_RETRY_FIRST_PAIR',
            'request.type_time=ZeroGridPendingTimeType();',
            'int zeroRateLimit=(int)MathMax(2,MathMin(120,ZeroGridEffectiveLevelsPerSide()*2+8));',
            'g_ordersInWindow=0;'
          ]
          missing = [x for x in required if x not in mq]
          if missing:
              raise SystemExit('missing ZERO V110 contract: ' + repr(missing))
          if 'DEFAULT_EA_VERSION = "1.0.10"' not in api:
              raise SystemExit('API EA version not bumped to 1.0.10')

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-zero-first-pair-v110.yml
          git add mt5/FastBasketBot.mq5 apps/api/src/release-version.ts
          git commit -m "fix: make ZERO first BUY/SELL pair atomic v1.0.10"
          git push origin HEAD:main
