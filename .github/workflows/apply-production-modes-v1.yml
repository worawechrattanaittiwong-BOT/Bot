name: Apply Production Modes V1

on:
  workflow_dispatch:
  push:
    branches: [feature/production-modes-vector-flip-parallel]
    paths:
      - ".github/scripts/apply_production_modes_v1.py"
      - ".github/scripts/harden_production_modes_v1.py"
      - ".github/workflows/apply-production-modes-v1.yml"

permissions:
  contents: write

concurrency:
  group: apply-production-modes-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-modes-vector-flip-parallel
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair guarded insertion anchor
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('.github/scripts/apply_production_modes_v1.py')
          s=p.read_text(encoding='utf-8')
          replacement = '''# Hard owner branches before generic AUTO/legacy position management.\npatch(\n    "mt5/FastBasketBot.mq5",\n    \'''   if(count > 0)\\n   {\\n      bool tacticalBasket=BasketHasTacticalPosition();\''',\n    \'''   // FLIP LOCK and PARALLEL UNIVERSE own all entry/position behavior when selected.\\n   // Shared global stop/daily-loss logic has already run above this owner boundary.\\n   if(FlipLockModeEnabled())\\n   {\\n      ManageFlipLock(momentum);\\n      return;\\n   }\\n   if(ParallelUniverseModeEnabled())\\n   {\\n      ManageParallelUniverse(momentum);\\n      return;\\n   }\\n\\n   if(count > 0)\\n   {\\n      bool tacticalBasket=BasketHasTacticalPosition();\'''\n)\n\n'''
          pattern=r'# Hard owner branches before generic AUTO/legacy position management\.\npatch\(.*?\n\)\n\n# Ensure the order comment identifies mode ownership in broker history\.'
          updated,n=re.subn(pattern,replacement+'# Ensure the order comment identifies mode ownership in broker history.',s,flags=re.S)
          if n != 1:
              raise SystemExit(f'anchor repair expected 1 block, found {n}')
          p.write_text(updated,encoding='utf-8')
      - name: Apply guarded source patch
        run: python .github/scripts/apply_production_modes_v1.py
      - name: Apply production safety hardening
        run: python .github/scripts/harden_production_modes_v1.py
      - name: Keep existing MetaEditor workflow byte-for-byte
        run: git checkout -- .github/workflows/build-mt5-ea.yml
      - name: Install dependencies
        run: npm install
      - name: Typecheck API and Web
        run: npm run typecheck
      - name: Build API and Web
        run: npm run build
      - name: Static mode isolation assertions
        shell: python
        run: |
          from pathlib import Path
          ea=Path('mt5/FastBasketBot.mq5').read_text(encoding='utf-8')
          api=Path('apps/api/src/bot.controller.ts').read_text(encoding='utf-8')
          web=Path('apps/web/app/dashboard/page.tsx').read_text(encoding='utf-8')
          required=[
            'AutoVectorEdgeApply(momentum);',
            'bool FlipLockModeEnabled()',
            'void ManageFlipLock(double momentum)',
            'bool ParallelUniverseModeEnabled()',
            'void ManageParallelUniverse(double momentum)',
            'VECTOR_FLIP_PARALLEL_V1',
            'FLIP_LOCK_PROFIT_BANKED',
            'ResetFlipLockRuntime(true);',
          ]
          missing=[x for x in required if x not in ea]
          if missing: raise SystemExit('EA missing: '+repr(missing))
          for mode in ['FLIP_LOCK','PARALLEL_UNIVERSE']:
            if mode not in api: raise SystemExit('API missing '+mode)
            if mode not in web: raise SystemExit('Web missing '+mode)
          if '#property version   "1.0.24"' not in ea:
            raise SystemExit('EA version not bumped')
          if ea.count('void ManageFlipLock(double momentum)') != 1:
            raise SystemExit('FLIP LOCK manager duplicated')
          if ea.count('void ManageParallelUniverse(double momentum)') != 1:
            raise SystemExit('PARALLEL manager duplicated')
          if 'g_flipLockFlips>g_flipLockMaxFlips' in ea:
            raise SystemExit('old FLIP max semantics still present')
          print('static production-mode assertions passed')
      - name: Commit generated production changes
        shell: bash
        run: |
          if git diff --quiet -- mt5/FastBasketBot.mq5 apps/api/src/bot.controller.ts apps/api/src/ea.controller.ts apps/api/src/release-version.ts apps/web/app/dashboard/page.tsx; then
            echo "No generated product changes"
            exit 0
          fi
          git config user.name "SCENOVA-AI"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5 apps/api/src/bot.controller.ts apps/api/src/ea.controller.ts apps/api/src/release-version.ts apps/web/app/dashboard/page.tsx
          git commit -m "feat: activate AUTO Vector Edge, Flip Lock and Parallel Universe"
          git push origin HEAD:feature/production-modes-vector-flip-parallel
