name: Apply ZERO GRID V3 Complete Stabilization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-zero-grid-v3-complete.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-zero-grid-v3-complete
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ZERO GRID V3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("mt5/FastBasketBot.mq5")
          s = p.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {n}")
              return text.replace(old, new, 1)

          def replace_function(text, signature, replacement):
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f"function not found: {signature}")
              brace = text.find("{", start)
              if brace < 0:
                  raise SystemExit(f"opening brace not found: {signature}")
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  c = text[i]
                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f"closing brace not found: {signature}")
              return text[:start] + replacement.rstrip() + text[end:]

          if 'SCENOVA_EA_VERSION "1.0.8"' in s and 'ZERO GRID V3 - deterministic symmetric breakout ladder' in s:
              print("ZERO GRID V3 already applied")
              raise SystemExit(0)

          s = replace_once(s, '#property version   "1.0.7"', '#property version   "1.0.8"', 'property version')
          s = replace_once(s, '#define SCENOVA_EA_VERSION "1.0.7"', '#define SCENOVA_EA_VERSION "1.0.8"', 'runtime version')
          s = replace_once(s, '#define SCENOVA_PRODUCT_VERSION "1.0.7"', '#define SCENOVA_PRODUCT_VERSION "1.0.8"', 'product version')

          s = replace_once(
              s,
              '// ZERO GRID V2 - All MT5 account modes ---------------------------------------\n// Price-only symmetric ladder. Isolated from AUTO/RACE. Supports MT5 Demo,\n// Real and Contest accounts. Hedging keeps both sides live; Netting/Exchange\n// locks to the first triggered side so the broker cannot merge opposite\n// exposure into the same symbol position.',
              '// ZERO GRID V3 - deterministic symmetric breakout ladder -------------------\n// Mirrors the intended floating-stop-grid concept without allowing mode leakage:\n// a fixed cycle center, 1.5-step first trigger gap, exact step spacing, linear\n// lot ladder, near-to-far staging, and near-to-live-price profit exit. Hedging\n// keeps both sides available; Netting/Exchange locks to the first triggered side.',
              'ZERO header'
          )

          s = replace_once(
              s,
              'double g_zeroGridCenter = 0.0;\ndouble g_zeroGridStartEquity = 0.0;\ndatetime g_zeroGridCycleStartedAt = 0;\nbool   g_zeroGridClosing = false;',
              'double g_zeroGridCenter = 0.0;\ndouble g_zeroGridStartEquity = 0.0;\ndatetime g_zeroGridCycleStartedAt = 0;\nbool   g_zeroGridClosing = false;\n// V3 locks geometry for the lifetime of one cycle. Web setting changes are\n// applied only while flat, never halfway through a filled ladder.\ndouble g_zeroGridCycleStepPrice = 0.0;\nint    g_zeroGridCycleLevelsPerSide = 0;\ndouble g_zeroGridCycleBaseLot = 0.0;',
              'ZERO globals'
          )

          s = replace_function(s, 'void SaveZeroGridCycleState()', r'''void SaveZeroGridCycleState()
{
   if(g_zeroGridCenter > 0.0)
      GlobalVariableSet(ZeroGridStateKey("CENTER"),g_zeroGridCenter);
   if(g_zeroGridStartEquity > 0.0)
      GlobalVariableSet(ZeroGridStateKey("EQUITY"),g_zeroGridStartEquity);
   if(g_zeroGridCycleStartedAt > 0)
      GlobalVariableSet(ZeroGridStateKey("START"),(double)g_zeroGridCycleStartedAt);
   if(g_zeroGridCycleStepPrice > 0.0)
      GlobalVariableSet(ZeroGridStateKey("STEP"),g_zeroGridCycleStepPrice);
   if(g_zeroGridCycleLevelsPerSide > 0)
      GlobalVariableSet(ZeroGridStateKey("LEVELS"),(double)g_zeroGridCycleLevelsPerSide);
   if(g_zeroGridCycleBaseLot > 0.0)
      GlobalVariableSet(ZeroGridStateKey("BASELOT"),g_zeroGridCycleBaseLot);
}''')

          s = replace_function(s, 'void LoadZeroGridCycleState()', r'''void LoadZeroGridCycleState()
{
   if(g_zeroGridCenter <= 0.0 && GlobalVariableCheck(ZeroGridStateKey("CENTER")))
      g_zeroGridCenter=GlobalVariableGet(ZeroGridStateKey("CENTER"));
   if(g_zeroGridStartEquity <= 0.0 && GlobalVariableCheck(ZeroGridStateKey("EQUITY")))
      g_zeroGridStartEquity=GlobalVariableGet(ZeroGridStateKey("EQUITY"));
   if(g_zeroGridCycleStartedAt <= 0 && GlobalVariableCheck(ZeroGridStateKey("START")))
      g_zeroGridCycleStartedAt=(datetime)(long)GlobalVariableGet(ZeroGridStateKey("START"));
   if(g_zeroGridCycleStepPrice <= 0.0 && GlobalVariableCheck(ZeroGridStateKey("STEP")))
      g_zeroGridCycleStepPrice=GlobalVariableGet(ZeroGridStateKey("STEP"));
   if(g_zeroGridCycleLevelsPerSide <= 0 && GlobalVariableCheck(ZeroGridStateKey("LEVELS")))
      g_zeroGridCycleLevelsPerSide=(int)MathRound(GlobalVariableGet(ZeroGridStateKey("LEVELS")));
   if(g_zeroGridCycleBaseLot <= 0.0 && GlobalVariableCheck(ZeroGridStateKey("BASELOT")))
      g_zeroGridCycleBaseLot=GlobalVariableGet(ZeroGridStateKey("BASELOT"));
}''')

          s = replace_function(s, 'void ResetZeroGridCycleState()', r'''void ResetZeroGridCycleState()
{
   g_zeroGridCenter=0.0;
   g_zeroGridStartEquity=0.0;
   g_zeroGridCycleStartedAt=0;
   g_zeroGridClosing=false;
   g_zeroGridCycleStepPrice=0.0;
   g_zeroGridCycleLevelsPerSide=0;
   g_zeroGridCycleBaseLot=0.0;
   string keys[6]={"CENTER","EQUITY","START","STEP","LEVELS","BASELOT"};
   for(int i=0;i<ArraySize(keys);i++)
      if(GlobalVariableCheck(ZeroGridStateKey(keys[i])))
         GlobalVariableDel(ZeroGridStateKey(keys[i]));
}''')

          # Insert strict selected-position ownership helper immediately before the counter.
          marker = 'int ZeroGridPositionCount()\n'
          if marker not in s:
              raise SystemExit('ZeroGridPositionCount marker missing')
          helper = r'''bool ZeroGridOwnsSelectedPosition()
{
   if(PositionGetString(POSITION_SYMBOL)!=_Symbol ||
      PositionGetInteger(POSITION_MAGIC)!=InpMagic)
      return false;

   string comment=PositionGetString(POSITION_COMMENT);
   if(ZeroGridAccountIsHedging())
      return IsZeroGridComment(comment);

   // Netting can collapse multiple ZERO fills into one aggregate position and
   // may not preserve the original pending comment. Ownership is therefore
   // accepted only for a position born during the persisted ZERO cycle.
   LoadZeroGridCycleState();
   if(g_zeroGridCycleStartedAt<=0)
      return false;
   datetime opened=(datetime)PositionGetInteger(POSITION_TIME);
   return opened >= g_zeroGridCycleStartedAt-5;
}

'''
          s = s.replace(marker, helper + marker, 1)

          s = replace_function(s, 'int ZeroGridPositionCount()', r'''int ZeroGridPositionCount()
{
   LoadZeroGridCycleState();
   int count=0;
   for(int i=PositionsTotal()-1;i>=0;i--)
   {
      ulong ticket=PositionGetTicket(i);
      if(ticket==0 || !PositionSelectByTicket(ticket)) continue;
      if(ZeroGridOwnsSelectedPosition()) count++;
   }
   return count;
}''')

          s = replace_function(s, 'bool ZeroGridLevelExists(bool buySide,int level)', r'''bool ZeroGridLevelExists(bool buySide,int level)
{
   string wanted=ZeroGridComment(buySide,level);
   for(int i=OrdersTotal()-1;i>=0;i--)
   {
      ulong ticket=OrderGetTicket(i);
      if(ticket==0 || !OrderSelect(ticket)) continue;
      if(OrderGetString(ORDER_SYMBOL)==_Symbol &&
         OrderGetInteger(ORDER_MAGIC)==InpMagic &&
         OrderGetString(ORDER_COMMENT)==wanted)
         return true;
   }
   for(int i=PositionsTotal()-1;i>=0;i--)
   {
      ulong ticket=PositionGetTicket(i);
      if(ticket==0 || !PositionSelectByTicket(ticket)) continue;
      if(PositionGetString(POSITION_SYMBOL)==_Symbol &&
         PositionGetInteger(POSITION_MAGIC)==InpMagic &&
         PositionGetString(POSITION_COMMENT)==wanted)
         return true;
   }

   // Netting can lose per-level comments after fills. Only FILLED/PARTIAL
   // historical pending orders consume a level. CANCELED/EXPIRED orders must
   // remain rebuildable; treating them as filled was a major V2 instability.
   LoadZeroGridCycleState();
   if(g_zeroGridCycleStartedAt>0 && HistorySelect(g_zeroGridCycleStartedAt,TimeCurrent()+60))
   {
      int total=HistoryOrdersTotal();
      for(int i=0;i<total;i++)
      {
         ulong ticket=HistoryOrderGetTicket(i);
         if(ticket==0) continue;
         if(HistoryOrderGetString(ticket,ORDER_SYMBOL)!=_Symbol) continue;
         if(HistoryOrderGetInteger(ticket,ORDER_MAGIC)!=InpMagic) continue;
         if(HistoryOrderGetString(ticket,ORDER_COMMENT)!=wanted) continue;
         long state=HistoryOrderGetInteger(ticket,ORDER_STATE);
         if(state==ORDER_STATE_FILLED || state==ORDER_STATE_PARTIAL)
            return true;
      }
   }
   return false;
}''')

          s = replace_function(s, 'double ZeroGridCycleNet()', r'''double ZeroGridCycleNet()
{
   LoadZeroGridCycleState();
   double total=0.0;

   for(int i=PositionsTotal()-1;i>=0;i--)
   {
      ulong ticket=PositionGetTicket(i);
      if(ticket==0 || !PositionSelectByTicket(ticket)) continue;
      if(!ZeroGridOwnsSelectedPosition()) continue;
      total += PositionGetDouble(POSITION_PROFIT) + PositionGetDouble(POSITION_SWAP);
   }

   // While a ZERO cycle owns execution, no other engine may place orders on
   // this symbol/magic. The cycle time window is therefore safe for realized
   // P/L including close-side commission and fees whose comments may differ.
   if(g_zeroGridCycleStartedAt>0 && HistorySelect(g_zeroGridCycleStartedAt,TimeCurrent()+60))
   {
      int totalDeals=HistoryDealsTotal();
      for(int i=0;i<totalDeals;i++)
      {
         ulong deal=HistoryDealGetTicket(i);
         if(deal==0) continue;
         if(HistoryDealGetString(deal,DEAL_SYMBOL)!=_Symbol) continue;
         if(HistoryDealGetInteger(deal,DEAL_MAGIC)!=InpMagic) continue;
         total += HistoryDealGetDouble(deal,DEAL_PROFIT);
         total += HistoryDealGetDouble(deal,DEAL_SWAP);
         total += HistoryDealGetDouble(deal,DEAL_COMMISSION);
         total += HistoryDealGetDouble(deal,DEAL_FEE);
      }
   }
   return total;
}''')

          s = replace_function(s, 'double ZeroGridEffectiveStepPrice()', r'''double ZeroGridEffectiveStepPrice()
{
   double tick=ZeroGridTickSize();
   double source=g_zeroGridCycleStepPrice>0.0 ? g_zeroGridCycleStepPrice : g_zeroGridStepPrice;
   double requested=MathMax(source,tick);
   double units=MathCeil((requested/tick)-1e-10);
   return NormalizeDouble(units*tick,_Digits);
}

int ZeroGridEffectiveLevelsPerSide()
{
   int source=g_zeroGridCycleLevelsPerSide>0 ? g_zeroGridCycleLevelsPerSide : g_zeroGridLevelsPerSide;
   return (int)MathMax(1,MathMin(30,source));
}

double ZeroGridEffectiveBaseLot()
{
   double source=g_zeroGridCycleBaseLot>0.0 ? g_zeroGridCycleBaseLot : g_zeroGridBaseLot;
   return MathMax(0.0001,source);
}

double ZeroGridEntryGapPrice()
{
   // The reference strategy uses a quiet zone around current price before the
   // first stop, then a constant ladder step. 1.5x step closely matches that
   // geometry while broker Stops/Freeze remains the hard lower bound.
   double tick=ZeroGridTickSize();
   double gap=MathMax(ZeroGridEffectiveStepPrice()*1.5,
                      ZeroGridMinPendingDistancePrice()+tick);
   double units=MathCeil((gap/tick)-1e-10);
   return NormalizeDouble(units*tick,_Digits);
}

double ZeroGridNormalizeCenterPrice(double rawPrice)
{
   double tick=ZeroGridTickSize();
   double units=MathRound(rawPrice/tick);
   return NormalizeDouble(units*tick,_Digits);
}

bool ZeroGridRequestedConfigChanged()
{
   if(g_zeroGridCycleStartedAt<=0) return false;
   double tick=ZeroGridTickSize();
   double requestedStep=MathMax(g_zeroGridStepPrice,tick);
   requestedStep=NormalizeDouble(MathCeil((requestedStep/tick)-1e-10)*tick,_Digits);
   int requestedLevels=(int)MathMax(1,MathMin(30,g_zeroGridLevelsPerSide));
   double requestedLot=MathMax(0.0001,g_zeroGridBaseLot);
   return MathAbs(requestedStep-ZeroGridEffectiveStepPrice())>tick*0.5 ||
          requestedLevels!=ZeroGridEffectiveLevelsPerSide() ||
          MathAbs(requestedLot-ZeroGridEffectiveBaseLot())>0.0000001;
}''')

          s = replace_function(s, 'double ZeroGridPendingAnchorPrice(bool buySide)', r'''double ZeroGridPendingAnchorPrice(bool buySide)
{
   LoadZeroGridCycleState();
   if(g_zeroGridCenter<=0.0) return 0.0;

   // Deterministic symmetric cycle geometry. Never derive a missing level from
   // a later live tick; doing so bends spacing and can overlap levels.
   double gap=ZeroGridEntryGapPrice();
   double raw=buySide ? g_zeroGridCenter+gap : g_zeroGridCenter-gap;
   return ZeroGridNormalizePendingPrice(buySide,raw);
}''')

          s = replace_function(s, 'int ZeroGridPositionDirection()', r'''int ZeroGridPositionDirection()
{
   for(int i=PositionsTotal()-1;i>=0;i--)
   {
      ulong ticket=PositionGetTicket(i);
      if(ticket==0 || !PositionSelectByTicket(ticket)) continue;
      if(!ZeroGridOwnsSelectedPosition()) continue;
      return PositionGetInteger(POSITION_TYPE)==POSITION_TYPE_BUY ? 1 : -1;
   }
   return 0;
}''')

          s = replace_function(s, 'bool ZeroGridSendPending(bool buySide,int level)', r'''bool ZeroGridSendPending(bool buySide,int level)
{
   if(level<1 || level>ZeroGridEffectiveLevelsPerSide() || ZeroGridLevelExists(buySide,level))
      return true;
   if(g_zeroGridCenter<=0.0)
      return false;
   if(!ZeroGridStopOrdersSupported())
   {
      g_executionStatus="ZERO_GRID_STOP_ORDERS_UNSUPPORTED";
      return false;
   }
   if(g_orderWindowStart==0 || TimeCurrent()-g_orderWindowStart>=60)
   {
      g_orderWindowStart=TimeCurrent();
      g_ordersInWindow=0;
   }
   if(g_ordersInWindow>=g_maxOrdersPerMinute)
   {
      g_executionStatus="ZERO_GRID_RATE_LIMIT";
      return false;
   }

   double volume=NormalizeTradeVolume(ZeroGridEffectiveBaseLot()*level);
   if(volume<=0.0)
   {
      g_executionStatus="ZERO_GRID_INVALID_LOT";
      return false;
   }
   double price=ZeroGridPendingLevelPrice(buySide,level);
   if(price<=0.0)
   {
      g_executionStatus="ZERO_GRID_WAIT_TICK";
      return false;
   }

   MqlTick live;
   if(!SymbolInfoTick(_Symbol,live))
   {
      g_executionStatus="ZERO_GRID_WAIT_TICK";
      return false;
   }
   double safeDistance=ZeroGridMinPendingDistancePrice()+ZeroGridTickSize();
   double safeBoundary=buySide
      ? ZeroGridNormalizePendingPrice(true,live.ask+safeDistance)
      : ZeroGridNormalizePendingPrice(false,live.bid-safeDistance);
   if((buySide && price<safeBoundary) || (!buySide && price>safeBoundary))
   {
      g_executionStatus="ZERO_GRID_WAIT_SAFE_GEOMETRY";
      return false;
   }

   MqlTradeRequest request={};
   MqlTradeResult result={};
   request.action=TRADE_ACTION_PENDING;
   request.magic=InpMagic;
   request.symbol=_Symbol;
   request.volume=volume;
   request.price=price;
   request.type=buySide ? ORDER_TYPE_BUY_STOP : ORDER_TYPE_SELL_STOP;
   request.type_time=ORDER_TIME_GTC;
   request.type_filling=ORDER_FILLING_RETURN;
   request.comment=ZeroGridComment(buySide,level);

   ResetLastError();
   bool sent=OrderSend(request,result);
   RegisterOrderRequest();
   g_lastOrderRetcode=(long)result.retcode;
   g_lastOrderError=GetLastError();
   g_lastOrderAt=TimeCurrent();
   if(sent && (result.retcode==TRADE_RETCODE_DONE || result.retcode==TRADE_RETCODE_PLACED))
      return true;

   g_executionStatus="ZERO_GRID_PENDING_RETRY";
   return false;
}''')

          s = replace_function(s, 'bool ZeroGridEnsureLadder()', r'''bool ZeroGridEnsureLadder()
{
   if(g_zeroGridCenter<=0.0)
      return false;

   bool complete=true;
   int nettingDirection=ZeroGridAccountIsNetting() ? ZeroGridPositionDirection() : 0;
   int attemptsThisPass=0;
   const int maxAttemptsPerPass=6;
   int levels=ZeroGridEffectiveLevelsPerSide();

   // OPEN = fold inward first: stage the nearest/lowest-risk levels before the
   // farther/higher-lot levels. Never expose level 30 before level 1 exists.
   for(int level=1;level<=levels;level++)
   {
      if(nettingDirection>=0 && !ZeroGridLevelExists(true,level))
      {
         attemptsThisPass++;
         if(!ZeroGridSendPending(true,level))
         {
            complete=false;
            break;
         }
         if(attemptsThisPass>=maxAttemptsPerPass) break;
      }
      if(nettingDirection<=0 && !ZeroGridLevelExists(false,level))
      {
         attemptsThisPass++;
         if(!ZeroGridSendPending(false,level))
         {
            complete=false;
            break;
         }
         if(attemptsThisPass>=maxAttemptsPerPass) break;
      }
      if(g_ordersInWindow>=g_maxOrdersPerMinute) break;
   }
   return complete;
}''')

          s = replace_function(s, 'ulong ZeroGridNearestCloseTicket()', r'''ulong ZeroGridNearestCloseTicket()
{
   MqlTick tick;
   bool hasTick=SymbolInfoTick(_Symbol,tick);
   double tolerance=MathMax(ZeroGridTickSize()*0.5,_Point*0.5);
   ulong bestTicket=0;
   int bestProfitRank=99;
   double bestDistance=1.0e100;

   for(int i=PositionsTotal()-1;i>=0;i--)
   {
      ulong ticket=PositionGetTicket(i);
      if(ticket==0 || !PositionSelectByTicket(ticket)) continue;
      if(!ZeroGridOwnsSelectedPosition()) continue;

      long type=PositionGetInteger(POSITION_TYPE);
      double openPrice=PositionGetDouble(POSITION_PRICE_OPEN);
      double floating=PositionGetDouble(POSITION_PROFIT)+PositionGetDouble(POSITION_SWAP);
      int profitRank=floating>=0.0 ? 0 : 1;
      double livePrice=hasTick
         ? (type==POSITION_TYPE_BUY ? tick.bid : tick.ask)
         : openPrice;
      double distance=MathAbs(openPrice-livePrice);

      // CLOSE = fold outward: profitable tickets nearest executable live price
      // first, then progressively farther out. Lot size never overrides geometry.
      bool better=false;
      if(bestTicket==0 || profitRank<bestProfitRank)
         better=true;
      else if(profitRank==bestProfitRank && distance<bestDistance-tolerance)
         better=true;
      else if(profitRank==bestProfitRank && MathAbs(distance-bestDistance)<=tolerance && ticket<bestTicket)
         better=true;

      if(better)
      {
         bestTicket=ticket;
         bestProfitRank=profitRank;
         bestDistance=distance;
      }
   }
   return bestTicket;
}''')

          s = replace_function(s, 'void ZeroGridClosePositions()', r'''void ZeroGridClosePositions()
{
   // Close a bounded batch per tick. One-ticket-per-tick allowed a profitable
   // ZERO cycle to give too much back while dozens of positions were exiting.
   const int maxCloseRequestsPerPass=8;
   for(int i=0;i<maxCloseRequestsPerPass;i++)
   {
      ulong ticket=ZeroGridNearestCloseTicket();
      if(ticket==0) return;
      if(!ClosePositionByTicket(ticket))
         return;
   }
}''')

          s = replace_function(s, 'bool StartZeroGridCycle()', r'''bool StartZeroGridCycle()
{
   if(!ZeroGridModeEnabled()) return false;
   if(g_state!=STATE_RUNNING || !g_access || (!MQLInfoInteger(MQL_TESTER) && !EntryLeaseValid()))
   {
      g_executionStatus="ZERO_GRID_CONTROL_NOT_FRESH";
      return true;
   }
   if(!ZeroGridStopOrdersSupported())
   {
      g_executionStatus="ZERO_GRID_STOP_ORDERS_UNSUPPORTED";
      return true;
   }

   LoadZeroGridCycleState();
   if(g_zeroGridCenter<=0.0 && ZeroGridForeignPositionCount()>0)
   {
      g_executionStatus="ZERO_GRID_FOREIGN_POSITION_BLOCK";
      return true;
   }

   if(g_zeroGridCenter<=0.0)
   {
      MqlTick tick;
      if(!SymbolInfoTick(_Symbol,tick))
      {
         g_executionStatus="ZERO_GRID_WAIT_TICK";
         return true;
      }
      double mid=(tick.bid+tick.ask)*0.5;
      g_zeroGridCenter=ZeroGridNormalizeCenterPrice(mid);
      g_zeroGridStartEquity=AccountInfoDouble(ACCOUNT_EQUITY);
      g_zeroGridCycleStartedAt=TimeCurrent();
      g_zeroGridClosing=false;
      g_zeroGridCycleStepPrice=MathMax(ZeroGridTickSize(),g_zeroGridStepPrice);
      g_zeroGridCycleLevelsPerSide=(int)MathMax(1,MathMin(30,g_zeroGridLevelsPerSide));
      g_zeroGridCycleBaseLot=MathMax(0.0001,g_zeroGridBaseLot);
      SaveZeroGridCycleState();
   }

   ZeroGridEnsureLadder();
   if(ZeroGridAccountIsNetting())
      g_executionStatus=ZeroGridPendingCount()>0 ? "ZERO_GRID_V3_READY_NETTING" : "ZERO_GRID_V3_BUILDING";
   else
      g_executionStatus=ZeroGridPendingCount()>0 ? "ZERO_GRID_V3_READY" : "ZERO_GRID_V3_BUILDING";
   return true;
}''')

          s = replace_function(s, 'bool ManageZeroGrid()', r'''bool ManageZeroGrid()
{
   LoadZeroGridCycleState();
   int positions=ZeroGridPositionCount();

   if(g_zeroGridClosing)
   {
      ZeroGridCancelPending();
      ZeroGridClosePositions();
      if(ZeroGridPositionCount()==0 && ZeroGridPendingCount()==0)
      {
         double realized=ZeroGridCycleNet();
         Print("ZERO GRID V3 cycle closed net=",DoubleToString(realized,2));
         ResetZeroGridCycleState();
         g_executionStatus="ZERO_GRID_V3_CLOSED";
      }
      else
         g_executionStatus="ZERO_GRID_V3_CLOSE_RETRY";
      return true;
   }

   bool zeroControlReady =
      g_state==STATE_RUNNING && g_access &&
      (MQLInfoInteger(MQL_TESTER) || EntryLeaseValid());
   if(!zeroControlReady)
   {
      ZeroGridCancelPending();
      positions=ZeroGridPositionCount();
      if(positions<=0)
      {
         ResetZeroGridCycleState();
         g_executionStatus="ZERO_GRID_STOPPED_FLAT";
         return true;
      }

      double drainNet=ZeroGridCycleNet();
      if(drainNet>=ZeroGridRequiredCloseNet())
      {
         g_zeroGridClosing=true;
         g_executionStatus="ZERO_GRID_CLOSING_PROFIT";
         ZeroGridClosePositions();
      }
      else
         g_executionStatus="ZERO_GRID_SAFE_DRAIN";
      return true;
   }

   // Hard mode isolation: leaving ZERO immediately removes every future ZERO
   // entry. Existing ZERO positions remain owned only for safe profit drain;
   // AUTO/RACE cannot inherit, add to, or close them with their own engine.
   if(!ZeroGridModeEnabled())
   {
      ZeroGridCancelPending();
      positions=ZeroGridPositionCount();
      if(positions<=0)
      {
         ResetZeroGridCycleState();
         g_executionStatus="ZERO_GRID_MODE_EXIT_FLAT";
         return true;
      }

      double drainNet=ZeroGridCycleNet();
      if(drainNet>=ZeroGridRequiredCloseNet())
      {
         g_zeroGridClosing=true;
         g_executionStatus="ZERO_GRID_MODE_EXIT_CLOSING";
         ZeroGridClosePositions();
      }
      else
         g_executionStatus="ZERO_GRID_MODE_EXIT_DRAIN_ONLY";
      return true;
   }

   // Web geometry changes are applied cleanly only while flat. Never bend an
   // already-filled ladder or change lot progression halfway through a cycle.
   if(positions<=0 && ZeroGridRequestedConfigChanged())
   {
      ZeroGridCancelPending();
      ResetZeroGridCycleState();
      g_executionStatus="ZERO_GRID_REBUILD_NEW_SETTINGS";
      return StartZeroGridCycle();
   }

   // Netting/Exchange: once one side triggers, the opposite ladder is removed
   // permanently for this cycle so MT5 cannot offset/merge directions.
   if(ZeroGridAccountIsNetting() && positions>0)
   {
      int direction=ZeroGridPositionDirection();
      if(direction>0)
      {
         ZeroGridCancelPendingSide(false);
         g_executionStatus="ZERO_GRID_NETTING_SIDE_LOCK_BUY";
      }
      else if(direction<0)
      {
         ZeroGridCancelPendingSide(true);
