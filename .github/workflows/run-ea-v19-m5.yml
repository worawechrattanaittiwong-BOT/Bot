name: Run EA V19 M5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade-ea-brain-v19-race-m5.ps1"
      - ".github/workflows/run-ea-v19-m5.yml"

permissions:
  contents: write

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install MT5 build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          $installDir = "C:\SCENOVA-MT5-Build"
          Invoke-WebRequest -UseBasicParsing -Uri "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto /path:`"$installDir`"" -Wait
          $metaEditor = Get-ChildItem -Path $installDir -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaEditor) { throw "metaeditor64.exe was not installed" }
          "METAEDITOR=$($metaEditor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Apply V19 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ".\scripts\upgrade-ea-brain-v19-race-m5.ps1" -EaPath "mt5\FastBasketBot.mq5"
          $text = [System.IO.File]::ReadAllText((Resolve-Path "mt5\FastBasketBot.mq5"))
          if (-not $text.Contains('#property version   "1.058"')) { throw "EA 1.058 missing" }
          if (-not $text.Contains('int RaceM5CandleDirection()')) { throw "M5 selector missing" }
          if (-not $text.Contains('RACE_DIRECTION_LOCK')) { throw "RACE direction lock missing" }
          Copy-Item -Force "mt5\FastBasketBot.mq5" "$env:RUNNER_TEMP\FastBasketBot-V19.mq5"
          "PATCHED_SOURCE=$env:RUNNER_TEMP\FastBasketBot-V19.mq5" | Out-File -FilePath $env:GITHUB_ENV -Append
          $sourceDir = "C:\SCENOVA-EA-Source"
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
          Copy-Item -Force "mt5\FastBasketBot.mq5" "$sourceDir\FastBasketBot.mq5"
          "EA_SOURCE=$sourceDir\FastBasketBot.mq5" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Compile EA 1.058
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $log = "$env:RUNNER_TEMP\compile.log"
          Start-Process -FilePath "$env:METAEDITOR" -ArgumentList "/compile:`"$env:EA_SOURCE`" /log:`"$log`"" -Wait
          if (Test-Path $log) { Get-Content $log }
          $ex5 = [System.IO.Path]::ChangeExtension($env:EA_SOURCE, ".ex5")
          if (-not (Test-Path $ex5)) { throw "EX5 not produced" }
          if (Test-Path $log) {
            $compileLog = Get-Content $log -Raw
            if ($compileLog -match '(?i)\b[1-9][0-9]*\s+errors?\b') { throw "MetaEditor compile errors" }
          }
          New-Item -ItemType Directory -Force -Path "mt5\release" | Out-Null
          Copy-Item -Force $ex5 "mt5\release\FastBasketBot.ex5"
          $hash = (Get-FileHash -Algorithm SHA256 "mt5\release\FastBasketBot.ex5").Hash.ToLowerInvariant()
          @{file="FastBasketBot.ex5";sha256=$hash;eaVersion="1.058";sourceCommit="${{ github.sha }}";builtAt=(Get-Date).ToUniversalTime().ToString("o");brain="V19";policy="AUTO_ISOLATED_RACE_M5_ONE_CANDLE_SINGLE_SIDE_CYCLE_HARVEST_X2"} | ConvertTo-Json | Set-Content -Encoding UTF8 "mt5\release\manifest.json"
      - name: Publish EA 1.058
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $compiledEx5 = "$env:RUNNER_TEMP\FastBasketBot.ex5"
          $manifest = "$env:RUNNER_TEMP\manifest.json"
          Copy-Item -Force "mt5\release\FastBasketBot.ex5" $compiledEx5
          Copy-Item -Force "mt5\release\manifest.json" $manifest
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          Copy-Item -Force $env:PATCHED_SOURCE "mt5\FastBasketBot.mq5"
          New-Item -ItemType Directory -Force -Path "mt5\release" | Out-Null
          Copy-Item -Force $compiledEx5 "mt5\release\FastBasketBot.ex5"
          Copy-Item -Force $manifest "mt5\release\manifest.json"
          git add mt5/FastBasketBot.mq5 mt5/release/manifest.json
          git add -f mt5/release/FastBasketBot.ex5
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "build: publish EA Brain V19 RACE M5 v1.058 [skip ea build]"
          git push origin HEAD:main
