name: Apply ZERO GRID V2 All MT5

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-zero-grid-all-mt5-v2.yml"
      - "scripts/upgrade-zero-grid-all-mt5-v2.ps1"
      - "scripts/finalize-zero-grid-all-mt5-v2.ps1"
      - "scripts/upgrade-zero-grid-close-geometry-v3.ps1"
      - "tests/zero-grid-all-mt5-contract.ps1"
      - "tests/zero-grid-close-geometry-contract.ps1"

permissions:
  contents: write

concurrency:
  group: apply-zero-grid-all-mt5-v2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply universal MT5 ZERO GRID patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "./scripts/upgrade-zero-grid-all-mt5-v2.ps1" `
            -EaPath "mt5/FastBasketBot.mq5" `
            -ApiPath "apps/api/src/bot.controller.ts" `
            -WebPath "apps/web/app/dashboard/page.tsx" `
            -BuildWorkflowPath ".github/workflows/build-mt5-ea.yml"
          & "./scripts/finalize-zero-grid-all-mt5-v2.ps1" `
            -EaPath "mt5/FastBasketBot.mq5" `
            -ApiPath "apps/api/src/bot.controller.ts" `
            -WebPath "apps/web/app/dashboard/page.tsx" `
            -BuildWorkflowPath ".github/workflows/build-mt5-ea.yml"
          & "./scripts/upgrade-zero-grid-close-geometry-v3.ps1" `
            -EaPath "mt5/FastBasketBot.mq5" `
            -WebPath "apps/web/app/dashboard/page.tsx"

      - name: Validate universal account contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "./tests/zero-grid-all-mt5-contract.ps1"
          & "./tests/zero-grid-close-geometry-contract.ps1"

      - name: Verify generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Publish generated EA, API and Bot Settings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5 apps/api/src/bot.controller.ts apps/web/app/dashboard/page.tsx
          if git diff --cached --quiet; then
            echo "ZERO GRID source is already current."
          else
            git commit -m "fix: ZERO GRID inward entries and nearest-out closes"
            git push origin HEAD:main
          fi

      - name: Note official compile handoff
        shell: bash
        run: |
          echo "Source publish changes mt5/FastBasketBot.mq5, so Build MT5 EA is triggered automatically for the official EX5."
