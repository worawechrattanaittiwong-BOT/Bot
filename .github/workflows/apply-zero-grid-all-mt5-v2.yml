name: Apply ZERO GRID V2 All MT5

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-zero-grid-all-mt5-v2.yml"
      - "scripts/upgrade-zero-grid-all-mt5-v2.ps1"
      - "scripts/finalize-zero-grid-all-mt5-v2.ps1"
      - "scripts/upgrade-zero-grid-close-geometry-v3.ps1"
      - "tests/zero-grid-all-mt5-contract.ps1"
      - "tests/zero-grid-close-geometry-contract.ps1"

permissions:
  contents: write

concurrency:
  group: apply-zero-grid-all-mt5-v2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply universal MT5 ZERO GRID patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "./scripts/upgrade-zero-grid-all-mt5-v2.ps1" `
            -EaPath "mt5/FastBasketBot.mq5" `
            -ApiPath "apps/api/src/bot.controller.ts" `
            -WebPath "apps/web/app/dashboard/page.tsx" `
            -BuildWorkflowPath ".github/workflows/build-mt5-ea.yml"
          & "./scripts/finalize-zero-grid-all-mt5-v2.ps1" `
            -EaPath "mt5/FastBasketBot.mq5" `
            -ApiPath "apps/api/src/bot.controller.ts" `
            -WebPath "apps/web/app/dashboard/page.tsx" `
            -BuildWorkflowPath ".github/workflows/build-mt5-ea.yml"
          & "./scripts/upgrade-zero-grid-close-geometry-v3.ps1" `
            -EaPath "mt5/FastBasketBot.mq5" `
            -WebPath "apps/web/app/dashboard/page.tsx"

      - name: Apply AUTO and RACE profit lock V1.0.4
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "mt5/FastBasketBot.mq5"
          $text = [System.IO.File]::ReadAllText($path)

          function Replace-Required([string]$old,[string]$new,[string]$label) {
            if (-not $script:text.Contains($old)) { throw "Required source block not found: $label" }
            $script:text = $script:text.Replace($old,$new)
          }

          if ($text.Contains('#property version   "1.0.3"')) {
            $text = $text.Replace('#property version   "1.0.3"','#property version   "1.0.4"')
            $text = $text.Replace('#define SCENOVA_EA_VERSION "1.0.3"','#define SCENOVA_EA_VERSION "1.0.4"')
            $text = $text.Replace('#define SCENOVA_PRODUCT_VERSION "1.0.3"','#define SCENOVA_PRODUCT_VERSION "1.0.4"')
          }

          if (-not $text.Contains('V20.1 PROFIT LOCK')) {
            $oldAuto = @'
   double cycleProfit=BasketCycleProfit();
   if(cycleProfit>g_autoV20PeakProfit)
      g_autoV20PeakProfit=cycleProfit;
   double armProfit=MathMax(0.05,
      MathMax(g_autoV20Buy.expectedProfitMoney,g_autoV20Sell.expectedProfitMoney)*0.35);
   if(g_profitTargetMode=="AUTO" &&
      g_autoV20PeakProfit>=armProfit)
   {
      double giveback=MathMax(0.05,g_autoV20PeakProfit*0.25);
      if(cycleProfit<=g_autoV20PeakProfit-giveback)
      {
         bool closed=CloseAllBasket("AUTO_V20_PROFIT_GIVEBACK");
         if(closed) AutoV20ResetCycle();
         g_executionStatus="AUTO_V20_PROFIT_GIVEBACK";
         return true;
      }
   }
'@
            $newAuto = @'
   double cycleProfit=BasketCycleProfit();
   if(cycleProfit>g_autoV20PeakProfit)
      g_autoV20PeakProfit=cycleProfit;

   // V20.1 PROFIT LOCK: arm from real NET profit and never intentionally let
   // an armed winner fall through the positive protection floor.
   double autoProfitFloor=SmartProfitProtectionFloor(direction);
   double armProfit=MathMax(0.10,autoProfitFloor);
   if(g_profitTargetMode=="AUTO" && g_autoV20PeakProfit>=armProfit)
   {
      double giveback=MathMax(0.05,g_autoV20PeakProfit*0.20);
      double closeLevel=MathMax(autoProfitFloor,g_autoV20PeakProfit-giveback);
      if(cycleProfit<=closeLevel)
      {
         bool closed=CloseAllBasket("AUTO_V20_PROFIT_GIVEBACK");
         if(closed) AutoV20ResetCycle();
         g_executionStatus="AUTO_V20_PROFIT_GIVEBACK";
         return true;
      }
   }
'@
            Replace-Required $oldAuto $newAuto 'AUTO V20 profit giveback'
          }

          if ($text.Contains('if(direction==0 || cycleProfit<=0.0)')) {
            $text = $text.Replace('if(direction==0 || cycleProfit<=0.0)','if(direction==0)')
          }

          $oldFloor = @'
   double minimumPeak=MathMax(0.35,floor*2.20);
   if(g_profitRunPeak<minimumPeak || cycleProfit<=floor)
      return false;
'@
          if ($text.Contains($oldFloor)) {
            $newFloor = @'
   double minimumPeak=MathMax(0.10,floor);
   if(g_profitRunPeak<minimumPeak)
      return false;
   if(cycleProfit<=floor)
   {
      g_smartProfitDefenseActive=true;
      g_smartProfitDefenseReason="PROFIT_FLOOR_BREACH";
      return true;
   }
'@
            $text = $text.Replace($oldFloor,$newFloor)
          }

          if (-not $text.Contains('StringFind(reason, "AUTO_V20_PROFIT") == 0')) {
            $oldReason = '      StringFind(reason, "AUTO_PROFIT") == 0)'
            $newReason = @'
      StringFind(reason, "AUTO_PROFIT") == 0 ||
      StringFind(reason, "AUTO_V20_PROFIT") == 0 ||
      StringFind(reason, "AUTO_V20_MODERATE_TARGET") == 0 ||
      StringFind(reason, "AUTO_V20_TIME_BANK_PROFIT") == 0)
'@
            Replace-Required $oldReason $newReason 'AUTO close retry classification'
          }

          $oldRaceArm = 'return MathMax(0.10, MathMin(5.00, filledUnits * 0.02));'
          if ($text.Contains($oldRaceArm)) {
            $text = $text.Replace($oldRaceArm,'return MathMax(0.10, MathMin(0.50, filledUnits * 0.01));')
          }

          if (-not $text.Contains('RACE_HARVEST_BANK')) {
            $oldHarvest = @'
   int harvested = RaceHarvestProfitablePositions();
   if(harvested > 0)
   {
      g_raceProfitArmed = false;
      g_racePeakProfit = 0.0;

      int remainingPositions = BasketPositionCount();
'@
            $newHarvest = @'
   int harvested = RaceHarvestProfitablePositions();
   if(harvested > 0)
   {
      double harvestedCycleProfit=BasketCycleProfit();
      if(harvestedCycleProfit>g_racePeakProfit)
         g_racePeakProfit=harvestedCycleProfit;
      double harvestedArmMoney=RaceProfitArmMoney(MathMax(1,RaceFilledUnits()));
      if(harvestedCycleProfit>=harvestedArmMoney)
      {
         g_raceProfitArmed=true;
         RaceCloseCycle("RACE_HARVEST_BANK");
         return true;
      }

      int remainingPositions = BasketPositionCount();
'@
            Replace-Required $oldHarvest $newHarvest 'RACE harvest bank'
          }

          if (-not $text.Contains('V20.1 RACE PROFIT LOCK')) {
            $startMarker = '   int filledUnits = RaceFilledUnits();'
            $endMarker = '   g_raceState = "FULL_WAIT_PROFIT";'+"`r`n"+'   g_executionStatus = "RACE_FULL_WAIT_PROFIT";'+"`r`n"+'   return true;'
            $start = $text.IndexOf($startMarker)
            if ($start -lt 0) { throw 'RACE core start not found' }
            $end = $text.IndexOf($endMarker,$start)
            if ($end -lt 0) {
              $endMarker = '   g_raceState = "FULL_WAIT_PROFIT";'+"`n"+'   g_executionStatus = "RACE_FULL_WAIT_PROFIT";'+"`n"+'   return true;'
              $end = $text.IndexOf($endMarker,$start)
            }
            if ($end -lt 0) { throw 'RACE core end not found' }
            $end += $endMarker.Length
            $newRaceCore = @'
   int filledUnits = RaceFilledUnits();
   bool filling = filledUnits < g_maxPositions;
   double floatingProfit = BasketProfit();
   double cycleProfit = BasketCycleProfit();

   double lossLimit = EffectiveBasketLossLimit();
   if(lossLimit > 0.0 && cycleProfit <= -lossLimit)
   {
      RaceCloseCycle("RACE_MAX_BASKET_LOSS");
      return true;
   }

   string wrongReason = "NONE";
   if(RaceWrongDirectionConfirmed(direction,momentum,filling,wrongReason))
   {
      RaceCloseCycle(wrongReason);
      return true;
   }

   // V20.1 RACE PROFIT LOCK: protect NET cycle profit even while still filling.
   double armMoney = RaceProfitArmMoney(MathMax(1,filledUnits));
   if(cycleProfit > g_racePeakProfit)
      g_racePeakProfit = cycleProfit;
   if(!g_raceProfitArmed && cycleProfit >= armMoney)
   {
      g_raceProfitArmed = true;
      g_racePeakProfit = MathMax(g_racePeakProfit,cycleProfit);
   }

   if(g_raceProfitArmed)
   {
      bool flowing = RaceFlowStillRunning(direction,momentum);
      double giveback = RaceGivebackMoney(g_racePeakProfit,armMoney);
      double profitFloor = MathMax(0.02,armMoney*0.25);
      double closeLevel = MathMax(profitFloor,g_racePeakProfit-giveback);
      if(cycleProfit <= closeLevel)
      {
         RaceCloseCycle("RACE_PROFIT_GIVEBACK");
         return true;
      }
      if(!flowing && cycleProfit > 0.0)
      {
         RaceCloseCycle("RACE_FLOW_ENDED_PROFIT");
         return true;
      }
   }

   if(g_raceRecoveryWatch)
   {
      double recoveryCloseMoney = MathMax(0.02,armMoney*0.25);
      if(cycleProfit >= recoveryCloseMoney)
      {
         RaceCloseCycle("RACE_RECOVERY_PROFIT");
         return true;
      }
   }

   if(filling)
   {
      if(cycleProfit < 0.0)
         g_raceRecoveryWatch = true;
      g_raceState = g_raceProfitArmed ? "PROFIT_RUN" : "FILLING";
      g_executionStatus = g_raceProfitArmed ? "RACE_PROFIT_RUN" : "RACE_FILLING";
      ProcessRaceFill(direction);
      return true;
   }

   if(g_raceRecoveryWatch)
   {
      g_raceState = "RECOVERY_WAIT";
      g_executionStatus = "RACE_RECOVERY_WAIT";
      return true;
   }

   if(g_raceProfitArmed)
   {
      g_raceState = "PROFIT_RUN";
      g_executionStatus = "RACE_PROFIT_RUN";
      return true;
   }

   if(cycleProfit < 0.0)
   {
      g_raceRecoveryWatch = true;
      g_raceState = "RECOVERY_WAIT";
      g_executionStatus = "RACE_RECOVERY_WAIT";
      return true;
   }

   g_raceState = "FULL_WAIT_PROFIT";
   g_executionStatus = "RACE_FULL_WAIT_PROFIT";
   return true;
'@
            $text = $text.Substring(0,$start) + $newRaceCore + $text.Substring($end)
          }

          [System.IO.File]::WriteAllText($path,$text,(New-Object System.Text.UTF8Encoding($false)))

          foreach($sentinel in @(
            '#property version   "1.0.4"',
            'V20.1 PROFIT LOCK',
            'double autoProfitFloor=SmartProfitProtectionFloor(direction);',
            'g_smartProfitDefenseReason="PROFIT_FLOOR_BREACH";',
            'StringFind(reason, "AUTO_V20_PROFIT") == 0',
            'V20.1 RACE PROFIT LOCK',
            'if(!g_raceProfitArmed && cycleProfit >= armMoney)',
            'RaceCloseCycle("RACE_HARVEST_BANK")'
          )) {
            if(-not $text.Contains($sentinel)) { throw "Missing profit-lock sentinel: $sentinel" }
          }

      - name: Validate universal account contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "./tests/zero-grid-all-mt5-contract.ps1"
          & "./tests/zero-grid-close-geometry-contract.ps1"

      - name: Verify generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Publish generated EA, API and Bot Settings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5 apps/api/src/bot.controller.ts apps/web/app/dashboard/page.tsx
          if git diff --cached --quiet; then
            echo "EA source is already current."
          else
            git commit -m "fix: bank AUTO and RACE profit before giveback turns negative"
            git push origin HEAD:main
          fi

      - name: Note official compile handoff
        shell: bash
        run: |
          echo "Source publish changes mt5/FastBasketBot.mq5, so Build MT5 EA is triggered automatically for the official EX5."
