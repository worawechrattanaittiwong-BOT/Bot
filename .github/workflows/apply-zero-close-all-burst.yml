name: Apply ZERO close-all burst patch

on:
  push:
    branches:
      - fix/zero-close-all-burst

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip zero burst]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-close-all-burst
          fetch-depth: 0

      - name: Patch ZERO profit exit only
        shell: python
        run: |
          from pathlib import Path

          ea_path = Path('mt5/FastBasketBot.mq5')
          ea = ea_path.read_text(encoding='utf-8-sig')

          ea = ea.replace('#property version   "1.0.13"\n#define SCENOVA_EA_VERSION "1.0.13"\n#define SCENOVA_PRODUCT_VERSION "1.0.13"',
                          '#property version   "1.0.14"\n#define SCENOVA_EA_VERSION "1.0.14"\n#define SCENOVA_PRODUCT_VERSION "1.0.14"', 1)

          marker = 'bool   g_zeroGridClosing = false;'
          if marker not in ea:
              raise SystemExit('ZERO closing state marker missing')
          ea = ea.replace(marker, marker + '\nulong  g_zeroGridLastExitBurstMs = 0;', 1)

          old_close = '''void ZeroGridClosePositions()\n{\n   const int maxCloseRequestsPerPass=8;\n   for(int i=0;i<maxCloseRequestsPerPass;i++)\n   {\n      ulong ticket=ZeroGridNearestCloseTicket();\n      if(ticket==0) return;\n      if(!ClosePositionByTicket(ticket))\n         return;\n   }\n}'''
          new_close = '''bool ZeroGridClosePositionAsync(ulong ticket)\n{\n   if(ticket==0 || !PositionSelectByTicket(ticket))\n      return false;\n   if(!ZeroGridOwnsSelectedPosition())\n      return false;\n\n   string symbol=PositionGetString(POSITION_SYMBOL);\n   double volume=PositionGetDouble(POSITION_VOLUME);\n   long positionType=PositionGetInteger(POSITION_TYPE);\n   MqlTick tick;\n   if(!SymbolInfoTick(symbol,tick))\n      return false;\n\n   MqlTradeRequest request={};\n   MqlTradeResult result={};\n   request.action=TRADE_ACTION_DEAL;\n   request.position=ticket;\n   request.magic=PositionGetInteger(POSITION_MAGIC);\n   request.symbol=symbol;\n   request.volume=NormalizeTradeVolume(volume);\n   request.deviation=DynamicDeviationPoints();\n   request.type_filling=AllowedFillingMode();\n   request.comment="SaaSZeroCloseAll";\n   if(positionType==POSITION_TYPE_BUY)\n   {\n      request.type=ORDER_TYPE_SELL;\n      request.price=tick.bid;\n   }\n   else\n   {\n      request.type=ORDER_TYPE_BUY;\n      request.price=tick.ask;\n   }\n\n   ResetLastError();\n   bool sent=OrderSendAsync(request,result);\n   if(!sent || !TradeResultAccepted(result))\n   {\n      Print("ZERO close-all async rejected ticket=",ticket,\n            " error=",GetLastError()," retcode=",result.retcode);\n      return false;\n   }\n   return true;\n}\n\nvoid ZeroGridCancelPendingAsync()\n{\n   for(int i=OrdersTotal()-1;i>=0;i--)\n   {\n      ulong ticket=OrderGetTicket(i);\n      if(ticket==0 || !OrderSelect(ticket)) continue;\n      if(OrderGetString(ORDER_SYMBOL)!=_Symbol || OrderGetInteger(ORDER_MAGIC)!=InpMagic) continue;\n      if(!IsZeroGridComment(OrderGetString(ORDER_COMMENT))) continue;\n\n      MqlTradeRequest request={};\n      MqlTradeResult result={};\n      request.action=TRADE_ACTION_REMOVE;\n      request.order=ticket;\n      request.magic=InpMagic;\n      request.symbol=_Symbol;\n      ResetLastError();\n      if(OrderSendAsync(request,result) && TradeResultAccepted(result))\n         RegisterOrderRequest();\n      else\n         Print("ZERO cancel-all async rejected order=",ticket,\n               " error=",GetLastError()," retcode=",result.retcode);\n   }\n}\n\nvoid ZeroGridClosePositions()\n{\n   // ZERO_GRID_CLOSE_ALL_BURST: emulate MT5 Close All without waiting one network\n   // round trip per ticket. Send every owned position close first, then cancel\n   // remaining ZERO pending orders. Unconfirmed survivors are retried after a\n   // short cooldown while g_zeroGridClosing blocks any new cycle.\n   ulong nowMs=GetTickCount64();\n   if(g_zeroGridLastExitBurstMs>0 && nowMs-g_zeroGridLastExitBurstMs<750)\n      return;\n   g_zeroGridLastExitBurstMs=nowMs;\n\n   ulong tickets[];\n   int ticketCount=0;\n   for(int i=PositionsTotal()-1;i>=0;i--)\n   {\n      ulong ticket=PositionGetTicket(i);\n      if(ticket==0 || !PositionSelectByTicket(ticket)) continue;\n      if(!ZeroGridOwnsSelectedPosition()) continue;\n      ArrayResize(tickets,ticketCount+1);\n      tickets[ticketCount++]=ticket;\n   }\n\n   int sent=0;\n   for(int i=0;i<ticketCount;i++)\n      if(ZeroGridClosePositionAsync(tickets[i])) sent++;\n\n   // Position exits are queued first so profit realization is never delayed by\n   // dozens of synchronous pending-order cancellations on a high-latency broker.\n   ZeroGridCancelPendingAsync();\n   if(sent>0)\n      g_executionStatus="ZERO_GRID_CLOSE_ALL_BURST";\n}'''
          if old_close not in ea:
              raise SystemExit('ZERO close function not found')
          ea = ea.replace(old_close, new_close, 1)

          # Normal profit exit must not synchronously cancel every pending order
          # before position close requests are dispatched.
          old_profit = '''         g_zeroGridClosing=true;\n         g_executionStatus="ZERO_GRID_CLOSING_PROFIT";\n         ZeroGridCancelPending();\n         ZeroGridClosePositions();\n         return true;'''
          new_profit = '''         g_zeroGridClosing=true;\n         g_executionStatus="ZERO_GRID_CLOSING_PROFIT";\n         ZeroGridClosePositions();\n         return true;'''
          if old_profit not in ea:
              raise SystemExit('ZERO normal profit exit block not found')
          ea = ea.replace(old_profit, new_profit, 1)

          old_closing = '''   if(g_zeroGridClosing)\n   {\n      ZeroGridCancelPending();\n      ZeroGridClosePositions();'''
          new_closing = '''   if(g_zeroGridClosing)\n   {\n      ZeroGridClosePositions();'''
          if old_closing not in ea:
              raise SystemExit('ZERO closing retry block not found')
          ea = ea.replace(old_closing, new_closing, 1)
          ea_path.write_text(ea, encoding='utf-8')

          api_path = Path('apps/api/src/release-version.ts')
          api = api_path.read_text(encoding='utf-8')
          old_api = 'export const DEFAULT_EA_VERSION = "1.0.13";'
          if old_api not in api:
              raise SystemExit('API EA version marker missing')
          api_path.write_text(api.replace(old_api, 'export const DEFAULT_EA_VERSION = "1.0.14";', 1), encoding='utf-8')

          test_path = Path('tests/zero-grid-close-geometry-contract.ps1')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('Require-Contains $ea \'#property version   "1.0.13"\' \'EA version bump\'',
                              'Require-Contains $ea \'#property version   "1.0.14"\' \'EA version bump\'', 1)
          test = test.replace("Require-NotContains $ea 'OrderSendAsync' 'async trade race expansion'",
                              "Require-Contains $ea 'ZERO_GRID_CLOSE_ALL_BURST' 'ZERO profit close-all burst'\nRequire-Contains $ea 'OrderSendAsync(request,result)' 'async ZERO close/cancel dispatch'\nRequire-Contains $ea 'g_zeroGridLastExitBurstMs' 'duplicate burst cooldown'", 1)
          test_path.write_text(test, encoding='utf-8')

          wf_path = Path('.github/workflows/build-mt5-ea.yml')
          wf = wf_path.read_text(encoding='utf-8')
          old_sentinel = "            'const int maxCloseRequestsPerPass=8;',"
          new_sentinels = "            'ZERO_GRID_CLOSE_ALL_BURST',\n            'OrderSendAsync(request,result)',\n            'g_zeroGridLastExitBurstMs',"
          if old_sentinel not in wf:
              raise SystemExit('Build ZERO close sentinel missing')
          wf_path.write_text(wf.replace(old_sentinel, new_sentinels, 1), encoding='utf-8')

      - name: Verify isolated behavior contracts
        shell: pwsh
        run: |
          ./tests/zero-grid-close-geometry-contract.ps1
          ./tests/release-version-consistency.ps1
          ./tests/ea-version-bump-required.ps1
          $changed = @(git diff --name-only HEAD)
          $allowed = @(
            'mt5/FastBasketBot.mq5',
            'apps/api/src/release-version.ts',
            'tests/zero-grid-close-geometry-contract.ps1',
            '.github/workflows/build-mt5-ea.yml'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected changed file: $path" }
          }
          if ($changed.Count -ne 4) { throw "Expected exactly 4 changed files, got $($changed.Count)" }

      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mt5/FastBasketBot.mq5 apps/api/src/release-version.ts tests/zero-grid-close-geometry-contract.ps1 .github/workflows/build-mt5-ea.yml
          git commit -m "fix(mt5): burst close ZERO profit basket [skip zero burst]"
          git push origin HEAD:fix/zero-close-all-burst
