name: Fix Integration Auto Follow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-integration-auto-follow.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stale account-follow assertions
        run: python3 scripts/fix_integration_auto_follow.py

      - name: Commit repaired smoke test
        run: |
          git config user.name "SCENOVA CI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/integration-smoke.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Integration Smoke already aligned"
            exit 0
          fi
          git commit -m "test: align smoke with automatic MT5 account follow"
          git push origin HEAD:main
