name: Fix Integration Auto Follow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-integration-auto-follow.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch stale account-follow assertions
        run: python3 scripts/fix_integration_auto_follow.py

      - name: Stage patched workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B64=$(base64 -w0 .github/workflows/integration-smoke.yml)
          RESPONSE=$(curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/git/blobs \
            -d "{\"content\":\"$B64\",\"encoding\":\"base64\"}")
          SHA=$(printf '%s' "$RESPONSE" | jq -r '.sha')
          test -n "$SHA"
          echo "PATCHED_WORKFLOW_BLOB_SHA=$SHA"
