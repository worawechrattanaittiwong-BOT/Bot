name: Build MT5 EA

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mt5/FastBasketBot.mq5"
      - "scripts/upgrade-ea-brain-v17-race.ps1"
      - "scripts/upgrade-ea-brain-v18-race-harvest.ps1"
      - "scripts/upgrade-ea-brain-v19-scalp-reversal.ps1"
      - ".github/workflows/build-mt5-ea.yml"

permissions:
  contents: write

jobs:
  compile:
    if: ${{ !contains(github.event.head_commit.message, '[skip ea build]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install official MetaTrader 5 build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          $installDir = "C:\SCENOVA-MT5-Build"
          Invoke-WebRequest -UseBasicParsing -Uri "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto /path:`"$installDir`"" -Wait
          $metaEditor = Get-ChildItem -Path $installDir -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaEditor) { throw "metaeditor64.exe was not installed" }
          "METAEDITOR=$($metaEditor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply Brain V19 AUTO scalp pullback reversal
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ".\scripts\upgrade-ea-brain-v17-race.ps1" `
            -EaPath "mt5\FastBasketBot.mq5" `
            -ApiPath "apps\api\src\bot.controller.ts" `
            -WebPath "apps\web\app\dashboard\page.tsx"
          & ".\scripts\upgrade-ea-brain-v18-race-harvest.ps1" `
            -EaPath "mt5\FastBasketBot.mq5"
          & ".\scripts\upgrade-ea-brain-v19-scalp-reversal.ps1" `
            -Path "mt5\FastBasketBot.mq5"

          $mq5Path = (Resolve-Path "mt5\FastBasketBot.mq5").Path
          $patchedText = [System.IO.File]::ReadAllText($mq5Path)
          $apiText = [System.IO.File]::ReadAllText((Resolve-Path "apps\api\src\bot.controller.ts"))
          $webText = [System.IO.File]::ReadAllText((Resolve-Path "apps\web\app\dashboard\page.tsx"))

          if ($patchedText -notmatch '#property\s+version\s+"1\.058"') {
            throw "Brain V19 patch did not produce EA 1.058"
          }

          foreach ($sentinel in @(
            'bool RaceModeEnabled()',
            'bool BasketHasRacePosition()',
            'int RaceFilledUnits()',
            'int RaceAnalysisDirection(double momentum)',
            'bool RaceWrongDirectionConfirmed(',
            'int RaceHarvestProfitablePositions()',
            'bool ProcessRaceFill(int direction)',
            'bool StartRaceCycle(double momentum)',
            'bool ManageRaceBasket(double momentum)',
            'RACE_PROFIT_HARVEST',
            'RACE_HARVEST_REFILL',
            'double floatingProfit = BasketProfit();',
            'if(floatingProfit >= armMoney)',
            'RACE_TARGET_FILLED',
            'RACE_RECOVERY_PROFIT',
            'RACE_PROFIT_GIVEBACK',
            'SaaSRace',
            'g_engineMode == "RACE"',
            'BrainV16RearmExistingBasket();',
            'TradePermissionStatus',
            'AdaptiveSpreadAllowed',
            'OrderSendWithPriceRetry',
            'CONTROL_NOT_FRESH',
            'NO_ACCESS',
            'int BrainV19ContextScore(int direction)',
            'bool BrainV19RecentDrive(int direction, double momentum)',
            'bool BrainV19M1TurnReady(int direction)',
            'bool BrainV19ScalpReversalReady(int direction, double momentum)',
            'int BrainV19ScalpDirection(double momentum)',
            'WAIT_DIP_BUY_CONFIRM',
            'WAIT_RALLY_SELL_CONFIRM',
            'int rawDirection = BrainV19ScalpDirection(momentum);'
          )) {
            if (-not $patchedText.Contains($sentinel)) {
              throw "Brain V19 sentinel missing: $sentinel"
            }
          }

          if (-not $apiText.Contains('body.engineMode !== undefined') -or
              -not $apiText.Contains('["AUTO", "RACE"]')) {
            throw "API engineMode validation was not applied"
          }
          if (-not $webText.Contains('engineMode: "AUTO"') -or
              -not $webText.Contains('props.onEdit?.("engineMode","RACE")') -or
              -not $webText.Contains('{id:"RACE",icon:"status",tag:')) {
            throw "Web RACE mode UI was not applied"
          }

          # AUTO/RACE isolation contract: V19 changes AUTO direction only;
          # V18 harvesting remains limited to SaaSRace positions.
          foreach ($autoSentinel in @(
            'int direction = AdaptiveEntryDirection(momentum);',
            'if(RaceModeEnabled() && count <= 0 && rescueCount <= 0)',
            'if(count > 0 && BasketHasRacePosition())',
            'StringFind(PositionGetString(POSITION_COMMENT), "SaaSRace") < 0'
          )) {
            if (-not $patchedText.Contains($autoSentinel)) {
              throw "AUTO/RACE isolation sentinel missing: $autoSentinel"
            }
          }

          if ($patchedText.Contains('StringFind(InpApiBase, "http://") == 0')) {
            throw "Plain HTTP API configuration is still accepted"
          }

          $patchedSource = "$env:RUNNER_TEMP\FastBasketBot-BrainV19.mq5"
          $patchedApi = "$env:RUNNER_TEMP\bot.controller-v19.ts"
          $patchedWeb = "$env:RUNNER_TEMP\dashboard-v19.tsx"
          Copy-Item -Force $mq5Path $patchedSource
          Copy-Item -Force "apps\api\src\bot.controller.ts" $patchedApi
          Copy-Item -Force "apps\web\app\dashboard\page.tsx" $patchedWeb
          "PATCHED_EA_SOURCE=$patchedSource" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATCHED_API_SOURCE=$patchedApi" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATCHED_WEB_SOURCE=$patchedWeb" | Out-File -FilePath $env:GITHUB_ENV -Append

          $sourceDir = "C:\SCENOVA-EA-Source"
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
          $source = Join-Path $sourceDir "FastBasketBot.mq5"
          Copy-Item -Force $mq5Path $source
          "EA_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile private MQ5 to EX5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $log = "$env:RUNNER_TEMP\FastBasketBot-compile.log"
          Start-Process -FilePath "$env:METAEDITOR" -ArgumentList "/compile:`"$env:EA_SOURCE`" /log:`"$log`"" -Wait
          if (Test-Path $log) { Get-Content $log }
          $ex5 = [System.IO.Path]::ChangeExtension($env:EA_SOURCE, ".ex5")
          if (-not (Test-Path $ex5)) { throw "FastBasketBot.ex5 was not produced" }
          if (Test-Path $log) {
            $compileLog = Get-Content $log -Raw
            if ($compileLog -match '(?i)\b[1-9][0-9]*\s+errors?\b') {
              throw "MetaEditor reported compile errors"
            }
          }

          New-Item -ItemType Directory -Force -Path "mt5\release" | Out-Null
          Copy-Item -Force $ex5 "mt5\release\FastBasketBot.ex5"
          $hash = (Get-FileHash -Algorithm SHA256 "mt5\release\FastBasketBot.ex5").Hash.ToLowerInvariant()
          $sourceText = Get-Content "$env:EA_SOURCE" -Raw
          $versionMatch = [regex]::Match($sourceText, '#property\s+version\s+"([^"]+)"')
          if (-not $versionMatch.Success) { throw "EA #property version was not found" }
          $eaVersion = $versionMatch.Groups[1].Value

          @{
            file = "FastBasketBot.ex5"
            sha256 = $hash
            eaVersion = $eaVersion
            sourceCommit = "${{ github.sha }}"
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
            brain = "V19"
            policy = "AUTO_M1_SCALP_PULLBACK_M5_M15_M30_CONTEXT_RACE_ISOLATED_HARVEST"
          } | ConvertTo-Json | Set-Content -Encoding UTF8 "mt5\release\manifest.json"

      - name: Publish Brain V19 AUTO scalp and compiled artifact
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $compiledEx5 = "$env:RUNNER_TEMP\FastBasketBot.ex5"
          $compiledManifest = "$env:RUNNER_TEMP\FastBasketBot-manifest.json"
          Copy-Item -Force "mt5\release\FastBasketBot.ex5" $compiledEx5
          Copy-Item -Force "mt5\release\manifest.json" $compiledManifest

          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"

          $published = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            Write-Host "EA Brain V19 AUTO scalp publish attempt $attempt/6"
            git fetch origin main
            if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 2
              continue
            }

            git diff --quiet "${{ github.sha }}" origin/main -- `
              mt5/FastBasketBot.mq5 `
              apps/api/src/bot.controller.ts `
              apps/web/app/dashboard/page.tsx
            if ($LASTEXITCODE -eq 1) {
              Write-Host "A newer EA-related source exists on main; skipping obsolete V19 publish."
              exit 0
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Could not compare V19 sources with latest main"
            }

            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { throw "Could not reset to latest main" }

            Copy-Item -Force $env:PATCHED_EA_SOURCE "mt5\FastBasketBot.mq5"
            Copy-Item -Force $env:PATCHED_API_SOURCE "apps\api\src\bot.controller.ts"
            Copy-Item -Force $env:PATCHED_WEB_SOURCE "apps\web\app\dashboard\page.tsx"
            New-Item -ItemType Directory -Force -Path "mt5\release" | Out-Null
            Copy-Item -Force $compiledEx5 "mt5\release\FastBasketBot.ex5"
            Copy-Item -Force $compiledManifest "mt5\release\manifest.json"

            git add mt5/FastBasketBot.mq5
            git add apps/api/src/bot.controller.ts
            git add apps/web/app/dashboard/page.tsx
            git add -f mt5/release/FastBasketBot.ex5
            git add mt5/release/manifest.json
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Brain V19 AUTO scalp source and artifact are already current."
              $published = $true
              break
            }
            if ($LASTEXITCODE -ne 1) {
              throw "Could not inspect generated V19 changes"
            }

            git commit -m "build: publish EA Brain V19 AUTO scalp v1.058 [skip ea build]"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit Brain V19 AUTO scalp changes" }

            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              $published = $true
              break
            }

            Write-Host "Main moved while publishing Brain V19 AUTO scalp; retrying..."
            Start-Sleep -Seconds 2
          }

          if (-not $published) {
            throw "Failed to publish Brain V19 AUTO scalp after retries"
          }
