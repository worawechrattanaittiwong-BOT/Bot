name: Build MT5 EA

# Unified 1.0.0 release rebuild trigger. The workflow compiles the current
# V20/RACE-isolated source without changing trading logic.
# Rebuild current 1.0.0 binary after the market-closed heartbeat transport fix.
# Rebuild current 1.0.0 binary after adding current-quote telemetry for the
# in-memory 15-minute flowing dashboard chart.

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mt5/FastBasketBot.mq5"
      - ".github/workflows/build-mt5-ea.yml"

permissions:
  contents: write

jobs:
  compile:
    if: ${{ !contains(github.event.head_commit.message, '[skip ea build]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install official MetaTrader 5 build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          $installDir = "C:\SCENOVA-MT5-Build"
          Invoke-WebRequest -UseBasicParsing -Uri "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto /path:`"$installDir`"" -Wait
          $metaEditor = Get-ChildItem -Path $installDir -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaEditor) { throw "metaeditor64.exe was not installed" }
          "METAEDITOR=$($metaEditor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate current V20 AUTO and isolated RACE source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mq5Path = (Resolve-Path "mt5\FastBasketBot.mq5").Path
          $text = [System.IO.File]::ReadAllText($mq5Path)

          $propertyMatch = [regex]::Match($text, '#property\s+version\s+"([^"]+)"')
          $runtimeMatch = [regex]::Match($text, '#define\s+SCENOVA_EA_VERSION\s+"([^"]+)"')
          if (-not $propertyMatch.Success -or -not $runtimeMatch.Success) {
            throw "EA version metadata missing"
          }
          $eaVersion = $propertyMatch.Groups[1].Value
          $runtimeVersion = $runtimeMatch.Groups[1].Value
          if ($eaVersion -ne $runtimeVersion) {
            throw "EA version mismatch: property=$eaVersion runtime=$runtimeVersion"
          }
          "EA_VERSION=$eaVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

          foreach ($sentinel in @(
            'bool AutoV20Enabled()',
            'return g_engineMode == "AUTO" && g_controlMode == "AUTO";',
            'AUTO_V20_SIDE g_autoV20Buy;',
            'AUTO_V20_SIDE g_autoV20Sell;',
            'void AutoV20UpdateTrendPhase(double momentum)',
            'void AutoV20EvaluateSide(',
            'autoV20Diagnostics=StringFormat',
            'g_basketJournalAutoDecisionId',
            'if(!AutoV20Enabled() && BasketFillEnabled() && g_burstActive)',
            'int RaceM5CandleDirection()',
            'CopyRates(_Symbol, PERIOD_M5, 1, 1, rates)',
            'RACE_DIRECTION_LOCK',
            'RACE_MIXED_BASKET_BLOCK',
            'RACE_M5_OPPOSITE_CONFIRMED',
            'RACE_M5_SEVERE_REVERSAL',
            'int RaceHarvestProfitablePositions()',
            'RACE_PROFIT_HARVEST',
            'RACE_HARVEST_REFILL',
            'SaaSRace',
            'bool ZeroGridModeEnabled()',
            'ZERO_GRID_DEMO_ONLY',
            'SaaSZeroGrid',
            'TradePermissionStatus',
            'AdaptiveSpreadAllowed',
            'OrderSendWithPriceRetry',
            'CONTROL_NOT_FRESH',
            'NO_ACCESS'
          )) {
            if (-not $text.Contains($sentinel)) {
              throw "Required V20/RACE sentinel missing: $sentinel"
            }
          }

          if ($text.Contains('StringFind(InpApiBase, "http://") == 0')) {
            throw "Plain HTTP API configuration is still accepted"
          }

          $sourceDir = "C:\SCENOVA-EA-Source"
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
          $source = Join-Path $sourceDir "FastBasketBot.mq5"
          Copy-Item -Force $mq5Path $source
          "EA_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile current private MQ5 to EX5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $log = "$env:RUNNER_TEMP\FastBasketBot-compile.log"
          Start-Process -FilePath "$env:METAEDITOR" -ArgumentList "/compile:`"$env:EA_SOURCE`" /log:`"$log`"" -Wait
          if (Test-Path $log) { Get-Content $log }
          $ex5 = [System.IO.Path]::ChangeExtension($env:EA_SOURCE, ".ex5")
          if (-not (Test-Path $ex5)) { throw "FastBasketBot.ex5 was not produced" }
          if (Test-Path $log) {
            $compileLog = Get-Content $log -Raw
            if ($compileLog -match '(?i)\b[1-9][0-9]*\s+errors?\b') {
              throw "MetaEditor reported compile errors"
            }
          }
          Copy-Item -Force $ex5 "$env:RUNNER_TEMP\FastBasketBot.ex5"
          $hash = (Get-FileHash -Algorithm SHA256 $ex5).Hash.ToLowerInvariant()
          @{
            file = "FastBasketBot.ex5"
            sha256 = $hash
            eaVersion = $env:EA_VERSION
            sourceCommit = "${{ github.sha }}"
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
            brain = "V20"
            policy = "AUTO_V20_CENTRAL_DECISION_AUDIT_STATS_RACE_ISOLATED"
          } | ConvertTo-Json | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\FastBasketBot-manifest.json"

      - name: Publish current V20 compiled artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"

          $published = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            Write-Host "EA Brain V20 publish attempt $attempt/6"
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 2; continue }

            git diff --quiet "${{ github.sha }}" origin/main -- mt5/FastBasketBot.mq5
            if ($LASTEXITCODE -eq 1) {
              Write-Host "A newer EA source exists on main; skipping obsolete compiled artifact."
              exit 0
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not compare EA source with latest main" }

            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { throw "Could not reset to latest main" }
            New-Item -ItemType Directory -Force -Path "mt5\release" | Out-Null
            Copy-Item -Force "$env:RUNNER_TEMP\FastBasketBot.ex5" "mt5\release\FastBasketBot.ex5"
            Copy-Item -Force "$env:RUNNER_TEMP\FastBasketBot-manifest.json" "mt5\release\manifest.json"

            git add -f mt5/release/FastBasketBot.ex5
            git add mt5/release/manifest.json
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host "V20 compiled artifact is already current."
              $published = $true
              break
            }
            if ($LASTEXITCODE -ne 1) { throw "Could not inspect generated V20 changes" }

            git commit -m "build: publish EA Brain V20 v$env:EA_VERSION [skip ea build]"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit V20 artifact" }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $published = $true; break }
            Start-Sleep -Seconds 2
          }

          if (-not $published) { throw "Failed to publish Brain V20 after retries" }
