name: Build MT5 EA

# Official compile/publish pipeline for AUTO + VECTOR EDGE, FLIP LOCK,
# RACE and ZERO GRID.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mt5/FastBasketBot.mq5"
      - "mt5/ScenovaSymbolProbe.mq5"
      - "mt5/include/**"
      - ".github/workflows/build-mt5-ea.yml"
  pull_request:
    paths:
      - "mt5/FastBasketBot.mq5"
      - "mt5/ScenovaSymbolProbe.mq5"
      - "mt5/include/**"
      - ".github/workflows/build-mt5-ea.yml"

permissions:
  contents: write

jobs:
  compile:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ea build]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install official MetaTrader 5 build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          $installDir = "C:\SCENOVA-MT5-Build"
          Invoke-WebRequest -UseBasicParsing -Uri "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto /path:`"$installDir`"" -Wait
          $metaEditor = Get-ChildItem -Path $installDir -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaEditor) { throw "metaeditor64.exe was not installed" }
          "METAEDITOR=$($metaEditor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stamp immutable runtime build identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mq5Path = (Resolve-Path "mt5\FastBasketBot.mq5").Path
          $buildId = "${{ github.sha }}"
          $text = [System.IO.File]::ReadAllText($mq5Path)
          $pattern = '#define\s+SCENOVA_BUILD_ID\s+"[^"]*"'
          if (-not [regex]::IsMatch($text, $pattern)) { throw "EA build identity marker missing" }
          $replacement = '#define SCENOVA_BUILD_ID "' + $buildId + '"'
          $stamped = [regex]::Replace($text, $pattern, $replacement, 1)
          [System.IO.File]::WriteAllText($mq5Path, $stamped, [System.Text.UTF8Encoding]::new($false))
          "EA_BUILD_ID=$buildId" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate production runtime source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mq5Path = (Resolve-Path "mt5\FastBasketBot.mq5").Path
          $text = [System.IO.File]::ReadAllText($mq5Path)

          $propertyMatch = [regex]::Match($text, '#property\s+version\s+"([^"]+)"')
          $runtimeMatch = [regex]::Match($text, '#define\s+SCENOVA_EA_VERSION\s+"([^"]+)"')
          if (-not $propertyMatch.Success -or -not $runtimeMatch.Success) { throw "EA version metadata missing" }
          $eaVersion = $propertyMatch.Groups[1].Value
          if ($eaVersion -ne $runtimeMatch.Groups[1].Value) { throw "EA version metadata mismatch" }
          $contractMatch = [regex]::Match($text, '#define\s+SCENOVA_RUNTIME_CONTRACT\s+"([^"]+)"')
          if (-not $contractMatch.Success) { throw "EA runtime contract metadata missing" }
          $buildMatch = [regex]::Match($text, '#define\s+SCENOVA_BUILD_ID\s+"([^"]+)"')
          if (-not $buildMatch.Success -or $buildMatch.Groups[1].Value -ne $env:EA_BUILD_ID) {
            throw "EA build identity stamp mismatch"
          }
          "EA_VERSION=$eaVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EA_RUNTIME_CONTRACT=$($contractMatch.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EA_SOURCE=$mq5Path" | Out-File -FilePath $env:GITHUB_ENV -Append

          foreach ($sentinel in @(
            'bool AutoEnabled()',
            'g_controlMode == "FLIP_LOCK"',
            '#include "include\\AutoVectorEdgeLive.mqh"',
            '#include "include\\FlipLockV1.mqh"',
            'AutoVectorEdgeLiveAllow',
            'FlipLockManage',
            '#define RACE_VOLUME_WINDOW_SECONDS 30',
            'int RaceVolumeDirection()',
            'bool ZeroGridModeEnabled()',
            'request.action=TRADE_ACTION_PENDING;',
            'ORDER_TYPE_BUY_STOP',
            'ORDER_TYPE_SELL_STOP',
            'bool   g_settingsSynchronized = false;',
            'TradePermissionStatus',
            'AdaptiveSpreadAllowed'
          )) {
            if (-not $text.Contains($sentinel)) { throw "Required runtime sentinel missing: $sentinel" }
          }

          foreach ($module in @(
            'mt5\include\AutoVectorEdge.mqh',
            'mt5\include\AutoVectorEdgeLive.mqh',
            'mt5\include\FlipLockV1.mqh'
          )) {
            if (-not (Test-Path $module)) { throw "Required module missing: $module" }
          }

          if ($text.Contains('StringFind(InpApiBase, "http://") == 0')) {
            throw "Plain HTTP API configuration is still accepted"
          }

      - name: Compile current private MQ5 to EX5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $log = "$env:RUNNER_TEMP\FastBasketBot-compile.log"
          Start-Process -FilePath "$env:METAEDITOR" -ArgumentList "/compile:`"$env:EA_SOURCE`" /log:`"$log`"" -Wait
          if (Test-Path $log) { Get-Content $log }
          $ex5 = [System.IO.Path]::ChangeExtension($env:EA_SOURCE, ".ex5")
          if (-not (Test-Path $ex5)) { throw "FastBasketBot.ex5 was not produced" }
          if (Test-Path $log) {
            $compileLog = Get-Content $log -Raw
            if ($compileLog -match '(?i)\b[1-9][0-9]*\s+errors?\b') { throw "MetaEditor reported compile errors" }
          }
          Copy-Item -Force $ex5 "$env:RUNNER_TEMP\FastBasketBot.ex5"

          $probeSource = (Resolve-Path "mt5\ScenovaSymbolProbe.mq5").Path
          $probeLog = "$env:RUNNER_TEMP\ScenovaSymbolProbe-compile.log"
          Start-Process -FilePath "$env:METAEDITOR" -ArgumentList "/compile:`"$probeSource`" /log:`"$probeLog`"" -Wait
          if (Test-Path $probeLog) { Get-Content $probeLog }
          $probeEx5 = [System.IO.Path]::ChangeExtension($probeSource, ".ex5")
          if (-not (Test-Path $probeEx5)) { throw "ScenovaSymbolProbe.ex5 was not produced" }
          if (Test-Path $probeLog) {
            $probeCompileLog = Get-Content $probeLog -Raw
            if ($probeCompileLog -match '(?i)\b[1-9][0-9]*\s+errors?\b') { throw "MetaEditor reported probe compile errors" }
          }
          Copy-Item -Force $probeEx5 "$env:RUNNER_TEMP\ScenovaSymbolProbe.ex5"

          $hash = (Get-FileHash -Algorithm SHA256 $ex5).Hash.ToLowerInvariant()
          $probeHash = (Get-FileHash -Algorithm SHA256 $probeEx5).Hash.ToLowerInvariant()
          @{
            file = "FastBasketBot.ex5"
            sha256 = $hash
            eaVersion = $env:EA_VERSION
            runtimeContract = $env:EA_RUNTIME_CONTRACT
            buildId = $env:EA_BUILD_ID
            sourceCommit = "${{ github.sha }}"
            probeFile = "ScenovaSymbolProbe.ex5"
            probeSha256 = $probeHash
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
            brain = "AUTO"
            policy = "AUTO"
          } | ConvertTo-Json | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\FastBasketBot-manifest.json"

      - name: Publish compiled artifact on main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          $published = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 2; continue }

            git diff --quiet "${{ github.sha }}" origin/main -- mt5/FastBasketBot.mq5 mt5/ScenovaSymbolProbe.mq5 mt5/include
            if ($LASTEXITCODE -eq 1) {
              Write-Host "A newer EA source exists on main; skipping obsolete compiled artifact."
              exit 0
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not compare EA source with latest main" }

            git reset --hard origin/main
            New-Item -ItemType Directory -Force -Path "mt5\release" | Out-Null
            Copy-Item -Force "$env:RUNNER_TEMP\FastBasketBot.ex5" "mt5\release\FastBasketBot.ex5"
            Copy-Item -Force "$env:RUNNER_TEMP\ScenovaSymbolProbe.ex5" "mt5\release\ScenovaSymbolProbe.ex5"
            Copy-Item -Force "$env:RUNNER_TEMP\FastBasketBot-manifest.json" "mt5\release\manifest.json"
            git add -f mt5/release/FastBasketBot.ex5 mt5/release/ScenovaSymbolProbe.ex5
            git add mt5/release/manifest.json
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { $published = $true; break }
            if ($LASTEXITCODE -ne 1) { throw "Could not inspect generated EA changes" }

            git commit -m "build: publish EA v$env:EA_VERSION [skip ea build]"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit EA artifact" }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $published = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $published) { throw "Failed to publish EA artifact after retries" }
