name: Build MT5 EA

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mt5/FastBasketBot.mq5"
      - "scripts/upgrade-ea-brain-v8.ps1"
      - "scripts/upgrade-ea-brain-v9.ps1"
      - "scripts/upgrade-ea-brain-v10.ps1"
      - "scripts/upgrade-ea-brain-v11.ps1"
      - ".github/workflows/build-mt5-ea.yml"

permissions:
  contents: write

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install official MetaTrader 5 build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          $installDir = "C:\SCENOVA-MT5-Build"
          Invoke-WebRequest -UseBasicParsing -Uri "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto /path:`"$installDir`"" -Wait
          $metaEditor = Get-ChildItem -Path $installDir -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaEditor) { throw "metaeditor64.exe was not installed" }
          "METAEDITOR=$($metaEditor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply EA Brain V10 policy plus V11 starvation fix and prepare private source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & ".\scripts\upgrade-ea-brain-v10.ps1" -Path "mt5\FastBasketBot.mq5"
          & ".\scripts\upgrade-ea-brain-v11.ps1" -Path "mt5\FastBasketBot.mq5"

          $mq5Path = (Resolve-Path "mt5\FastBasketBot.mq5").Path
          $patchedText = [System.IO.File]::ReadAllText($mq5Path)

          if ($patchedText -notmatch '#property\s+version\s+"1\.050"') {
            throw "Brain V11 patch did not produce EA 1.050"
          }
          foreach ($sentinel in @(
            'BrainV8LocalZoneBlocked',
            'BrainV8BasketAdverseMove',
            'BrainV8HandleBasketReversal',
            'BrainV9ModelConfirmationReady',
            'BrainV10ApplyTrendPhasePolicy',
            'BrainV10ContinuationReady',
            'BrainV10RecentPullbackContinuation',
            'DOWNTREND_PULLBACK_CONTINUATION',
            'UPTREND_PULLBACK_CONTINUATION',
            'STRONG_DOWN_WAIT_PULLBACK_SELL',
            'STRONG_DOWN_NO_SELL_WAIT_BUY',
            'STRONG_UP_WAIT_PULLBACK_BUY',
            'STRONG_UP_NO_BUY_WAIT_SELL',
            'INSUFFICIENT_TARGET_ROOM',
            'UserDirectionAllows',
            'USER_DIRECTION_LOCK',
            'OrderSendWithPriceRetry',
            'CLOSE_REASON_BRAIN_REVERSAL',
            'WAITING_CONFIDENCE_EXTREME',
            'MathMin(6.0, g_consecutiveLosses * 1.5)',
            'HttpPostJsonTimeout(url, payload, response, 1200)'
          )) {
            if (-not $patchedText.Contains($sentinel)) {
              throw "Brain V11 sentinel missing: $sentinel"
            }
          }

          if ($patchedText.Contains('StringFind(InpApiBase, "http://") == 0')) {
            throw "Plain HTTP API configuration is still accepted"
          }
          if ($patchedText.Contains('rawDirection = BrainV8ApplyContrarianPolicy(rawDirection, momentum);')) {
            throw "Legacy Brain V8 policy still bypasses the direction lock"
          }
          if ($patchedText.Contains('rawDirection = BrainV9ApplyExhaustionPolicy(rawDirection, momentum);')) {
            throw "Legacy Brain V9 policy still bypasses the trend-phase policy"
          }
          if ($patchedText.Contains('if(!BrainV8PullbackConfirmationReady(rawDirection, momentum))')) {
            throw "Legacy global pullback gate still overrides model-aware confirmation"
          }
          if ($patchedText.Contains('score -= MathMin(15.0, g_consecutiveLosses * 4.0);')) {
            throw "Legacy self-locking loss-streak penalty is still present"
          }

          $patchedSource = "$env:RUNNER_TEMP\FastBasketBot-BrainV11.mq5"
          Copy-Item -Force $mq5Path $patchedSource
          "PATCHED_EA_SOURCE=$patchedSource" | Out-File -FilePath $env:GITHUB_ENV -Append

          $sourceDir = "C:\SCENOVA-EA-Source"
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
          $source = Join-Path $sourceDir "FastBasketBot.mq5"
          Copy-Item -Force $mq5Path $source
          "EA_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile private MQ5 to EX5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $log = "$env:RUNNER_TEMP\FastBasketBot-compile.log"
          Start-Process -FilePath "$env:METAEDITOR" -ArgumentList "/compile:`"$env:EA_SOURCE`" /log:`"$log`"" -Wait
          if (Test-Path $log) { Get-Content $log }
          $ex5 = [System.IO.Path]::ChangeExtension($env:EA_SOURCE, ".ex5")
          if (-not (Test-Path $ex5)) { throw "FastBasketBot.ex5 was not produced" }
          if (Test-Path $log) {
            $compileLog = Get-Content $log -Raw
            if ($compileLog -match '(?i)\b[1-9][0-9]*\s+errors?\b') {
              throw "MetaEditor reported compile errors"
            }
          }
          New-Item -ItemType Directory -Force -Path "mt5\release" | Out-Null
          Copy-Item -Force $ex5 "mt5\release\FastBasketBot.ex5"
          $hash = (Get-FileHash -Algorithm SHA256 "mt5\release\FastBasketBot.ex5").Hash.ToLowerInvariant()
          $sourceText = Get-Content "$env:EA_SOURCE" -Raw
          $versionMatch = [regex]::Match($sourceText, '#property\s+version\s+"([^"]+)"')
          if (-not $versionMatch.Success) { throw "EA #property version was not found" }
          $eaVersion = $versionMatch.Groups[1].Value
          @{
            file = "FastBasketBot.ex5"
            sha256 = $hash
            eaVersion = $eaVersion
            sourceCommit = "${{ github.sha }}"
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
            brain = "V11"
            policy = "V10_TREND_PHASE_PLUS_CONFIDENCE_STARVATION_FIX"
          } | ConvertTo-Json | Set-Content -Encoding UTF8 "mt5\release\manifest.json"

      - name: Publish Brain V11 source and compiled artifact to private repository
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $compiledEx5 = "$env:RUNNER_TEMP\FastBasketBot.ex5"
          $compiledManifest = "$env:RUNNER_TEMP\FastBasketBot-manifest.json"
          Copy-Item -Force "mt5\release\FastBasketBot.ex5" $compiledEx5
          Copy-Item -Force "mt5\release\manifest.json" $compiledManifest

          git config user.name "SCENOVA Build Bot"
          git config user.email "actions@users.noreply.github.com"

          $published = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            Write-Host "EA Brain V11 publish attempt $attempt/6"
            git fetch origin main
            if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 2
              continue
            }

            git diff --quiet "${{ github.sha }}" origin/main -- mt5/FastBasketBot.mq5
            if ($LASTEXITCODE -eq 1) {
              Write-Host "A newer FastBasketBot.mq5 exists on main; skipping obsolete Brain V11 publish."
              exit 0
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Could not compare MT5 EA source with latest main"
            }

            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { throw "Could not reset to latest main" }

            Copy-Item -Force $env:PATCHED_EA_SOURCE "mt5\FastBasketBot.mq5"
            New-Item -ItemType Directory -Force -Path "mt5\release" | Out-Null
            Copy-Item -Force $compiledEx5 "mt5\release\FastBasketBot.ex5"
            Copy-Item -Force $compiledManifest "mt5\release\manifest.json"

            git add mt5/FastBasketBot.mq5
            git add -f mt5/release/FastBasketBot.ex5
            git add mt5/release/manifest.json
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Brain V11 source and artifact are already current."
              $published = $true
              break
            }
            if ($LASTEXITCODE -ne 1) {
              throw "Could not inspect generated EA changes"
            }

            git commit -m "build: publish EA Brain V11 v1.050 [skip ea build]"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit Brain V11 EA" }

            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              $published = $true
              break
            }

            Write-Host "Main moved while publishing Brain V11; retrying..."
            Start-Sleep -Seconds 2
          }

          if (-not $published) {
            throw "Failed to publish EA Brain V11 after retries"
          }
