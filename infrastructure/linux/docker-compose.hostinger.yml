services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://bot:${POSTGRES_PASSWORD}@postgres:5432/bot
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_KEY: ${ADMIN_KEY}
      WORKER_KEY: ${WORKER_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY}
      OMISE_SECRET_KEY: ${OMISE_SECRET_KEY:-}
      CLOUD_CHECKOUT_ENABLED: ${CLOUD_CHECKOUT_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      THAIBULKSMS_API_KEY: ${THAIBULKSMS_API_KEY:-}
      THAIBULKSMS_API_SECRET: ${THAIBULKSMS_API_SECRET:-}
      THAIBULKSMS_SENDER: ${THAIBULKSMS_SENDER:-}
      TRIAL_IDENTITY_SECRET: ${TRIAL_IDENTITY_SECRET:-}
      TRIAL_SMS_DAYS: ${TRIAL_SMS_DAYS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [internal]

  web:
    build:
      context: ../..
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /backend
        NEXT_PUBLIC_MT5_API_BASE: ${PUBLIC_WEB_URL}/backend
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: /backend
      NEXT_PUBLIC_MT5_API_BASE: ${PUBLIC_WEB_URL}/backend
    depends_on: [api]
    ports:
      - "${BOT_WEB_PORT:-3100}:3000"
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
