services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: ../../.env
    depends_on: [postgres, redis]
    ports:
      - "127.0.0.1:4000:4000"
    networks: [internal]

  web:
    build:
      context: ../..
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
